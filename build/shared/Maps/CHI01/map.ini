; Reborn: Larger firestorm only for CHI01's MiG cinematic; retain normal damage and six-second lifetime.
ObjectInherit Reborn_CHI01Firestorm FirestormSmall
  ReplaceModule ModuleTag_03
    Behavior = FirestormDynamicGeometryInfoUpdate ModuleTag_CHI01Firestorm
      InitialDelay       = 800
      InitialHeight      = 10.0
      InitialMajorRadius = 1.0
      FinalHeight        = 10.0
      FinalMajorRadius   = 120.0
      TransitionTime     = 3000
      ReverseAtTransitionTime = Yes
      ScorchSize      = 100.0
      ParticleOffsetZ = 0.1
      ParticleSystem1 = FireStormMain
      ParticleSystem2 = FireStormMainRing
      FXList          = FX_FireStorm
      DelayBetweenDamageFrames = 500
      DamageAmount             = 100.0
    End
  End
End


; Reborn: Restore original burning art for nearby CHI01 cinematic trees only.
ObjectInherit Reborn_CHI01_TreeBirch02 GenericTree

  ; *** ART Parameters ***
  ReplaceModule ModuleTag_01
    Draw = W3DModelDraw ModuleTag_CHI01_TreeBirch02
      DefaultConditionState
        Model = PTXBirch02
      End
      ; ConditionState placeholders
      ConditionState      = AFLAME ;Currently on fire
        Model             = PTXBirch02
        ParticleSysBone   = AFlame01 FireTreeSmall
        ParticleSysBone   = AFlame01 SmoulderTree1
        ParticleSysBone   = AFlame01 FireTreeSparks
      End
      ConditionState      = AFLAME SMOLDERING ;at the end of on fire, still has flames, but skeleton is burned
        Model             = PTXBirch06_B
        ParticleSysBone   = AFlame01 FireTreeSmaller
        ParticleSysBone   = AFlame01 SmoulderTree1
        ParticleSysBone   = AFlame01 FireTreeSparks
      End
      ConditionState      = SMOLDERING; will never catch fire again.  burned out
        Model             = PTXBirch06_B
        ParticleSysBone   = AFlame01 SmoulderTree2
        ParticleSysBone   = AFlame01 SmoulderTree3
      End
      ConditionState      = BURNED; all burned and black and no effects
        Model             = PTXBirch06_B
      End
    End
  End

  Geometry = CYLINDER
  GeometryIsSmall = Yes
  GeometryMajorRadius = 3.0
  GeometryHeight = 15
;  Shadow = SHADOW_DECAL
;  InstanceScaleFuzziness = 0.1

End

