FAQ DisplayMode
  Title = "Display Mode FAQ"

  Entry
    Question = "I get an error saying binkw32.dll or mss32.dll was not found. How do I fix it?"
    Answer = "Make sure Reborn Omega is installed directly into a working Command & Conquer Generals Zero Hour game directory. binkw32.dll and mss32.dll are original Zero Hour game files and are not provided by Reborn Omega. If either file is missing, verify that your base Zero Hour installation works correctly and that you selected the correct game folder when installing the mod."
  End
  
  Entry
    Question = "The game runs at very low FPS even on a high-end PC. How do I fix it?"
    Answer = "Launch Reborn Omega in Borderless Windowed mode instead of Fullscreen. You can select Borderless Windowed when the game starts. Alternatively, create a shortcut to the Reborn Omega executable and add -win to the shortcut target to launch the game in windowed mode."
  End
  
  Entry
    Question = "Edge scrolling does not work. Can I enable it?"
    Answer = "Yes, but edge scrolling in Borderless Windowed mode can be buggy. To enable it, open Options.ini and set both ScreenEdgeScrollEnabledInWindowedApp and CursorCaptureEnabledInWindowedGame to yes. If either option is missing, add it manually."
  End
End
