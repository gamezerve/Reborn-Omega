      Animation         = UBSNKATK_1ANM.UBSNKATK_1ANM
      AnimationMode     = ONCE
    End
    ConditionState      = DAMAGED NIGHT
      Model             = UBSNATK_E
    End
    ConditionState      = REALLYDAMAGED RUBBLE NIGHT
      Model             = UBSNATK_R
