  ; *** ART Parameters ***

  SelectPortrait         = SUTunnel_L
  ButtonImage            = SUTunnel_L
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes

    ;***NONE

     ConditionState     = NONE
      Model             = UBSNKATK_1ANM
      Animation         = UBSNKATK_1ANM.UBSNKATK_1ANM
      AnimationMode     = ONCE
      ParticleSysBone   = DIRT SneakAttackCrackDust 
