;------------------------------------------------------------------------------
; Reborn: Inherit the USA Patriot Battery and keep only the Air Force General differences.
ObjectInherit AirF_AmericaPatriotBattery AmericaPatriotBattery

  ; ***DESIGN parameters ***
  Side              = AmericaAirForceGeneral

  ReplaceModule Prerequisites
    Object = AirF_AmericaPowerPlant
  End

  ; *** ENGINEERING Parameters ***
  OverrideModule ModuleTag_07
    LaserFromAssisted = AirF_PatriotBinaryDataStream ; Stream to draw from the requestor to me
    LaserToTarget = AirF_PatriotBinaryDataStream     ; Stream to draw from me to the target
  End

  OverrideModule ModuleTag_09
    CreationList  = AirF_OCL_AmericanRangerDebris03
  End

End
;------------------------------------------------------------------------------
