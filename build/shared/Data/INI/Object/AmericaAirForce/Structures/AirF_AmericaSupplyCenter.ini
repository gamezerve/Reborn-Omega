;------------------------------------------------------------------------------
ObjectInherit AirF_AmericaSupplyCenter AmericaSupplyCenter

  ; *** ART Parameters ***
  SelectPortrait         = AirF_SASupplyCntr
  ButtonImage            = AirF_SASupplyCntr

  ; ***DESIGN parameters ***
  Side                   = AmericaAirForceGeneral
  ReplaceModule Prerequisites
    Object = AirF_AmericaPowerPlant
  End
  CommandSet             = AirF_AmericaSupplyCenterCommandSet

  ; *** ENGINEERING Parameters ***
  ; Reborn: Preserve the faction-specific Rangers released when the completed supply center is destroyed.
  OverrideModule ModuleTag_08
    CreationList = AirF_OCL_AmericanRangerDebris03
  End

  ; Reborn: Spawn the faction-specific supply Chinook.
  OverrideModule ModuleTag_12
    SpawnTemplateNameOverride = AFG_AmericaVehicleChinook
  End

End
;------------------------------------------------------------------------------
