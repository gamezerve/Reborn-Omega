ObjectInherit AirF_AmericaAirfield AmericaAirfield

  ; *** ART Parameters ***
  ; Reborn: Inherit all shared airfield draws, including the construction-state fixes.
  SelectPortrait         = AirF_SAACommand
  ButtonImage            = AirF_SAACommand

  ; ***DESIGN parameters ***
  Side                   = AmericaAirForceGeneral
  ; Reborn: Keep the faction's original supply-center prerequisite.
  ReplaceModule Prerequisites
    Object = AirF_AmericaSupplyCenter
  End
  BuildCost              = 800
  CommandSet             = AirF_AmericaAirfieldCommandSet

  ; *** ENGINEERING Parameters ***
  ; Reborn: Keep Air Force health and subdual limits while inheriting the shared body settings.
  OverrideModule ModuleTag_10
    MaxHealth         = 2500.0
    InitialHealth     = 2500.0
    SubdualDamageCap  = 2700
  End

  ; Reborn: Preserve the faction-specific Rangers released when the completed airfield is destroyed.
  OverrideModule ModuleTag_16
    CreationList = AirF_OCL_AmericanRangerDebris02
  End

End
