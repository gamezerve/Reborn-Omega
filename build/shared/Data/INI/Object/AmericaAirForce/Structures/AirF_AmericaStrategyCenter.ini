;//////////////////////////////////////////////////////////////////////////////
;FILE: AirF_AmericaStrategyCenter.ini /////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
ObjectInherit AirF_AmericaStrategyCenter AmericaStrategyCenter

  ; *** ART Parameters ***
  SelectPortrait         = AirF_SAStrategyCenter
  ButtonImage            = AirF_SAStrategyCenter

  ; ***DESIGN parameters ***
  Side                   = AmericaAirForceGeneral
  ReplaceModule Prerequisites
    Object = AirF_AmericaWarFactory AirF_AmericaAirfield
  End
  CommandSet             = AirF_AmericaStrategyCenterCommandSet

  ; *** ENGINEERING Parameters ***
  ; Reborn: Preserve the faction-specific Rangers released when the completed strategy center is destroyed.
  OverrideModule ModuleTag_19
    CreationList = AirF_OCL_AmericanRangerDebris04
  End

  ; Reborn: Call in the faction-specific Special Forces.
  OverrideModule ModuleTag_24
    OCL = AirF_SUPERWEAPON_SpecialForces
  End

  ; Reborn: Air Force strategy centers also provide the Carpet Bomb special power.
  AddModule
    Behavior = OCLSpecialPower ModuleTag_25
      SpecialPowerTemplate = AirF_SuperweaponCarpetBomb
      OCL                  = AirF_SUPERWEAPON_CarpetBomb
      CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
    End
  End

End
;------------------------------------------------------------------------------
