; Also known as the Ambulance
; Reborn: Inherit the standard Ambulance while retaining Air Force pricing, production image and drones.
ObjectInherit AirF_AmericaVehicleMedic AmericaVehicleMedic
  Side = AmericaAirForceGeneral

  BuildCost = 725

  ReplaceModule Prerequisites
    Object = AirF_AmericaWarFactory
  End

  OverrideModule ModuleTag_09
    UpgradeObject = AirF_OCL_AmericanBattleDrone
  End

  OverrideModule ModuleTag_10
    UpgradeObject = AirF_OCL_AmericanScoutDrone
  End

  OverrideModule ModuleTag_19
    UpgradeObject = AirF_OCL_AmericanHellfireDrone
  End

  OverrideModule ModuleTag_ImageUpgrade
    NewCommandButtonImage = AirF_SARAmblnce_L_CB
  End
End
