;//////////////////////////////////////////////////////////////////////////////
;FILE: AirF_AmericaVehicleComanche.ini ////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
ObjectInherit AirF_AmericaVehicleComanche AmericaVehicleComanche

  ; *** ART Parameters ***
  SelectPortrait         = AirF_SACCommanche
  ButtonImage            = AirF_SACCommanche

  UpgradeCameo4 = AirF_Upgrade_StealthComanche

  ReplaceModule ModuleTag_01
    Draw = W3DModelDraw AirF_ModuleTag_01

      DefaultConditionState
        Model                           = AVComancheAG
        HideSubObject                   = MissileUpgrade
        Animation                       = AVComancheAG.AVComancheAG
        AnimationMode                   = LOOP
        WeaponMuzzleFlash               = PRIMARY TurretFX
        WeaponFireFXBone                = PRIMARY Muzzle
        WeaponFireFXBone                = SECONDARY Muzzle
        WeaponLaunchBone                = SECONDARY Muzzle
      End

      ConditionState = REALLYDAMAGED
        Model                           = AVComancheAG_d
        Animation                       = AVComancheAG_d.AVComancheAG_d
        AnimationMode                   = LOOP
      End

      ConditionState = WEAPONSET_PLAYER_UPGRADE
        ShowSubObject                   = MissileUpgrade
        Animation                       = AVComancheAG.AVComancheAG
        AnimationMode                   = LOOP
        WeaponFireFXBone                = TERTIARY WeaponB
        WeaponLaunchBone                = TERTIARY WeaponB
      End

      ConditionState = WEAPONSET_PLAYER_UPGRADE REALLYDAMAGED
        Model                           = AVComancheAG_d
        ShowSubObject                   = MissileUpgrade
        Animation                       = AVComancheAG_d.AVComancheAG_d
        AnimationMode                   = LOOP
        WeaponFireFXBone                = TERTIARY WeaponB
        WeaponLaunchBone                = TERTIARY WeaponB
      End

      ConditionState = RUBBLE
        Model                           = AVComancheAG_d
        Animation                       = AVComancheAG_d.AVComancheAG_d
        AnimationMode                   = LOOP
      End

      ConditionState = RUBBLE SPECIAL_DAMAGED
        Model                           = AVComancheAG_d
        HideSubObject                   = AVComanche_Prop
      End

      ConditionState = WEAPONSET_PLAYER_UPGRADE RUBBLE
        Model                           = AVComancheAG_d
        ShowSubObject                   = MissileUpgrade
        Animation                       = AVComancheAG_d.AVComancheAG_d
        AnimationMode                   = LOOP
      End

      ConditionState = WEAPONSET_PLAYER_UPGRADE RUBBLE SPECIAL_DAMAGED
        Model                           = AVComancheAG_d
        ShowSubObject                   = MissileUpgrade
        HideSubObject                   = AVComanche_Prop
      End

      OkToChangeModelColor = Yes
    End
  End

  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:StealthComanche
  Side                = AmericaAirForceGeneral

  ReplaceModule Prerequisites
    Object            = AirF_AmericaAirfield
  End

  ArmorSet
    Conditions        = None
    Armor             = AFG_ComancheArmor
    DamageFX          = None
  End

  ArmorSet
    Conditions        = PLAYER_UPGRADE
    Armor             = AFG_CountermeasuresComancheArmor
    DamageFX          = None
  End

  BuildCost           = 1200
  ;CommandSet          = AirF_AmericaVehicleComancheCommandSet ; Reborn: No need for override as it is exactly the same with base version

  ; *** AUDIO Parameters ***
  VoiceSelect         = StealthComancheVoiceSelect

  ; *** ENGINEERING Parameters ***
  AddModule
    Behavior = StealthUpdate ModuleTag_22
      StealthDelay                          = 1500 ; msec
      StealthForbiddenConditions            = FIRING_PRIMARY ATTACKING USING_ABILITY
      FriendlyOpacityMin                    = 50.0%
      FriendlyOpacityMax                    = 100.0%
      InnateStealth                         = No
      OrderIdleEnemiesToAttackMeUponReveal  = Yes
    End

    Behavior = StealthUpgrade ModuleTag_23
      TriggeredBy = AirF_Upgrade_StealthComanche
    End
  End

End
;------------------------------------------------------------------------------
