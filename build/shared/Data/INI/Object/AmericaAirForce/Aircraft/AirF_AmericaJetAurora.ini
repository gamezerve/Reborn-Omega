;//////////////////////////////////////////////////////////////////////////////
;FILE: AirF_AmericaJetAurora.ini //////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
ObjectInherit AirF_AmericaJetAurora AmericaJetAurora

  ; *** ART Parameters ***
  SelectPortrait      = SAHypAurora_L
  ButtonImage         = SAHypAurora_L

  ; Reborn: HyperSonic Aurora models.
  ReplaceModule ModuleTag_01
    Draw = W3DModelDraw AirF_ModuleTag_01

      DefaultConditionState
        Model               = AVAuroraSW
        HideSubObject       = BurnerFX03 BurnerFX04
        WeaponLaunchBone = PRIMARY WeaponA
      End

      ConditionState        = JETEXHAUST
        ; exhaust
        ParticleSysBone     = Wingtip01 JetContrail
        ParticleSysBone     = Wingtip02 JetContrail
      End

      ConditionState        = JETEXHAUST JETAFTERBURNER
        ; exhaust
        ParticleSysBone     = Wingtip01 JetContrail
        ParticleSysBone     = Wingtip02 JetContrail
        ; afterburner
        ShowSubObject       = BurnerFX03 BurnerFX04
        ParticleSysBone     = Engine01 JetLenzflare
        ParticleSysBone     = Engine02 JetLenzflare
      End

      ConditionState        = REALLYDAMAGED
        Model               = AVAuroraSW_D
        ; damage
        ParticleSysBone     = Smoke01 JetSmoke
        ParticleSysBone     = Engine01 JetEngineDamagedSmoke
      End
    
      ConditionState        = REALLYDAMAGED JETEXHAUST
        Model               = AVAuroraSW_D
        ; damage
        ParticleSysBone     = Smoke01 JetSmoke
        ParticleSysBone     = Engine01 JetEngineDamagedSmoke
        ; exhaust
        ParticleSysBone     = Wingtip01 JetContrail
        ParticleSysBone     = Wingtip02 JetContrail
      End

      ConditionState        = REALLYDAMAGED JETEXHAUST JETAFTERBURNER
        Model               = AVAuroraSW_D
        ; damage
        ParticleSysBone     = Smoke01 JetSmoke
        ParticleSysBone     = Engine01 JetEngineDamagedSmoke
        ; afterburner
        ShowSubObject       = BurnerFX03 BurnerFX04
        ParticleSysBone     = Engine01 JetLenzflare
        ParticleSysBone     = Engine02 JetLenzflare
        ; exhaust
        ParticleSysBone     = Wingtip01 JetContrail
        ParticleSysBone     = Wingtip02 JetContrail
      End

      ConditionState        = RUBBLE
        Model               = AVAuroraSW_D1
        HideSubObject       = None 
        ShowSubObject       = None
      End

      ConditionState        = RUBBLE JETEXHAUST JETAFTERBURNER
        Model               = AVAuroraSW_D1
        ;HideSubObject is needed cause there're inherited from default condition state      
        HideSubObject       = None 
        ShowSubObject       = None
        ParticleSysBone     = Engine01 JetExhaust
        ParticleSysBone     = Engine02 JetExhaust
        ; exhaust
        ParticleSysBone     = Wingtip01 JetContrail
        ParticleSysBone     = Wingtip02 JetContrail
      End

      OkToChangeModelColor = Yes
    End
  End

  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:HyperSonicAurora
  Side                = AmericaAirForceGeneral
  ReplaceModule Prerequisites
    Object = AirF_AmericaAirfield
    Object = AirF_AmericaStrategyCenter
  End
  BuildCost           = 2000
  ReplaceModule WeaponSet
    Conditions = None
    Weapon = PRIMARY AuroraClusterBomb
  End

  ; *** AUDIO Parameters ***
  VoiceSelect = HyperAuroraBomberVoiceSelect
  VoiceAttack = HyperAuroraBomberVoiceAttack
  UnitSpecificSounds
    VoiceCreate          = HyperAuroraBomberVoiceCreate
    SoundEject           = PilotSoundEject
    VoiceEject           = PilotVoiceEject
    Afterburner          = RaptorAfterburner
    VoiceLowFuel         = AuroraBomberVoiceLowFuel
    VoiceGarrison        = AuroraBomberVoiceMove
  End

  ; *** ENGINEERING Parameters ***
  OverrideModule ModuleTag_02
    MaxHealth       = 120.0
    InitialHealth   = 120.0
  End

  ; Reborn: Use a fresh AI module so the HyperSonic locomotors can be assigned; the AI settings match the base Aurora.
  ReplaceModule ModuleTag_07
    Behavior = JetAIUpdate AirF_ModuleTag_07
      OutOfAmmoDamagePerSecond    = 10%    ; amount of damage to take per SEC (not per frame) when out of ammo
                                           ; note that it's expressed as a percent of max health, not an absolute
      TakeoffDistForMaxLift       = 0%   ; larger numbers give more lift sooner when taking off
      TakeoffPause                = 500
      MinHeight                   = 5
      SneakyOffsetWhenAttacking   = -20.0  ; this is how far behind us people aim when we are in attack mode
      AttackLocomotorType         = SET_SUPERSONIC
      AttackLocomotorPersistTime  = 100    ; we start slowing down almost immediately
      AttackersMissPersistTime    = 2000   ; but remain untargetable fer a bit longer
      ReturnForAmmoLocomotorType  = SET_SLUGGISH
      ReturnToBaseIdleTime        = 10000         ; if idle for this long, return to base, even if not out of ammo
    End
  End
  Locomotor = SET_NORMAL      HyperAuroraJetLocomotor
  Locomotor = SET_SUPERSONIC  AuroraJetSupersonicLocomotor
  Locomotor = SET_SLUGGISH    HyperAuroraJetSluggishLocomotor
  Locomotor = SET_TAXIING     BasicJetTaxiLocomotor

  ; Reborn: HyperSonic Auroras shoot down incoming missiles.
  AddModule
    Behavior = PointDefenseLaserUpdate ModuleTag_Laser_One
      WeaponTemplate        = AirF_PointDefenseLaser
      PrimaryTargetTypes    = BALLISTIC_MISSILE SMALL_MISSILE
      ScanRate              = 0
      ScanRange             = 200.0
      PredictTargetVelocityFactor = 1.0
    End
  End

End
;------------------------------------------------------------------------------
