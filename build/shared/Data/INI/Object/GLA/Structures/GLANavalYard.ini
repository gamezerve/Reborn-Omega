Object GLANavalYard

  ; *** ART Parameters ***
  SelectPortrait = GLANavalYard
  ButtonImage    = GLANavalYard
  

; ------------ the main factory itself -----------------
  Draw = W3DModelDraw ModuleTag_01
OkToChangeModelColor = Yes  
    ; day **************************************************
    ; day
    ConditionState = NONE
      Model         = UBNavDock
    End
    ConditionState = DAMAGED
      Model         = UBNavDock_D
    End
    ConditionState = REALLYDAMAGED
      Model         = UBNavDock_D
    End
    ConditionState = RUBBLE
      Model         = UBNavDock_D
    End

    ; night *************************************************
    ConditionState = NIGHT
      Model         = UBNavDock
    End
    ConditionState = DAMAGED NIGHT
      Model         = UBNavDock_D
    End
    ConditionState = REALLYDAMAGED NIGHT
      Model         = UBNavDock_D
    End
    ConditionState = RUBBLE NIGHT
      Model         = UBNavDock_D
    End
    
    ; snow *************************************************
    ConditionState = SNOW
      Model         = UBNavDock
    End
    ConditionState = DAMAGED SNOW
      Model         = UBNavDock_D
    End
    ConditionState = REALLYDAMAGED SNOW
      Model         = UBNavDock_D
    End
    ConditionState = RUBBLE SNOW
