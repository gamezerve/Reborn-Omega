  PlacementViewAngle  = -135

  ; ***DESIGN parameters ***
  DisplayName      = OBJECT:NavalYard
  Side             = GLA
  EditorSorting    = STRUCTURE
  Prerequisites
    Object = GLAArmsDealer
  End
  BuildCost        = 1500
  BuildTime        = 15.0           ; in seconds

  EnergyProduction = 0
  CommandSet       = GLANavalYardCommandSet
  VisionRange     = 200.0           ; Shroud clearing distance
  ShroudClearingRange = 200
  ArmorSet
    Conditions      = None
    Armor           = StructureArmor
    DamageFX        = StructureDamageFXNoShake
  End
  ExperienceValue     = 200 200 200 200  ; Experience point value at each level

  ; *** AUDIO Parameters ***
  VoiceSelect           = WarFactoryGLASelect
  SoundOnDamaged        = BuildingDamagedStateLight
  SoundOnReallyDamaged  = BuildingDestroy

  UnitSpecificSounds
    UnderConstruction     = UnderConstructionLoop
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority   = STRUCTURE
  KindOf          = PRELOAD STRUCTURE SELECTABLE IMMOBILE REPAIR_PAD SCORE CAPTURABLE FS_FACTORY AUTO_RALLYPOINT MP_COUNT_FOR_VICTORY FS_WARFACTORY NAVAL_YARD
  Body            = StructureBody ModuleTag_09
    MaxHealth       = 2000.0
    InitialHealth   = 2000.0

    ; Subdual damage "Subdues" you (reaction defined by BodyModule) when it passes your max health.
    ; The cap limits how extra-subdued you can be, and the other numbers detemine how fast it drains away on its own.
    SubdualDamageCap = 2200
    SubdualDamageHealRate = 500
    SubdualDamageHealAmount = 100
  End
  Behavior = ProductionUpdate ModuleTag_10
    NumDoorAnimations            = 1
    DoorOpeningTime              = 3250  ;in mSeconds
    DoorWaitOpenTime             = 3000  ;in mSeconds
    DoorCloseTime                = 4000  ;in mSeconds
    ConstructionCompleteDuration = 1500  ;in mSeconds
  End
  Behavior = DefaultProductionExitUpdate ModuleTag_11
    UnitCreatePoint   = X: 89,363  Y:-26,929   Z:2.0
    NaturalRallyPoint = X: 89,363  Y:-26,929   Z:2.0;NaturalRallyPointX must always match GeometryMajorRadius! -ML
    SpecialObject     = GLAVehiclePTBoat            ; Reborn: Special attributes for Aircraft Carrier spawn (initially obviously)
    SpecialSpawnForwardOffset = 89,363              ; Reborn: Specify a custom UnitCreatePoint for SpecialObject - x axis
    SpecialSpawnLateralOffset = -26,929             ; Reborn: Specify a custom UnitCreatePoint for SpecialObject - y axis
    SpecialObjectSpawnsRotated          = No        ; Reborn: Rotates SpecialObject randomly to either right or left
    SpecialObjectUsesCustomRallyPoint   = Yes       ; Reborn: SpecialObject follows the custom rally point like other units after spawning in its special spawn point
  End
  Behavior = RepairDockUpdate ModuleTag_12
    TimeForFullHeal   = 5000   ;(in milliseconds)     
    NumberApproachPositions = 5
  End
  Behavior = BaseRegenerateUpdate ModuleTag_13
    ;No data
  End 
  
  Behavior             = RebuildHoleExposeDie ModuleTag_06
    HoleName      = GLAHoleNavalYard
    HoleMaxHealth = 500.0
  End
  

  Behavior = TransitionDamageFX ModuleTag_15
    ;-------------DESIGNED FOR MEDIUM SIZED FACTION BUILDING TRANSITIONS-------------------
    DamagedParticleSystem1       = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ;---------------------------------------------------------------------------------------
    ReallyDamagedParticleSystem1 = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ReallyDamagedParticleSystem2 = Bone:None RandomBone:No PSys:StructureTransitionMediumExplosion
    ReallyDamagedParticleSystem3 = Bone:None RandomBone:No PSys:StructureTransitionMediumShockwave
  End

  Behavior = FlammableUpdate ModuleTag_18
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 5       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End
  
  Behavior             = CreateObjectDie ModuleTag_20
    CreationList  = OCL_LargeStructureDebris
  End
  
  Behavior             = FXListDie ModuleTag_21
    DeathFX       = FX_StructureMediumDeath
  End
  
  Behavior             = DestroyDie ModuleTag_22
    ;nothing
  End

  Behavior = StealthUpdate ModuleStealth_09
    StealthDelay                = 2500 ; msec
    StealthForbiddenConditions  = ATTACKING USING_ABILITY TAKING_DAMAGE
    InnateStealth               = No ;Requires upgrade first
    OrderIdleEnemiesToAttackMeUponReveal  = Yes
  End
  Behavior = StealthUpgrade ModuleTag_23
    ; TriggeredBy = Upgrade_GLACamoNetting
  END

  Geometry            = BOX
  GeometryMajorRadius = 10.0
  GeometryMinorRadius = 48.0
  GeometryHeight      = 60.0
  GeometryIsSmall     = Yes
  FactoryExitWidth    = 0    ; How much space to leave for units exiting.
  Shadow          = SHADOW_VOLUME
  BuildCompletion = PLACED_BY_PLAYER

