; Reborn: Share the base Propaganda Center while retaining this general's portrait, requirements and command sets, without unit production.
ObjectInherit Infa_ChinaPropagandaCenter ChinaPropagandaCenter

  ; *** ART Parameters ***
  SelectPortrait         = Infa_SNPropCentr
  ButtonImage            = Infa_SNPropCentr

  ; ***DESIGN parameters ***
  Side                = ChinaInfantryGeneral

  ReplaceModule Prerequisites
    Object            = Infa_ChinaWarFactory
  End

  CommandSet          = Infa_ChinaPropagandaCenterCommandSet

  ; *** ENGINEERING Parameters ***
  KindOf = PRELOAD STRUCTURE SELECTABLE IMMOBILE SCORE CAPTURABLE FS_TECHNOLOGY MP_COUNT_FOR_VICTORY FS_ADVANCED_TECH ; Reborn: No unit production, so no FS_FACTORY or AUTO_RALLYPOINT.

  RemoveModule ModuleTag_27 ; Reborn: No unit production, so no production exit.

  OverrideModule ModuleTag_25 ; Reborn: Retain the faction-specific menu after researching mines.
    CommandSet = Infa_ChinaPropagandaCenterCommandSetUpgrade
  End

End
