;//////////////////////////////////////////////////////////////////////////////
;FILE: Infa_ChinaWarFactory.ini ///////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Share the standard China factory's draw and common behavior while preserving faction-specific production.
ObjectInherit Infa_ChinaWarFactory ChinaWarFactory
  ; *** ART Parameters ***
  SelectPortrait = Infa_SNWarFact
  ButtonImage = Infa_SNWarFact
  UpgradeCameo1 = NONE ; Reborn: This faction does not use the standard factory's Mass Production cameo.

  ; *** DESIGN Parameters ***
  Side = ChinaInfantryGeneral
  ReplaceModule Prerequisites
    Object = Infa_ChinaSupplyCenter
  End
  CommandSet = Infa_ChinaWarFactoryCommandSet

  ; *** ENGINEERING Parameters ***
  ; Reborn: Retain the faction's mine upgrade command set without inheriting Mass Production switching.
  ReplaceModule ModuleTag_MassProduction01
    Behavior = CommandSetUpgrade ModuleTag_25
      CommandSet = Infa_ChinaWarFactoryCommandSetUpgrade
      TriggeredBy = Upgrade_ChinaMines
    End
  End
  RemoveModule ModuleTag_MassProduction02

  ; Reborn: Preserve Infantry's automatic Nationalism grant when the factory completes construction.
  AddModule
    Behavior = GrantUpgradeCreate ModuleTag_27
      UpgradeToGrant = Upgrade_Nationalism
      ExemptStatus = UNDER_CONSTRUCTION
    End
  End
End
;------------------------------------------------------------------------------
