;//////////////////////////////////////////////////////////////////////////////
;FILE: Infa_ChinaBarracks.ini /////////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
ObjectInherit Infa_ChinaBarracks ChinaBarracks

  SelectPortrait = Infa_SNBarracks
  ButtonImage = Infa_SNBarracks

  Side = ChinaInfantryGeneral

  CommandSet = Infa_ChinaBarracksCommandSet

  OverrideModule ModuleTag_05
    MaxHealth = 1200.0
    InitialHealth = 1200.0
    SubdualDamageCap = 1400
  End

  ReplaceModule ModuleTag_10 ; Reborn: Replace rather than append the faction-specific production quantity rule.
    Behavior = ProductionUpdate Infa_ModuleTag_10
      QuantityModifier = Infa_ChinaInfantryMiniGunner 1
    End
  End

  OverrideModule ModuleTag_25 ; Reborn: Retain the faction-specific menu after researching mines.
    CommandSet = Infa_ChinaBarracksCommandSetUpgrade
  End

  AddModule ; Reborn: Preserve the Nationalism upgrade granted after construction.
    Behavior = GrantUpgradeCreate ModuleTag_27
      UpgradeToGrant = Upgrade_Nationalism
      ExemptStatus = UNDER_CONSTRUCTION
    End
  End

End
;------------------------------------------------------------------------------
