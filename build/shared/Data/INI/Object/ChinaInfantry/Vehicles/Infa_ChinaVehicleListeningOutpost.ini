;//////////////////////////////////////////////////////////////////////////////
;FILE: Infa_ChinaVehicleListeningOutpost.ini //////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Share the base Listening Outpost while retaining the Assault Listening Outpost art, cost, health, capacity, stealth detection feedback and propaganda aura.
ObjectInherit Infa_ChinaVehicleListeningOutpost ChinaVehicleListeningOutpost

  ; *** ART Parameters ***
  SelectPortrait         = Infa_NVLOutpost
  ButtonImage            = Infa_NVLOutpost
  UpgradeCameo1          = Upgrade_ChinaSubliminalMessaging

  ; ***DESIGN parameters ***
  DisplayName     = OBJECT:AssaultListeningOutpost
  Side            = ChinaInfantryGeneral
  BuildCost       = 1100
  BuildTime       = 16.0          ;in seconds
  ReplaceModule Prerequisites
    Object = Infa_ChinaWarFactory
  End
  CommandSet = Infa_ChinaListeningOutpostCommandSet

  ; *** ENGINEERING Parameters ***
  ReplaceModule ModuleTag_02 ; Reborn: Keep the Assault Listening Outpost's sturdier body.
    Body = ActiveBody Infa_ModuleTag_Body
      MaxHealth       = 300.0
      InitialHealth   = 300.0
      SubdualDamageCap = 590
      SubdualDamageHealRate = 500
      SubdualDamageHealAmount = 50
    End
  End

  ReplaceModule ModuleTag_03 ; Reborn: Keep this general's IR grid stealth detection feedback instead of the base ping sounds.
    Behavior = StealthDetectorUpdate Infa_ModuleTag_StealthDetector
      DetectionRate             = 900   ; how often to rescan for stealthed things in my sight (msec)
      DetectionRange            = 300
      CanDetectWhileGarrisoned  = No
      CanDetectWhileContained   = No
      IRGridParticleSysName     = IRDetectGrid
      IRBeaconParticleSysName   = IRLenzflare
      IRParticleSysBone         = IRFX
    End
  End

  ReplaceModule ModuleTag_06 ; Reborn: Keep this general's Tank Hunter payload and larger assault capacity.
    Behavior = TransportContain Infa_ModuleTag_TransportContain
      PassengersAllowedToFire = Yes
      Slots                 = 6
      InitialPayload        = Infa_ChinaInfantryTankHunter 3
      ScatterNearbyOnExit   = No
      HealthRegen%PerSec    = 10
      DamagePercentToUnits  = 50%
      AllowInsideKindOf     = INFANTRY
      ExitDelay         = 250
      NumberOfExitPaths = 3
      GoAggressiveOnExit = Yes
      ArmedRidersUpgradeMyWeaponSet = Yes
    End
  End

  Behavior        = PropagandaTowerBehavior ModuleTag_13
    Radius                = 75
    DelayBetweenUpdates   = 4000 ; in milliseconds
    HealPercentEachSecond = 1%   ; get this % of max health every second
    PulseFX               = FX_PropagandaTowerPropagandaPulse ;plays as often as DelayBetweenUpdates
    UpgradeRequired       = Upgrade_ChinaSubliminalMessaging
    UpgradedHealPercentEachSecond = 2%   ; get this % of max health every second
    UpgradedPulseFX       = FX_PropagandaTowerSubliminalPulse ;plays as often as DelayBetweenUpdates
  End

End
;------------------------------------------------------------------------------
