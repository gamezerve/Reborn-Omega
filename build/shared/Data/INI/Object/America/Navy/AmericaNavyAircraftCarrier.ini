    OkToChangeModelColor = Yes

      ; day ********************************************
    DefaultConditionState
      Model               = PSAirCarrier
      Animation           = PSAirCarrier.PSAirCarrier
      AnimationMode       = LOOP
      Flags               = MAINTAIN_FRAME_ACROSS_STATES
      ParticleSysBone     = BOWWAKE AirCarrierWaterRipples 
      ParticleSysBone     = LEFTWAKE AirCarrierWaterRipples 
      ParticleSysBone     = RIGHTWAKE AirCarrierWaterRipples
      ParticleSysBone     = BOWWAKEL AirCarrierWaterRipples
      ParticleSysBone     = BOWWAKERB AirCarrierWaterRipples
    End
    AliasConditionState = SNOW

    ; DEATH ****************************************
    ConditionState        = RUBBLE
      Model               = PSAirCarrier_Dt
      Animation           = PSAirCarrier_Dt.PSAirCarrier_Dt
      AnimationMode       = ONCE
      Flags               = START_FRAME_FIRST

      ParticleSysBone     = SPLASH0BONE airCarrierDeathSplash0
      ParticleSysBone     = SPLASH0BONE airCarrierShockWave0
      ParticleSysBone     = SPLASH1BONE airCarrierDeathSplash
      ParticleSysBone     = SPLASH1BONE airCarrierShockWave
      ParticleSysBone     = SPLASH3BONE airCarrierTowerSplash
      ParticleSysBone     = SPLASH3BONE airCarrierDeckSmoke
      ParticleSysBone     = OILSLICKBONE airCarrierDeckSmoke

      ParticleSysBone     = EXPLOSION1BONE airCarrierExplosion0
      ParticleSysBone     = EXPLOSION1BONE airCarrierLightFlash1
      ParticleSysBone     = EXPLOSION1BONE airCarrierShockWave1
      ParticleSysBone     = EXPLOSION1BONE airCarrierExplosionSparks
           
      ParticleSysBone     = EXPLOSION2BONE airCarrierExplosion1
      ParticleSysBone     = EXPLOSION2BONE airCarrierLightFlash2
      ParticleSysBone     = EXPLOSION2BONE airCarrierShockWave2
      ParticleSysBone     = EXPLOSION2BONE airCarrierDeckFireBig
              
      ParticleSysBone     = EXPLOSION4BONE airCarrierExplosion2
      ParticleSysBone     = EXPLOSION4BONE airCarrierLightFlash3
      ParticleSysBone     = EXPLOSION4BONE airCarrierShockWave3
      ParticleSysBone     = EXPLOSION4BONE airCarrierDeckFire

      ParticleSysBone     = EXPLOSION5BONE airCarrierFinalExplosion
      ParticleSysBone     = EXPLOSION5BONE airCarrierDeckFire
      ParticleSysBone     = EXPLOSION5BONE airCarrierSmoke
    
      ParticleSysBone     = SPLASH4BONE airCarrierDeathSplash1
      ParticleSysBone     = SPLASH5BONE airCarrierDeathSplash1
      ParticleSysBone     = SPLASH6BONE airCarrierDeathSplash2
      ParticleSysBone     = SPLASH7BONE airCarrierDeathSplash3
      
      ParticleSysBone     = MAST1BONE airCarrierDeckFireBig
      ParticleSysBone     = MAST2BONE airCarrierDeckFire

      ParticleSysBone     = SPLASH4BONE airCarrierDeathRipple
      ParticleSysBone     = SPLASH5BONE airCarrierDeathRipple
      ParticleSysBone     = SPLASH6BONE airCarrierDeathRipple
      ParticleSysBone     = SPLASH7BONE airCarrierDeathRipple

      ParticleSysBone     = SPLASH5BONE airCarrierFinalDeathSplash
     
      ParticleSysBone     = JET01BONE airCarrierDeckFireJet5
      ParticleSysBone     = JET01BONE airCarrierJetEngine01Smoke
      ParticleSysBone     = JET01BONE airCarrierJet01Explosion
 
      ParticleSysBone     = JET03BONE airCarrierDeckFireBig
      ParticleSysBone     = JET04BONE airCarrierDeckFireBig 
        
      ParticleSysBone     = JET05BONE airCarrierJetExplosion1
      ParticleSysBone     = JET05BONE airCarrierDeckFireJet5
     
      ParticleSysBone     = JET06BONE airCarrierDeckFireJet6
      ParticleSysBone     = JET06BONE airCarrierJetExplosion2
    
      ParticleSysBone     = JET07BONE airCarrierJetExplosion3
      ParticleSysBone     = JET07BONE airCarrierDeckFireJet7
      
      ParticleSysBone     = JET08BONE airCarrierDeckFire
      ParticleSysBone     = JET08BONE airCarrierJet8Splash
 
      ParticleSysBone     = OILSLICKBONE airCarrierOilSlick
      ParticleSysBone     = OILSLICKBONE airCarrierMidShipSplash
      ParticleSysBone     = SPARK1BONE airCarrierSmoke
      ParticleSysBone     = SPARK1BONE airCarrierDeckFire
      ParticleSysBone     = SPARK2BONE airCarrierSmoke
      ParticleSysBone     = SPARK2BONE airCarrierDeckFire
 
      ParticleSysBone     = BOWSPLASH0BONE1 airCarrierBowDeathSplash
 
      ParticleSysBone     = SMOKEBONE01 airCarrierSmoke
      ParticleSysBone     = SMOKEBONE02 airCarrierSmoke
      ParticleSysBone     = SMOKEBONE03 airCarrierSmoke
        
    End
    ; day moving********************************************
    ConditionState = MOVING
      Model               = PSAirCarrier
      Animation           = PSAirCarrier.PSAirCarrier
      AnimationMode       = LOOP
      Flags               = MAINTAIN_FRAME_ACROSS_STATES
      ParticleSysBone     = BOWWAKE AirCarrierBowWake
      ParticleSysBone     = LEFTWAKE AirCarrierSideWake
      ParticleSysBone     = RIGHTWAKE AirCarrierSideWake
      ParticleSysBone     = PROPELLERWAKE AirCarrierPropWake
      ParticleSysBone     = BOWWAKEL AirCarrierWaterWake
      ParticleSysBone     = BOWWAKERB AirCarrierWaterWakePort     
    End
    AliasConditionState = MOVING SNOW

    ; night ******************************************
    ConditionState        = NIGHT
      Model               = PSAirCarrier_N
      Animation           = PSAirCarrier_N.PSAirCarrier_N
      AnimationMode       = LOOP
      Flags               = MAINTAIN_FRAME_ACROSS_STATES
    End
    AliasConditionState = NIGHT SNOW

    ConditionState        = NIGHT MOVING
      Model               = PSAirCarrier_N
      Animation           = PSAirCarrier_N.PSAirCarrier_N
      AnimationMode       = LOOP
      Flags               = MAINTAIN_FRAME_ACROSS_STATES
      ParticleSysBone     = BOWWAKE AirCarrierBowWake
      ParticleSysBone     = LEFTWAKE AirCarrierSideWake
      ParticleSysBone     = RIGHTWAKE AirCarrierSideWake
      ParticleSysBone     = PROPELLERWAKE AirCarrierPropWake
      ParticleSysBone     = BOWWAKEL AirCarrierWaterWake
      ParticleSysBone     = BOWWAKERB AirCarrierWaterWakePort
    End
    AliasConditionState = NIGHT SNOW MOVING

    ; Reborn: No PSAirCarrier_NS model exists in retail
    ; ConditionState        = NIGHT SNOW
    ;   Model               = PSAirCarrier_NS
    ;   Animation           = PSAirCarrier_NS.PSAirCarrier_NS
    ;   AnimationMode       = LOOP
    ;   Flags               = MAINTAIN_FRAME_ACROSS_STATES
    ; End

  End

  ;Below deck hangar
  Draw = W3DModelDraw ModuleTag_02
    OkToChangeModelColor = Yes
    ReceivesDynamicLights = No
    DefaultConditionState
      Model               = PSAirCarrier_A2
      Animation           = PSAirCarrier_A2.PSAirCarrier_A2
      AnimationMode       = ONCE_BACKWARDS
      Flags               = START_FRAME_FIRST
    End

    ConditionState        = DOOR_1_OPENING
      AnimationMode       = ONCE
      Flags               = START_FRAME_FIRST
    End
    ConditionState        = DOOR_1_WAITING_OPEN
      AnimationMode       = ONCE
      Flags               = START_FRAME_LAST
    End

    ConditionState        = RUBBLE
      Model               = NONE
    End
    
  End

  ;Launch blast blocks
  Draw = W3DModelDraw ModuleTag_03
   ReceivesDynamicLights = No
   DefaultConditionState
      Model               = PSAirCarrier_A3
      Animation           = PSAirCarrier_A3.PSAirCarrier_A3
      AnimationMode       = ONCE_BACKWARDS
      Flags               = START_FRAME_FIRST
    End

    ConditionState        = DOOR_2_OPENING
      AnimationMode       = ONCE
      Flags               = START_FRAME_FIRST
    End
    ConditionState        = DOOR_2_CLOSING
      AnimationMode       = ONCE_BACKWARDS
      Flags               = START_FRAME_LAST
    End

    ConditionState        = RUBBLE
      Model               = NONE
    End

  End


  Draw = W3DModelDraw ModuleTag_04
    ReceivesDynamicLights = No
    DefaultConditionState
      Model               = PSAirCarrier_A1
      Animation           = PSAirCarrier_A1.PSAirCarrier_A1
      AnimationMode       = ONCE_BACKWARDS
      Flags               = START_FRAME_FIRST
    End

    ConditionState        = DOOR_3_OPENING
      AnimationMode       = ONCE
      Flags               = START_FRAME_FIRST
    End
    ConditionState        = DOOR_3_CLOSING
      AnimationMode       = ONCE_BACKWARDS
      Flags               = START_FRAME_LAST
    End

    ConditionState        = RUBBLE
      Model               = NONE
    End

End

  ; ***DESIGN parameters ***
  DisplayName            = OBJECT:AircraftCarrier
  Side                   = America
  EditorSorting          = Vehicle
  TransportSlotCount     = 0                 ;how many "slots" we take in a transport (0 == not transportable)
  ExperienceValue         = 500 500 1000 1500  ;Experience point value at each level
  ExperienceRequired      = 0 500 1000 2000   ;Experience points needed to gain each level
  IsTrainable             = No            ;Can gain experience
  CommandSet             = AmericaAircraftCarrierCommandSet
EnergyProduction = -20
  WeaponSet
    Conditions = None 
    Weapon = PRIMARY AircraftCarrierOrderLaunch
  End
  MaxSimultaneousOfType = 1
  ArmorSet
    Conditions           = None
    Armor             = TankArmor
    DamageFX          = TankDamageFX
  End
  BuildCost = 15000
  BuildTime = 120.0
  VisionRange         = 200
  ShroudClearingRange = 200
  Prerequisites
     Object = AmericaStrategyCenter
  End
  ; *** AUDIO Parameters ***
  VoiceSelect         = AircraftCarrierVoiceSelect
  VoiceAttack         = AircraftCarrierVoiceAttack
  VoiceMove           = AircraftCarrierVoiceMove
  SoundOnDamaged        = BuildingDamagedStateLight
  SoundOnReallyDamaged  = BuildingDestroy

  ;UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    ;TurretMoveLoop       = OverlordTankTurretMoveLoop
  ;End

  ; *** ENGINEERING Parameters ***
  RadarPriority          = UNIT
  KindOf                 = PRELOAD CAN_CAST_REFLECTIONS STRUCTURE MOBILE_STRUCTURE MOVES_REVERSE FS_AIRFIELD AIRCRAFT_CARRIER SCORE MP_COUNT_FOR_VICTORY CAN_ATTACK SELECTABLE POWERED AIRCRAFT_CARRIER_RO BOAT REPAIR_PAD

  Body = ActiveBody ModuleTag_05
    MaxHealth            = 75000.0
    InitialHealth        = 75000.0
  End

  Behavior = FlightDeckBehavior ModuleTag_06
    NumRunways              = 2
    NumSpacesPerRunway      = 10

    Runway1Spaces           = RunwayStart1 Runway1Prep1 Runway1Prep2 Runway1Prep3 Runway1Prep4 Runway1Prep5 Runway1Prep6 Runway1Prep7 Runway1Prep8 Runway1Prep9
    Runway1Takeoff          = RunwayStart1 RunwayEnd1
    Runway1Landing          = RunwayLDStart1 RunwayLDEnd1
    Runway1Taxi             = Taxi2 Taxi3 Taxi4 Taxi6
    Runway1Creation         = Hanger1 Taxi4 Taxi6
    Runway1CatapultSystem   = AircraftCarrierCatapultSteamParent

    Runway2Spaces           = RunwayStart2 Runway2Prep1 Runway2Prep2 Runway2Prep3 Runway2Prep4 Runway2Prep5 Runway2Prep6 Runway2Prep7 Runway2Prep8 Runway2Prep9
    Runway2Takeoff          = RunwayStart2 RunwayEnd2
    Runway2Landing          = RunwayLDStart2 RunwayLDEnd2
    Runway2Taxi             = Taxi1 Taxi3 Taxi5
    Runway2Creation         = Hanger1 Taxi4
    Runway2CatapultSystem   = AircraftCarrierCatapultSteamParent

    HealAmountPerSecond     = 20
    ApproachHeight          = 50
    LandingDeckHeightOffset = 45.0
    ParkingCleanupPeriod    = 533  ;How often the carrier checks to move planes forward in the queue to fill empty spaces
    HumanFollowPeriod       = 333  ;Human factor for delay like a traffic jam.. takes time to react when the guy in front moves.

    ;Template of payload, and how quickly destroyed ones get replaced.
    PayloadTemplate         = AmericaJetAircraftCarrierRaptor
    ReplacementDelay        = 10000
    DockAnimationDelay      = 9000

    ;How quickly a wave of fighters can be launched.
    LaunchWaveDelay         = 3000
    LaunchRampDelay         = 667
    LowerRampDelay          = 600
    CatapultFireDelay       = 750

    ;Reborn Attributes
    MovingCarrier               = Yes
    ; Reborn: Reserve one carrier-local landing and repair point for helicopters.
    HasHelicopterRepairPoint    = Yes
    HelicopterRepairPointOffset = X:0.0 Y:-60.0 Z:48.0

  End

  Behavior = ProductionUpdate ModuleTag_07
    NumDoorAnimations            = 1
    DoorOpeningTime              = 3000 ;matches the dock animation timing.
    DoorWaitOpenTime             = 33  ;add a single frame to hold the plane because there is a one frame delay before we see the new plane
    DoorCloseTime                = 0  ;in mSeconds
    ConstructionCompleteDuration = 0  ;in mSeconds
  End
    
  Locomotor = SET_NORMAL AircraftCarrierLocomotor

  Behavior = BaseRegenerateUpdate ModuleTag_08
    ;No data
  End 

  ; Behavior = DestroyDie ModuleTag_09
  ;  ;nothing
  ; End

;  Behavior             = CreateObjectDie ModuleTag_07
;    CreationList  = OCL_ABPowerPlantExplode
;  End

 ; Behavior = CreateObjectDie ModuleTag_10
 ;    CreationList = OCL_AircraftCarrier_DeathEffect
 ;  End

 ; Behavior = KeepObjectDie ModuleTag_IWantRubble
 ; End

  ClientUpdate         = AnimatedParticleSysBoneClientUpdate ModuleTag_11
  End  

;  Behavior             = FXListDie ModuleTag_09
;    DeathFX       = FX_StructureMediumDeath
;  End

  Behavior = TransitionDamageFX ModuleTag_12
    ;-------------DESIGNED FOR MEDIUM SIZED FACTION BUILDING TRANSITIONS-------------------
    DamagedParticleSystem1       = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ;---------------------------------------------------------------------------------------
    ReallyDamagedParticleSystem1 = Bone:None RandomBone:No PSys:StructureTransitionMediumSmoke
    ReallyDamagedParticleSystem2 = Bone:None RandomBone:No PSys:StructureTransitionMediumExplosion
    ReallyDamagedParticleSystem3 = Bone:None RandomBone:No PSys:StructureTransitionMediumShockwave
  End

  Behavior               = PhysicsBehavior ModuleTag_13
    Mass                 = 5000.0
    ShockMaxYaw          = 0.005
    ShockMaxPitch        = 0.0025
    ShockMaxRoll         = 0.0025
  End

  Behavior = FlammableUpdate ModuleTag_19
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 5       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

  Behavior = SlowDeathBehavior ModuleTag_58
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier = 25
    VisionRetentionDuration = 20000 ; Reborn: Keep carrier vision for the first 25 seconds (VisionRetentionDuration + UnlookPersistDuration from GameData.ini) of its death sequence.
    ReleasePowerOnDeath = Yes ; Reborn: Restore the carrier's consumed power when its death sequence begins.
    SinkDelay           = 19000
    SinkRate            = 1.0     ; in Dist/Sec
    DestructionDelay = 65000
    DestructionDelayVariance = 000
  End

