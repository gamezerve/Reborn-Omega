  ; ; GeometryMinorRadius = 74.0
  ; ; GeometryHeight      = 25.0
  ; GeometryMajorRadius = 226.5
  ; GeometryMinorRadius = 66.5
  ; GeometryHeight      = 103.0
  ; GeometryIsSmall     = No

GeometryBlock
   IsSmall = No

      ; Main hull
      Shape
        Type        = BOX
        MajorRadius = 150.0
        MinorRadius = 61.0
        Height      = 45.0
        Offset      = X:35 Y:0 Z:0
      End

      ; Forward-mid hull
      Shape
        Type        = BOX
        MajorRadius = 65.0
        MinorRadius = 55.0
        Height      = 45.0
        Offset      = X:-155 Y:0 Z:0
      End

      ; Bow transition
      Shape
        Type        = BOX
        MajorRadius = 35.0
        MinorRadius = 42.0
        Height      = 45.0
        Offset      = X:-220 Y:0 Z:0
      End

      ; Bow tip
      Shape
        Type        = BOX
        MajorRadius = 18.0
        MinorRadius = 22.0
        Height      = 45.0
        Offset      = X:-257 Y:0 Z:0
      End

      ; Stern
      Shape
        Type        = BOX
        MajorRadius = 38.0
        MinorRadius = 52.0
        Height      = 45.0
        Offset      = X:228 Y:0 Z:0
      End

      ; Angled flight deck
      Shape
        Type        = BOX
        MajorRadius = 145.0
        MinorRadius = 22.0
        Height      = 45.0
        Offset      = X:75 Y:-72 Z:0
      End
    End

  FactoryExitWidth    = 25
  Shadow          = SHADOW_VOLUME 

End
