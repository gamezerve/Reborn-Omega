  ; ***DESIGN parameters ***
  DisplayName            = OBJECT:Battleship
  Side                   = America
  EditorSorting          = VEHICLE
  TransportSlotCount     = 0                 ;how many "slots" we take in a transport (0 == not transportable)
  ExperienceValue         = 500 500 1000 1500  ;Experience point value at each level
  ExperienceRequired      = 0 500 1000 2000   ;Experience points needed to gain each level
  IsTrainable             = Yes             ;Can gain experience
  CommandSet             = GenericCommandSet
  WeaponSet
    Conditions           = None 
    Weapon               = PRIMARY BattleShipGunReborn
    Weapon               = SECONDARY BattleShipGunReborn
    ; Weapon               = SECONDARY BattleShipGunReborn ; Reborn: Why is this dublicate?
    AutoChooseSources    = PRIMARY    FROM_SCRIPT FROM_PLAYER FROM_AI
    AutoChooseSources    = SECONDARY  FROM_SCRIPT FROM_PLAYER FROM_AI
  End
  MaxSimultaneousOfType = 3
  ArmorSet
    Conditions           = None
    Armor             = TankArmor
    DamageFX          = TankDamageFX
  End
  BuildCost = 3500
  BuildTime = 60.0
  VisionRange         = 300
  ShroudClearingRange = 400
  Prerequisites
     Object = AmericaStrategyCenter
  End
  ; *** AUDIO Parameters ***
  VoiceSelect = BattleshipVoiceSelect
  VoiceMove = BattleshipVoiceMove
  VoiceGuard = BattleshipVoiceMove
  VoiceAttack = BattleshipVoiceAttack
  SoundAmbient = BattleshipAmbientLoop

  UnitSpecificSounds
    ; These have the syntax of SomeNameSomewhereInCode = SomeNameSomewhereInLookupINIs
    TurretMoveLoop       = OverlordTankTurretMoveLoop
  End

  ; *** ENGINEERING Parameters ***
  RadarPriority          = UNIT
  KindOf                 = PRELOAD CAN_CAST_REFLECTIONS VEHICLE SCORE SELECTABLE

  Body = ActiveBody ModuleTag_02
    MaxHealth            = 7500.0
    InitialHealth        = 7500.0
  End

  Behavior = AIUpdateInterface ModuleTag_03
    Turret
      TurretTurnRate     = 180
      TurretPitchRate    = 80
      FirePitch          = 20            ; Instead of aiming pitchwise at the target, it will aim here
      AllowsPitch        = Yes
      RecenterTime       = 6000       ; how long to wait during idle before recentering
      ControlledWeaponSlots = PRIMARY
      NaturalTurretAngle = 180  ; this turret points backwards normally
    End
    AltTurret
      TurretTurnRate     = 180
      TurretPitchRate    = 80
      FirePitch          = 20          ; Instead of aiming pitchwise at the target, it will aim here
      AllowsPitch        = Yes
      RecenterTime       = 6000     ; how long to wait during idle before recentering
      ControlledWeaponSlots = SECONDARY
    End
    TurretsLinked = Yes
  End
  Locomotor = SET_NORMAL BattleshipLocomotor

  Behavior               = PhysicsBehavior ModuleTag_04
    Mass                 = 5000.0
  End

  Behavior = SlowDeathBehavior ModuleTag_58
    DeathTypes = ALL -CRUSHED -SPLATTED
    ProbabilityModifier = 25
    SinkDelay           = 19000
    SinkRate            = 1.0     ; in Dist/Sec
    DestructionDelay = 65000
    DestructionDelayVariance = 000
  End

  Geometry               = BOX
  Scale              = 0.90
  GeometryMajorRadius    = 200.0
  GeometryMinorRadius    = 20.0
  GeometryHeight         = 40     
  GeometryIsSmall        = No 
  Shadow                 = SHADOW_VOLUME   

End
