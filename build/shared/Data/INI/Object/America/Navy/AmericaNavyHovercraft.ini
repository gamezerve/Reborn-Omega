  ; The exit door
  Draw = W3DModelDraw ModuleTag_02
    DefaultConditionState
      Model         = AVAMPHIB_A
      Animation     = AVAMPHIB_A.AVAMPHIB_A
      AnimationMode = MANUAL
      Flags         = START_FRAME_FIRST
    End
    ConditionState  = DOOR_1_OPENING
      Model         = AVAMPHIB_A
      Animation     = AVAMPHIB_A.AVAMPHIB_A
      AnimationMode = ONCE
      Flags         = START_FRAME_FIRST
    End
    ConditionState  = DOOR_1_CLOSING
      Model         = AVAMPHIB_A1
      Animation     = AVAMPHIB_A1.AVAMPHIB_A1
      AnimationMode = ONCE
      Flags         = START_FRAME_FIRST
    End
  End

  ; ***DESIGN parameters ***
  DisplayName       = OBJECT:Hovercraft
  Side              = America
  EditorSorting     = VEHICLE
  CommandSet        = HovercraftCommandSet
  ArmorSet
    Armor           = BattleBusTruckArmor
    DamageFX        = DefaultDamageFX
  End
  WeaponSet
    Conditions      = None
    Weapon          = PRIMARY None
  End
  BuildCost = 1100
  BuildTime = 15.0
  VisionRange       = 150
  Prerequisites
    Object = AmericaWarFactory
  End
  CrusherLevel           = 1  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 3  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  ; *** AUDIO Parameters ***
  SoundMoveLoop = AmphibiousTransportMoveLoop
  VoiceSelect     = ChinookVoiceSelect
  VoiceMove       = ChinookVoiceMove
  VoiceAttack     = ChinookVoiceAttack
  SoundEnter      = HumveeEnter
  SoundExit       = HumveeExit
  UnitSpecificSounds
    VoiceCreate         = ChinookVoiceCreate
    VoiceUnload         = ChinookVoiceUnload
    VoiceGarrison       = ChinookVoiceMove
  End

  ; *** ENGINEERING Parameters ***  
  RadarPriority     = UNIT
  KindOf            = SELECTABLE VEHICLE TRANSPORT

  Body              = ActiveBody ModuleTag_03
    MaxHealth       = 500.0
    InitialHealth   = 500.0
  End

  Behavior              = TransportContain ModuleTag_04
    Slots               = 12
    AllowInsideKindOf   = INFANTRY VEHICLE
    DoorOpenTime        = 2000
    ScatterNearbyOnExit = No ; I have bones for exiting
  End 
  Behavior          = PhysicsBehavior ModuleTag_05
    Mass            = 30.0
  End
  Behavior = TransportAIUpdate ModuleTag_06
    ;<NO DATA>
  End
  Locomotor         = SET_NORMAL BasicAmphibiousLocomotor

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 5       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

  Behavior = SlowDeathBehavior ModuleTag_95
    DeathTypes = ALL
    ProbabilityModifier = 25
    DestructionDelay = 10000
    DestructionDelayVariance = 000
    FX  = FINAL    FX_StructureMediumDeath
    OCL = FINAL    OCL_MediiumStructureDebris
  End

  Geometry            = BOX
  Scale               = 0.75                           
  GeometryIsSmall     = No
  GeometryMajorRadius = 20.0
  GeometryMinorRadius = 14.0
  GeometryHeight      = 17.0
  Shadow              = SHADOW_VOLUME

End
