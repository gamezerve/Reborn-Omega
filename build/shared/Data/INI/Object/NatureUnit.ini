  ; ***DESIGN parameters ***
  DisplayName      = OBJECT:Ox
  EditorSorting   = MISC_NATURAL

  Scale = 1.5

  ; ***AUDIO parameters ***
  SoundAmbient = CowAmbience


  ; *** ENGINEERING Parameters ***  
  Body            = ActiveBody ModuleTag_02
