; FILE: NatureUnit.ini ////////////////////////////////////////////////////////
; This file contains only objects that are units that aren't tied to a
; specific faction such as lions, tigers, and bears ... on my! t
;//////////////////////////////////////////////////////////////////////////////

;------------------------------------------------------------------------------
Object Bird

  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    ConditionState = NONE
      ; Reborn: The original model CIBird (animation CIBird.CIBird) does not exist in the Zero Hour or Generals
      ; archives, so the bird was always invisible and debug builds assert "Model cibird not found" whenever one is created.
      ; Use no model instead; the object stays because maps may still place it.
      ;Model = CIBird
      ;Animation = CIBird.CIBird
      Model = None
      AnimationMode = LOOP
    End
  End

  ; ***DESIGN parameters ***
  DisplayName      = OBJECT:Bird
  EditorSorting   = MISC_NATURAL

  Scale = 5.0

  ; *** ENGINEERING Parameters ***  
  Body            = ActiveBody ModuleTag_02
    MaxHealth       = 1.0
    InitialHealth   = 1.0
  End
  ;Shadow          = SHADOW_VOLUME

  Behavior = AIUpdateInterface ModuleTag_03
  End
  Locomotor = SET_NORMAL BirdLocomotor

  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 5.0
  End

End
;------------------------------------------------------------------------------
Object Ox

  ; *** ART Parameters ***
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = CIox_SKN
      IdleAnimation = CIox_SKL.CIox_STD
      IdleAnimation = CIox_SKL.CIox_STD
      IdleAnimation = CIox_SKL.CIox_STD
      IdleAnimation = CIox_SKL.CIox_STD
      IdleAnimation = CIox_SKL.CIox_STD
      IdleAnimation = CIox_SKL.CIox_IDL
      AnimationMode = ONCE
    End

    ConditionState = MOVING
      Animation = CIox_SKL.CIox_WKA
      AnimationMode = LOOP
      Flags = RANDOMSTART
    End

    ConditionState = MOVING PANICKING
      Animation = CIox_SKL.CIox_RUN
      AnimationMode = LOOP
      Flags = RANDOMSTART
    End

    ConditionState = DYING
      Animation = CIox_SKL.CIox_DTA
      AnimationMode = ONCE
    End  
