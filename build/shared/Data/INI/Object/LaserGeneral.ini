Object Lazr_AmericaJetA10Thunderbolt

  UpgradeCameo1 = Upgrade_AmericaCountermeasures
  
  ; *** ART Parameters ***
  SelectPortrait         = SAWarthog_L
  ButtonImage            = SAWarthog_L

  Draw = W3DModelDraw ModuleTag_01

    OkToChangeModelColor = Yes

