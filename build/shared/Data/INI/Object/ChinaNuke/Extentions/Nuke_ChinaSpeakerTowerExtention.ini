;//////////////////////////////////////////////////////////////////////////////
;FILE: Nuke_ChinaSpeakerTowerExtention.ini ////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Share the Nuke General Speaker Tower and attach it to the Airfield as an extention.
ObjectInherit Nuke_ChinaSpeakerTowerExtention Nuke_ChinaSpeakerTower

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:SpeakerTowerExtention

  Behavior = SlavedUpdate ModuleTag_16
    GuardMaxRange           = 0
    GuardWanderRange        = 0
    AttackRange             = 0
    AttackWanderRange       = 0
    ScoutRange              = 0
    ScoutWanderRange        = 0
    StayOnSameLayerAsMaster = Yes
    IsRebornExtention       = Yes
    UpgradeToRemoveOnSell   = Nuke_Upgrade_ChinaSpeakerTowerExtention
  End

  Behavior = UpgradeDie ModuleTag_27
    ;This frees the object based upgrade for the producer object.
    DeathTypes      = ALL
    UpgradeToRemove = Nuke_Upgrade_ChinaSpeakerTowerExtention ModuleTag_27
  End

End
;------------------------------------------------------------------------------
