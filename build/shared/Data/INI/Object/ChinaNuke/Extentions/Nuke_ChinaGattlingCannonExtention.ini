;------------------------------------------------------------------------------
; Reborn: Share the Nuke General Gattling Cannon and attach it to the Airfield as an extention.
ObjectInherit Nuke_ChinaGattlingCannonExtention Nuke_ChinaGattlingCannon

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:ECMGattlingCannonExtention
  CommandSet  = ChinaGattlingCannonExtentionCommandSet

  Behavior = SlavedUpdate ModuleTag_16
    GuardMaxRange           = 0
    GuardWanderRange        = 0
    AttackRange             = 0
    AttackWanderRange       = 0
    ScoutRange              = 0
    ScoutWanderRange        = 0
    StayOnSameLayerAsMaster = Yes
    IsRebornExtention       = Yes
    UpgradeToRemoveOnSell   = Nuke_Upgrade_ChinaGattlingCannonExtention
  End

  Behavior = UpgradeDie ModuleTag_27
    ;This frees the object based upgrade for the producer object.
    DeathTypes      = ALL
    UpgradeToRemove = Nuke_Upgrade_ChinaGattlingCannonExtention ModuleTag_28
  End

End
;------------------------------------------------------------------------------
