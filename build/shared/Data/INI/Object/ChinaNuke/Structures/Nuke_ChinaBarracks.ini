;------------------------------------------------------------------------------
; Reborn: Share the base Barracks while preserving this general's distinct settings.
ObjectInherit Nuke_ChinaBarracks ChinaBarracks

  SelectPortrait = Nuke_SNBarracks
  ButtonImage = Nuke_SNBarracks

  Side = ChinaNukeGeneral

  CommandSet = Nuke_ChinaBarracksCommandSet

  ReplaceModule ModuleTag_10 ; Reborn: Replace rather than append the faction-specific production quantity rule.
    Behavior = ProductionUpdate Nuke_ModuleTag_10
      QuantityModifier = Nuke_ChinaInfantryRedguard 2
    End
  End

  OverrideModule ModuleTag_25 ; Reborn: Retain the faction-specific menu after researching mines.
    CommandSet = Nuke_ChinaBarracksCommandSetUpgrade
  End

End
;------------------------------------------------------------------------------
