; Reborn: Share the base Gattling Cannon while retaining Nuke General art, cost, production requirements and ECM jammer.
ObjectInherit Nuke_ChinaGattlingCannon ChinaGattlingCannon

  ; *** ART Parameters ***
  SelectPortrait = Nuke_SNGatTower
  ButtonImage    = Nuke_SNGatTower

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:ECMGattlingCannon

  Side        = ChinaNukeGeneral

  BuildCost   = 1200

  ReplaceModule Prerequisites
    Object = Nuke_ChinaPowerPlant
  End

  Behavior = FireWeaponUpdate ModuleTag_28
    Weapon = ECMTankMissileJammer
    ;ExclusiveWeaponDelay = 250 ; If we fire a real weapon, we turn this module off for this long
  End

End
