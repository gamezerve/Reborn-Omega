;//////////////////////////////////////////////////////////////////////////////
;FILE: Nuke_ChinaTankOverlord.ini /////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Share the base Overlord while retaining Nuke art, weapons, cost, requirements, locomotors and death weapon behavior.
ObjectInherit Nuke_ChinaTankOverlord ChinaTankOverlord

  ; *** ART Parameters ***
  SelectPortrait         = Nuke_SNOverlord
  ButtonImage            = Nuke_SNOverlord

  UpgradeCameo1 = Nuke_Upgrade_ChinaWGUraniumShells
  UpgradeCameo2 = Upgrade_ChinaFusionTanks
  UpgradeCameo7 = Upgrade_ChinaIsotopeStability

  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:NukeOverlord
  Side                = ChinaNukeGeneral

  WeaponSet
    Conditions        = None 
    Weapon            = PRIMARY Nuke_OverlordTankGun
  End
  WeaponSet
    Conditions        = PLAYER_UPGRADE
    Weapon            = PRIMARY Nuke_OverlordTankGun
    Weapon            = SECONDARY GattlingBuildingGunAirDummy ;Dummy weapon that allows manual targeting of air units outside range
                                                              ;gattling cannon upgrade has been made.
  End

  BuildCost       = 2000
  BuildTime       = 22.0          ;in seconds

  ReplaceModule Prerequisites
    Object = Nuke_ChinaWarFactory
    Object = Nuke_ChinaPropagandaCenter
  End

  ; *** ENGINE parameters ***
  ReplaceModule ModuleTag_03 ; Reborn: Inherited locomotor sets cannot be re-specified, so recreate the identical AI module before assigning Nuke locomotors.
    Behavior = TransportAIUpdate Nuke_ModuleTag_OverlordAI
      Turret
        TurretTurnRate = 60 ;30 ;15   // turn rate, in degrees per sec
        ControlledWeaponSlots = PRIMARY
      End
      AutoAcquireEnemiesWhenIdle = Yes
    End
  End

  Locomotor = SET_NORMAL Nuke_FusionOverlordLocomotor
  Locomotor = SET_NORMAL_UPGRADED Nuke_FusionOverlordUpgradedLocomotor

  ReplaceModule ModuleTag_04
    Behavior = FireWeaponWhenDeadBehavior Nuke_ModuleTag_OverlordDeathWeapon
      DeathWeapon   = Nuke_NuclearTankDeathWeapon
      StartsActive  = Yes                        ; Removes itself when player upgrades to Fusion Reactors
      ConflictsWith   = Upgrade_ChinaIsotopeStability
    End
  End

  RemoveModule ModuleTag_05 ; Reborn: Nuke uses the Fusion Reactor locomotor upgrade below instead of Nuclear Tanks.

  Behavior = LocomotorSetUpgrade ModuleTag_22
    TriggeredBy = Upgrade_ChinaFusionTanks
  End

End
;------------------------------------------------------------------------------
