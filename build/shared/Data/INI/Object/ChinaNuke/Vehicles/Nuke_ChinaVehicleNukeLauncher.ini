;//////////////////////////////////////////////////////////////////////////////
;FILE: Nuke_ChinaVehicleNukeLauncher.ini //////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Share the base Nuke Cannon while retaining the Nuke General art, cost, production requirements and hulk.
ObjectInherit Nuke_ChinaVehicleNukeLauncher ChinaVehicleNukeLauncher

  ; *** ART Parameters ***
  SelectPortrait         = Nuke_SNNukeCannon_L
  ButtonImage            = Nuke_SNNukeCannon_L

  ReplaceModule ModuleTag_01
    Draw = W3DTankDraw ModuleTag_Nuke01

      InitialRecoilSpeed   = 120
      MaxRecoilDistance    = 8
      RecoilSettleSpeed    = 6

      OkToChangeModelColor = Yes

      ExtraPublicBone = Turret01

      DefaultConditionState
        Model                           = NVNukeCnNG
        WeaponLaunchBone                = PRIMARY Muzzle
        WeaponMuzzleFlash               = PRIMARY MuzzleFX
        WeaponFireFXBone                = PRIMARY Muzzle
        WeaponRecoilBone                = PRIMARY Barrel
        WeaponLaunchBone                = SECONDARY Muzzle
        WeaponMuzzleFlash               = SECONDARY MuzzleFX
        WeaponFireFXBone                = SECONDARY Muzzle
        WeaponRecoilBone                = SECONDARY Barrel
        HideSubObject                   = TURRET01      ;Hide controlled turret
        ShowSubObject                   = TURRETFRONT TURRETBACK  ;Show pack/unpack animated turret
        Turret                          = Turret01
        TurretPitch                     = TurretEL
      End

      ConditionState                    = RUBBLE
        Model                           = NVNukeCnNG_D1
        ; Reborn: The rubble model has no TurretEL, Muzzle, MuzzleFX, TurretFront or TurretBack.
        ; Clear these values inherited from DefaultConditionState.
        WeaponFireFXBone                = PRIMARY None
        WeaponFireFXBone                = SECONDARY None
        WeaponLaunchBone                = PRIMARY None
        WeaponLaunchBone                = SECONDARY None
        WeaponMuzzleFlash               = PRIMARY None
        WeaponMuzzleFlash               = SECONDARY None
        WeaponRecoilBone                = PRIMARY Barrel
        WeaponRecoilBone                = SECONDARY Barrel
        HideSubObject                   = None  ; Reborn: Keep the rubble turret visible; only clear the inherited hide/show list.
        Turret                          = Turret01
        TurretPitch                     = None
      End
      ; Reborn: Resolve ambiguous deploy-state, movement and rubble matches.
      AliasConditionState = RUBBLE MOVING
      AliasConditionState = RUBBLE BETWEEN_FIRING_SHOTS_A
      AliasConditionState = RUBBLE MOVING BETWEEN_FIRING_SHOTS_A
      AliasConditionState = RUBBLE UNPACKING
      AliasConditionState = RUBBLE MOVING UNPACKING
      AliasConditionState = RUBBLE UNPACKING BETWEEN_FIRING_SHOTS_A
      AliasConditionState = RUBBLE MOVING UNPACKING BETWEEN_FIRING_SHOTS_A
      AliasConditionState = RUBBLE PACKING
      AliasConditionState = RUBBLE MOVING PACKING
      AliasConditionState = RUBBLE PACKING BETWEEN_FIRING_SHOTS_A
      AliasConditionState = RUBBLE MOVING PACKING BETWEEN_FIRING_SHOTS_A
      AliasConditionState = RUBBLE DEPLOYED
      AliasConditionState = RUBBLE DEPLOYED MOVING
      AliasConditionState = RUBBLE DEPLOYED BETWEEN_FIRING_SHOTS_A
      AliasConditionState = RUBBLE DEPLOYED MOVING BETWEEN_FIRING_SHOTS_A
      AliasConditionState = RUBBLE DEPLOYED FIRING_A
      AliasConditionState = RUBBLE DEPLOYED MOVING FIRING_A
      AliasConditionState = RUBBLE DEPLOYED RELOADING_A
      AliasConditionState = RUBBLE DEPLOYED MOVING RELOADING_A

      ;*** PACKED STATE -- ready to move ***
      ConditionState    = MOVING
        Animation       = NVNukeCnNG.NVNukeCnNG
        AnimationMode   = ONCE_BACKWARDS
        Flags           = START_FRAME_FIRST
      End
      AliasConditionState = MOVING BETWEEN_FIRING_SHOTS_A ;Very long shot delay -- possibly moving
      AliasConditionState = BETWEEN_FIRING_SHOTS_A
      ;***
      ConditionState    = REALLYDAMAGED MOVING
        Model           = NVNukeCnNG_D
        Animation       = NVNukeCnNG_D.NVNukeCnNG_D
        AnimationMode   = ONCE_BACKWARDS
        Flags           = START_FRAME_FIRST
      End
      AliasConditionState = REALLYDAMAGED MOVING BETWEEN_FIRING_SHOTS_A ;Very long shot delay -- possibly moving
      ; Reborn: Resolve ambiguous deploy-state, movement and rubble matches.
      AliasConditionState = REALLYDAMAGED
      AliasConditionState = REALLYDAMAGED BETWEEN_FIRING_SHOTS_A


      ;*** UNPACKING STATE  -- preparing to fire ***
      ConditionState    = UNPACKING
        Animation       = NVNukeCnNG.NVNukeCnNG
        AnimationMode   = MANUAL ;ONCE
      End
      AliasConditionState = UNPACKING BETWEEN_FIRING_SHOTS_A ;Very long shot delay
      ; Reborn: Resolve ambiguous deploy-state, movement and rubble matches.
      AliasConditionState = UNPACKING MOVING
      AliasConditionState = UNPACKING MOVING BETWEEN_FIRING_SHOTS_A
      ;***
      ConditionState    = REALLYDAMAGED UNPACKING
        Model           = NVNukeCnNG_D
        Animation       = NVNukeCnNG_D.NVNukeCnNG_D
        AnimationMode   = MANUAL ;ONCE
      End
      AliasConditionState = REALLYDAMAGED UNPACKING BETWEEN_FIRING_SHOTS_A ;Very long shot delay
      ; Reborn: Resolve ambiguous deploy-state, movement and rubble matches.
      AliasConditionState = REALLYDAMAGED UNPACKING MOVING
      AliasConditionState = REALLYDAMAGED UNPACKING MOVING BETWEEN_FIRING_SHOTS_A

      ;*** PACKING STATE -- preparing to move ***
      ConditionState    = PACKING
        Animation       = NVNukeCnNG.NVNukeCnNG
        AnimationMode   = MANUAL ;ONCE_BACKWARDS
        ; Flags           = START_FRAME_LAST
      End

      AliasConditionState = PACKING BETWEEN_FIRING_SHOTS_A ;Very long shot delay
      ; Reborn: Resolve ambiguous deploy-state, movement and rubble matches.
      AliasConditionState = PACKING MOVING
      AliasConditionState = PACKING MOVING BETWEEN_FIRING_SHOTS_A
      ;***
      ConditionState    = REALLYDAMAGED PACKING
        Model           = NVNukeCnNG_D
        Animation       = NVNukeCnNG_D.NVNukeCnNG_D
        AnimationMode   = MANUAL ;ONCE_BACKWARDS
        ; Flags           = START_FRAME_LAST
      End
      AliasConditionState = REALLYDAMAGED PACKING BETWEEN_FIRING_SHOTS_A ;Very long shot delay
      ; Reborn: Resolve ambiguous deploy-state, movement and rubble matches.
      AliasConditionState = REALLYDAMAGED PACKING MOVING
      AliasConditionState = REALLYDAMAGED PACKING MOVING BETWEEN_FIRING_SHOTS_A

      ;*** DEPLOYED STATE -- ready to fire ***
      ConditionState  = DEPLOYED 
        Animation       = NVNukeCnNG.NVNukeCnNG
        AnimationMode   = ONCE
        Flags           = START_FRAME_LAST
        TransitionKey   = TRANS_FIRING_A
        HideSubObject   = TURRETFRONT TURRETBACK   ;Hide pack/unpack animated turret
        ShowSubObject   = TURRET01      ;Show controlled turret
      End
      AliasConditionState = DEPLOYED FIRING_A
      AliasConditionState = DEPLOYED BETWEEN_FIRING_SHOTS_A
      AliasConditionState = DEPLOYED RELOADING_A
      AliasConditionState = DEPLOYED MOVING
      ; Reborn: Resolve ambiguous deploy-state, movement and rubble matches.
      AliasConditionState = DEPLOYED MOVING BETWEEN_FIRING_SHOTS_A
      AliasConditionState = DEPLOYED MOVING FIRING_A
      AliasConditionState = DEPLOYED MOVING RELOADING_A

      ConditionState  = DEPLOYED REALLYDAMAGED
        Model           = NVNukeCnNG_D
        Animation       = NVNukeCnNG_D.NVNukeCnNG_D
        AnimationMode   = ONCE
        Flags           = START_FRAME_LAST
        TransitionKey   = TRANS_FIRING_A
        HideSubObject   = TURRETFRONT TURRETBACK  ;Hide pack/unpack animated turret
        ShowSubObject   = TURRET01      ;Show controlled turret
      End
      AliasConditionState = DEPLOYED REALLYDAMAGED FIRING_A
      AliasConditionState = DEPLOYED REALLYDAMAGED BETWEEN_FIRING_SHOTS_A
      AliasConditionState = DEPLOYED REALLYDAMAGED RELOADING_A
      AliasConditionState = DEPLOYED REALLYDAMAGED MOVING
      ; Reborn: Resolve ambiguous deploy-state, movement and rubble matches.
      AliasConditionState = DEPLOYED REALLYDAMAGED MOVING BETWEEN_FIRING_SHOTS_A
      AliasConditionState = DEPLOYED REALLYDAMAGED MOVING FIRING_A
      AliasConditionState = DEPLOYED REALLYDAMAGED MOVING RELOADING_A

      TrackMarks              = EXTnkTrack.tga
      TreadAnimationRate      = 4.0  ; amount of tread texture to move per second
    End
  End

  ; *** DESIGN Parameters ***
  Side = ChinaNukeGeneral

  BuildCost       = 1500

  ReplaceModule Prerequisites
    Object = Nuke_ChinaWarFactory
    Object = Nuke_ChinaPropagandaCenter
  End

  ; *** ENGINEERING Parameters ***
  ReplaceModule ModuleTag_06
    Behavior = SlowDeathBehavior ModuleTag_Nuke06
      DeathTypes = ALL -CRUSHED -SPLATTED
      DestructionDelay  = 500
      DestructionDelayVariance  = 100
      FX  = INITIAL  FX_BattleMasterExplosionOneFinal
      OCL = INITIAL  OCL_RadiationFieldSmall
      OCL = MIDPOINT OCL_Nuke_ChinaVehicleNukeCannonDie
      OCL = FINAL    OCL_RadiationFieldSmall
      FX  = FINAL    FX_ChinaVehicleNukeCannonDeathExplosion
    End
  End

End
;------------------------------------------------------------------------------
