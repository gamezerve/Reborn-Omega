;//////////////////////////////////////////////////////////////////////////////
;FILE: Nuke_ChinaVehicleNukeTruck.ini /////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
Object Nuke_ChinaVehicleNukeTruck

  ; *** ART Parameters ***
  SelectPortrait         = SSConvoy_L
  ButtonImage            = SSConvoy_L
  Draw              = W3DTruckDraw ModuleTag_01
  OkToChangeModelColor = Yes
    ConditionState  = NONE
      Model         = NVConvoy
    End
    ConditionState  = LOADED
      Model         = NVConvoy
    End  
    CabRotationMultiplier = 1.5

    TrailerRotationMultiplier = 0.2
    RotationDamping = 0.7

    RightFrontTireBone = Tire01
    LeftFrontTireBone = Tire02
    MidRightRearTireBone = Tire07
    MidLeftRearTireBone = Tire08
    RightRearTireBone = Tire09
    LeftRearTireBone = Tire10

    TireRotationMultiplier = 0.2   ; this * speed = rotation.
    
    TrackMarks = EXTireTrack.tga
    Dust = RocketBuggyDust
    DirtSpray = RocketBuggyDirtSpray
  End

  ; ***DESIGN parameters ***
  DisplayName       = OBJECT:NukeTruck
  EditorSorting     = VEHICLE
  Side              = ChinaNukeGeneral
  Prerequisites
    Object = Nuke_ChinaNuclearMissileLauncher
  End
  BuildCost         = 1500
  BuildTime         = 30.0      ;in seconds
  ArmorSet
    Armor           = TruckArmor
    DamageFX        = CrushableCarDamageFX
  End
  TransportSlotCount  = 0                 ;how many "slots" we take in a transport (0 == not transportable)
  WeaponSet
    Conditions = None 
    Weapon = PRIMARY ConvoyTruckSuicideWeapon 
  End
  VisionRange       = 150
  ShroudClearingRange = 350

  CrusherLevel           = 2  ;What can I crush?: 1 = infantry, 2 = trees, 3 = vehicles
  CrushableLevel         = 2  ;What am I?:        0 = for infantry, 1 = for trees, 2 = general vehicles
  CommandSet = CivilianTransportWithNukeCommandSet

  ; *** AUDIO Parameters ***
  ;VoiceSelect             = ConvoyTruckVoiceSelect
  ;VoiceMove               = ConvoyTruckVoiceMove
  ;SoundMoveStart          = ConvoyTruckMoveStart
  VoiceSelect           = NukeCannonVoiceAttack
  VoiceMove             = NukeCannonVoiceMove
  VoiceGuard            = NukeCannonVoiceMove
  VoiceAttack           = NukeCannonVoiceAttack
  SoundMoveStart        = NukeCannonMoveStart
  SoundMoveStartDamaged = NukeCannonMoveStart
  UnitSpecificSounds
    VoiceCreate         = NukeCannonVoiceCreate
    VoiceEnter          = NukeCannonVoiceMove
  End

  ; *** ENGINEERING Parameters ***  
  RadarPriority     = UNIT
  KindOf            = PRELOAD SELECTABLE CAN_CAST_REFLECTIONS VEHICLE SCORE CAN_ATTACK

  Body              = ActiveBody ModuleTag_02
    MaxHealth       = 350.0
    InitialHealth   = 350.0
  End
  Behavior = AIUpdateInterface ModuleTag_06
  End
  Locomotor       = SET_NORMAL SupplyTruckLocomotor

  Behavior          = PhysicsBehavior ModuleTag_07
    Mass            = 30.0
  End

; Switched to death weapon so that if killed he will explode right away, 
  Behavior = SlowDeathBehavior ModuleTag_09
    DeathTypes = NONE +SUICIDED
    DestructionDelay = 1500
    OCL = FINAL OCL_GenericCarExplode
    Weapon = FINAL DirtyNukeCreationWeapon
  End
  Behavior = SlowDeathBehavior ModuleTag_10
    DeathTypes = ALL -SUICIDED
    DestructionDelay = 0
    OCL = FINAL OCL_GenericCarExplode
    Weapon = FINAL DirtyNukeCreationWeapon
  End

  Behavior = FlammableUpdate ModuleTag_21
    AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
    AflameDamageAmount = 5       ; taking this much damage...
    AflameDamageDelay = 500       ; this often.
  End

  Geometry            = BOX
  GeometryIsSmall     = NO
  GeometryMajorRadius = 20.0
  GeometryMinorRadius = 8.0
  GeometryHeight      = 16.0
  Shadow              = SHADOW_VOLUME

End
;------------------------------------------------------------------------------
