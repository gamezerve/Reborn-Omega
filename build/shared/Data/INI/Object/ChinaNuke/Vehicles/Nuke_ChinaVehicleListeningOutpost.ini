;//////////////////////////////////////////////////////////////////////////////
;FILE: Nuke_ChinaVehicleListeningOutpost.ini //////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Share the base Listening Outpost while retaining Nuke art, cost, requirements, stealth detection feedback and Tank Hunters.
ObjectInherit Nuke_ChinaVehicleListeningOutpost ChinaVehicleListeningOutpost

  ; *** ART Parameters ***
  SelectPortrait         = Nuke_NVLOutpost
  ButtonImage            = Nuke_NVLOutpost

  ; ***DESIGN parameters ***
  Side            = ChinaNukeGeneral
  BuildCost       = 850
  BuildTime       = 14.0          ;in seconds
  ReplaceModule Prerequisites
    Object = Nuke_ChinaWarFactory
  End
  ; Reborn: The base command set is identical to Nuke_ChinaListeningOutpostCommandSet.
  ;CommandSet = Nuke_ChinaListeningOutpostCommandSet

  ; *** ENGINEERING Parameters ***
  ReplaceModule ModuleTag_03 ; Reborn: Keep this general's IR grid stealth detection feedback instead of the base ping sounds.
    Behavior = StealthDetectorUpdate Nuke_ModuleTag_StealthDetector
      DetectionRate             = 900   ; how often to rescan for stealthed things in my sight (msec)
      DetectionRange            = 300
      CanDetectWhileGarrisoned  = No
      CanDetectWhileContained   = No
      IRGridParticleSysName     = IRDetectGrid
      IRBeaconParticleSysName   = IRLenzflare
      IRParticleSysBone         = IRFX
    End
  End

  ReplaceModule ModuleTag_06 ; Reborn: Keep this general's Tank Hunter payload.
    Behavior = TransportContain Nuke_ModuleTag_TransportContain
      PassengersAllowedToFire = Yes
      Slots                 = 2
      InitialPayload        = Nuke_ChinaInfantryTankHunter 2
      ScatterNearbyOnExit   = No
      HealthRegen%PerSec    = 10
      DamagePercentToUnits  = 10%
      AllowInsideKindOf     = INFANTRY
      ExitDelay         = 250
      NumberOfExitPaths = 3
      GoAggressiveOnExit = Yes
      ArmedRidersUpgradeMyWeaponSet = Yes
    End
  End

End
;------------------------------------------------------------------------------
