ObjectInherit Nuke_ChinaInfantryTankHunter ChinaInfantryTankHunter

  ; *** ART Parameters ***
  SelectPortrait = SNNukeHunter_L
  ButtonImage = SNNukeHunter_L

 ReplaceModule ModuleTag_01
 Draw = W3DModelDraw ModuleTag_NukeDraw
    OkToChangeModelColor = Yes
  
  
    DefaultConditionState
      Model             = NINukeHnt_SKN
      IdleAnimation     = NIMSST_SKL.NIMSST_STA 0 30
      IdleAnimation     = NIMSST_SKL.NIMSST_IDA
      IdleAnimation     = NIMSST_SKL.NIMSST_IDB
      AnimationMode     = ONCE
      AnimationSpeedFactorRange = 0.8 1.2
      TransitionKey     = TRANS_Stand
      ;WeaponMuzzleFlash = PRIMARY MuzzleFX
      WeaponFireFXBone  = PRIMARY Muzzle
      WeaponLaunchBone  = PRIMARY Muzzle
      WeaponLaunchBone  = SECONDARY Muzzle
    End
    AliasConditionState = REALLYDAMAGED
    AliasConditionState = USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = REALLYDAMAGED USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.

    ConditionState      = FIRING_A 
      Animation         = NIMSST_SKL.NIMSST_ATA 
      AnimationMode     = ONCE
      TransitionKey     = TRANS_START_FIRING
    End
    AliasConditionState = REALLYDAMAGED FIRING_A
    AliasConditionState = FIRING_A MOVING
    AliasConditionState = FIRING_A MOVING REALLYDAMAGED
    AliasConditionState = FIRING_A MOVING ATTACKING
    AliasConditionState = FIRING_A MOVING ATTACKING REALLYDAMAGED
    AliasConditionState = ATTACKING BETWEEN_FIRING_SHOTS_A DYING FIRING_A RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING BETWEEN_FIRING_SHOTS_A FIRING_A MOVING REALLYDAMAGED RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING BETWEEN_FIRING_SHOTS_A DYING FIRING_A MOVING REALLYDAMAGED RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING BETWEEN_FIRING_SHOTS_A FIRING_A FREEFALL MOVING REALLYDAMAGED RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING BETWEEN_FIRING_SHOTS_A FIRING_A MOVING PARACHUTING REALLYDAMAGED RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING BETWEEN_FIRING_SHOTS_A DYING EXPLODED_BOUNCING FIRING_A MOVING REALLYDAMAGED RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING BETWEEN_FIRING_SHOTS_A DYING EXPLODED_FLAILING FIRING_A MOVING REALLYDAMAGED RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    
    ConditionState      = BETWEEN_FIRING_SHOTS_A
      Animation         = NIMSST_SKL.NIMSST_STA
      AnimationMode     = ONCE
      ; this is basically a trick: this guy has a nontrivial animation for firing,
      ; and a long recycle time between shots. we want him to finish his fire animation
      ; (unless he's ordered to do something else), so this is just a handy trick that
      ; says, "if the previous state had this transition key, allow it to finish before
      ; switching to us, if possible".
      WaitForStateToFinishIfPossible = TRANS_START_FIRING
    End
    AliasConditionState = REALLYDAMAGED BETWEEN_FIRING_SHOTS_A
    AliasConditionState = BETWEEN_FIRING_SHOTS_A REALLYDAMAGED USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING BETWEEN_FIRING_SHOTS_A REALLYDAMAGED USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = BETWEEN_FIRING_SHOTS_A DYING REALLYDAMAGED USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = BETWEEN_FIRING_SHOTS_A REALLYDAMAGED RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING BETWEEN_FIRING_SHOTS_A DYING REALLYDAMAGED USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = BETWEEN_FIRING_SHOTS_A DYING REALLYDAMAGED RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING BETWEEN_FIRING_SHOTS_A DYING REALLYDAMAGED RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.

    ConditionState      = MOVING
      Animation         = NIMSST_SKL.NIMSST_RNA 20
      AnimationMode     = LOOP
      Flags             = RANDOMSTART
      TransitionKey     = None
      ParticleSysBone   = None InfantryDustTrails
    End
    AliasConditionState = REALLYDAMAGED MOVING
    AliasConditionState = MOVING ATTACKING
    AliasConditionState = MOVING ATTACKING REALLYDAMAGED
    AliasConditionState = ATTACKING ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING REALLYDAMAGED ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING REALLYDAMAGED USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = MOVING REALLYDAMAGED USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING DYING REALLYDAMAGED USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = BETWEEN_FIRING_SHOTS_A MOVING REALLYDAMAGED USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = DYING MOVING REALLYDAMAGED USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING BETWEEN_FIRING_SHOTS_A MOVING REALLYDAMAGED USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING BETWEEN_FIRING_SHOTS_A DYING MOVING REALLYDAMAGED USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING BETWEEN_FIRING_SHOTS_A FREEFALL MOVING REALLYDAMAGED USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING BETWEEN_FIRING_SHOTS_A MOVING PARACHUTING REALLYDAMAGED USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING BETWEEN_FIRING_SHOTS_A DYING EXPLODED_BOUNCING MOVING REALLYDAMAGED USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING BETWEEN_FIRING_SHOTS_A DYING EXPLODED_FLAILING MOVING REALLYDAMAGED USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.

    ConditionState      = RELOADING_A
      Animation         = NIMSST_SKL.NIMSST_ATA 10
      AnimationMode     = ONCE
      ;WeaponLaunchBone = PRIMARY WeaponA
    End
    AliasConditionState = MOVING RELOADING_A
    AliasConditionState = REALLYDAMAGED MOVING RELOADING_A
    AliasConditionState = REALLYDAMAGED RELOADING_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = REALLYDAMAGED RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = DYING REALLYDAMAGED RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = BETWEEN_FIRING_SHOTS_A MOVING REALLYDAMAGED RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = BETWEEN_FIRING_SHOTS_A DYING MOVING REALLYDAMAGED RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = BETWEEN_FIRING_SHOTS_A FREEFALL MOVING REALLYDAMAGED RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = BETWEEN_FIRING_SHOTS_A MOVING PARACHUTING REALLYDAMAGED RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = BETWEEN_FIRING_SHOTS_A DYING EXPLODED_BOUNCING MOVING REALLYDAMAGED RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = BETWEEN_FIRING_SHOTS_A DYING EXPLODED_FLAILING MOVING REALLYDAMAGED RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.

    ConditionState      = DYING
      Animation         = NIMSST_SKL.NIMSST_DTA
      Animation         = NIMSST_SKL.NIMSST_DTB
      AnimationSpeedFactorRange = 0.9 1.25
      AnimationMode     = ONCE
      TransitionKey     = TRANS_Dying
    End
    AliasConditionState = ATTACKING DYING USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    ; AliasConditionState = DYING RUBBLE ; Reborn: Use the proper death animation when killed by explosive damage.

    TransitionState     = TRANS_Dying TRANS_Flailing
      Animation         = NIMSST_SKL.NIMSST_ADTD1
      AnimationMode     = ONCE
    End

    ConditionState      = DYING EXPLODED_FLAILING
      Animation         = NIMSST_SKL.NIMSST_ADTD2
      AnimationMode     = LOOP
      TransitionKey     = TRANS_Flailing
    End
    AliasConditionState = BETWEEN_FIRING_SHOTS_A DYING EXPLODED_FLAILING USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING BETWEEN_FIRING_SHOTS_A DYING EXPLODED_FLAILING USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = BETWEEN_FIRING_SHOTS_A DYING EXPLODED_FLAILING MOVING USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = BETWEEN_FIRING_SHOTS_A DYING EXPLODED_FLAILING RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING DYING EXPLODED_FLAILING REALLYDAMAGED RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING BETWEEN_FIRING_SHOTS_A DYING EXPLODED_FLAILING FIRING_A RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.

    ConditionState      = DYING EXPLODED_BOUNCING
      Animation         = NIMSST_SKL.NIMSST_ADTD3
      AnimationMode     = ONCE
      TransitionKey     = None
    End
    AliasConditionState = BETWEEN_FIRING_SHOTS_A DYING EXPLODED_BOUNCING USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING BETWEEN_FIRING_SHOTS_A DYING EXPLODED_BOUNCING USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = BETWEEN_FIRING_SHOTS_A DYING EXPLODED_BOUNCING MOVING USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = BETWEEN_FIRING_SHOTS_A DYING EXPLODED_BOUNCING RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING DYING EXPLODED_BOUNCING REALLYDAMAGED RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    AliasConditionState = ATTACKING BETWEEN_FIRING_SHOTS_A DYING EXPLODED_BOUNCING FIRING_A RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.

    ;PARACHUTING ANIMATIONS
    ConditionState      = FREEFALL
      Animation         = NIMSST_SKL.NIMSST_POP
      AnimationMode     = ONCE
      TransitionKey     = TRANS_Falling
    End
    AliasConditionState = FREEFALL REALLYDAMAGED
    AliasConditionState = FREEFALL DYING
    AliasConditionState = ATTACKING FREEFALL REALLYDAMAGED RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    
    ConditionState      = PARACHUTING
      Animation         = NIMSST_SKL.NIMSST_PHG
      AnimationMode     = LOOP
      Flags             = PRISTINE_BONE_POS_IN_FINAL_FRAME  ; our bone positions should come from the last frame, rather than the first
      TransitionKey     = TRANS_Chute
    End
    AliasConditionState = PARACHUTING REALLYDAMAGED
    AliasConditionState = PARACHUTING DYING
    AliasConditionState = ATTACKING PARACHUTING REALLYDAMAGED RELOADING_A USING_WEAPON_A ; Reborn: Keep walking between shots while preserving actual firing and reload priorities.
    
   ; TransitionState     = TRANS_Falling TRANS_Chute
   ;   Animation         = NIMSST_SKL.NIMSST_POP
   ;   AnimationMode     = ONCE
   ;   Flags             = PRISTINE_BONE_POS_IN_FINAL_FRAME  ; our bone positions should come from the last frame, rather than the first
   ; End
    
    TransitionState     = TRANS_Chute TRANS_Stand
      Animation         = NIMSST_SKL.NIMSST_PDN
      AnimationMode     = ONCE
    End

   End

  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:NukeTankHunter
  Side = ChinaNukeGeneral

  BuildCost = 350
  BuildTime = 6.0

  ReplaceModule Prerequisites
    Object = Nuke_ChinaBarracks
  End

  ReplaceModule WeaponSet
    Conditions = None
    Weapon = PRIMARY ChinaInfantryTankHunterMissileLauncherNuke
  End

End
