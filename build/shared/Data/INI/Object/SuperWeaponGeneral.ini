Object SupW_NeutronMissile

  ; *** ART Parameters ***
  Draw               = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    ConditionState   = NONE
      ;Model          = ABNukeMissle ; Reborn: Original orientation of this model was wrong, so I rotated and named ABNukeMissle_RO
      Model          = ABNukeMissle_RO
    End
    ConditionState   = DAMAGED REALLYDAMAGED RUBBLE
      Model          = NONE
    End
    
  End

  ; ***DESIGN parameters ***
  DisplayName        = OBJECT:NeutronMissile
  KindOf             = UNATTACKABLE
  EditorSorting      = SYSTEM
  VisionRange = 300.0  
  ShroudClearingRange = 0
  TransportSlotCount = 10
  ArmorSet
    Conditions       = None
    Armor            = ProjectileArmor
    DamageFX         = None
  End

  ; *** AUDIO Parameters ***
  ; SoundFallingFromPlane = DaisyCutterWeapon
    
  ; *** ENGINEERING Parameters ***
  Body = ActiveBody ModuleTag_02
    MaxHealth        = 99999999.0
    InitialHealth    = 99999999.0
  End

  Behavior = NeutronMissileUpdate ModuleTag_03
    ; DistanceToTravelBeforeTurning = 600       ; goes straight up a long ways first
    ; MaxTurnRate = 9000                        ; huge, since it turns off-camera
    DistanceToTravelBeforeTurning = 450       ; goes straight up a long ways first
    MaxTurnRate = 7200                        ; huge, since it turns off-camera
    ForwardDamping = 0.1
    RelativeSpeed = 2.0
    LaunchFX = FX_NeutronMissileLaunch
    IgnitionFX = FX_NeutronMissileIgnition
    TargetFromDirectlyAbove = 500      ; aim for an intermed spot directly above the target, so we come straight down onto it
