;------------------------------------------------------------------------------
; Reborn: Inherit shared Fire Base behavior while retaining faction-specific differences.
ObjectInherit SupW_AmericaFireBase AmericaFireBase

  SelectPortrait = SupW_SAFirebase
  ButtonImage = SupW_SAFirebase

  DisplayName = OBJECT:SupW_FireBase
  Side = AmericaSuperWeaponGeneral

  ReplaceModule Prerequisites
    Object = SupW_AmericaPowerPlant
  End

  EnergyProduction = -1

  KindOf = +POWER_DEPENDENT_WEAPONSET ; Reborn: Use EMP only when player power and local power mode permit it.

  WeaponSet
    Conditions          = None 
    Weapon              = PRIMARY     FireBaseHowitzerGun
  End

  ; Reborn: The normal weapon remains available in low power or manual power-off; EMP returns when power is restored.
  WeaponSet
    Conditions = POWERED
    Weapon = PRIMARY EMPFireBaseHowitzerGun
  End

End
;------------------------------------------------------------------------------
