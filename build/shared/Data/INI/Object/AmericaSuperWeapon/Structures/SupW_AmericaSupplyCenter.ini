ObjectInherit SupW_AmericaSupplyCenter AmericaSupplyCenter

  ; *** ART Parameters ***
  SelectPortrait         = SupW_SASupplyCntr
  ButtonImage            = SupW_SASupplyCntr

  ; ***DESIGN parameters ***
  Side                   = AmericaSuperWeaponGeneral
  ReplaceModule Prerequisites
    Object = SupW_AmericaPowerPlant
  End
  CommandSet             = SupW_AmericaSupplyCenterCommandSet

  ; *** ENGINEERING Parameters ***
  ; Reborn: Preserve the faction-specific Rangers released when the completed supply center is destroyed.
  OverrideModule ModuleTag_08
    CreationList = SupW_OCL_AmericanRangerDebris03
  End

  ; Reborn: Spawn the faction-specific supply Chinook.
  OverrideModule ModuleTag_12
    SpawnTemplateNameOverride = SupW_AmericaVehicleChinook
  End

End
