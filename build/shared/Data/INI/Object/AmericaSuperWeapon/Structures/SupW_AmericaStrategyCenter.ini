;------------------------------------------------------------------------------
ObjectInherit SupW_AmericaStrategyCenter AmericaStrategyCenter

  ; *** ART Parameters ***
  SelectPortrait         = SupW_SAStrategyCenter
  ButtonImage            = SupW_SAStrategyCenter

  ; ***DESIGN parameters ***
  Side                   = AmericaSuperWeaponGeneral
  ReplaceModule Prerequisites
    Object = SupW_AmericaWarFactory SupW_AmericaAirfield
  End
  CommandSet             = SupW_AmericaStrategyCenterCommandSet

  ; *** ENGINEERING Parameters ***
  ; Reborn: Preserve the faction-specific Rangers released when the completed strategy center is destroyed.
  OverrideModule ModuleTag_19
    CreationList = SupW_OCL_AmericanRangerDebris04
  End

  ; Reborn: Call in the faction-specific Special Forces.
  OverrideModule ModuleTag_24
    OCL = SupW_SUPERWEAPON_SpecialForces
  End

End
;------------------------------------------------------------------------------
