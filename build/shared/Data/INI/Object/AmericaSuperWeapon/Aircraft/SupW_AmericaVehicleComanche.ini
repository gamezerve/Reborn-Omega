;//////////////////////////////////////////////////////////////////////////////
;FILE: SupW_AmericaVehicleComanche.ini ////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
ObjectInherit SupW_AmericaVehicleComanche AmericaVehicleComanche

  ; *** ART Parameters ***
  SelectPortrait         = SACCommancheGunship
  ButtonImage            = SACCommancheGunship

  ; *** DESIGN Parameters ***
  DisplayName            = OBJECT:ComancheGunship
  Side                   = AmericaSuperWeaponGeneral

  ReplaceModule Prerequisites
    Object               = SupW_AmericaAirfield
  End

  WeaponSet
    Conditions          = None
    Weapon              = PRIMARY     ComancheGunshipGattlingCannon
    PreferredAgainst    = PRIMARY     INFANTRY
    AutoChooseSources   = PRIMARY     FROM_PLAYER FROM_SCRIPT FROM_AI
    Weapon              = SECONDARY   ComancheAntiTankMissileWeapon
    PreferredAgainst    = SECONDARY   VEHICLE STRUCTURE
    AutoChooseSources   = SECONDARY   FROM_PLAYER FROM_SCRIPT FROM_AI
    Weapon              = TERTIARY    NONE
  End

  WeaponSet
    Conditions          = PLAYER_UPGRADE
    Weapon              = PRIMARY     ComancheGunshipGattlingCannon
    PreferredAgainst    = PRIMARY     INFANTRY
    AutoChooseSources   = PRIMARY     FROM_PLAYER FROM_SCRIPT FROM_AI
    Weapon              = SECONDARY   ComancheAntiTankMissileWeapon
    PreferredAgainst    = SECONDARY   VEHICLE STRUCTURE
    AutoChooseSources   = SECONDARY   FROM_PLAYER FROM_SCRIPT FROM_AI
    Weapon              = TERTIARY    ComancheRocketPodWeapon
    AutoChooseSources   = TERTIARY    NONE
  End

  BuildCost             = 1500
  CommandSet            = SupW_AmericaVehicleComancheCommandSet

  KindOf                = +TRANSPORT

  OverrideModule ModuleTag_04
    MaxHealth           = 350.0
    InitialHealth       = 350.0
  End

  ; Reborn: Adding an AI module automatically removes the inherited JetAIUpdate.

  AddModule
    Behavior = ComancheTransportAIUpdate ModuleTag_ComancheTransportAIUpdate
      MinHeight                     = 5
      NeedsRunway                   = No
      KeepsParkingSpaceWhenAirborne = No
      AutoAcquireEnemiesWhenIdle    = Yes

      Turret
        TurretTurnRate          = 0
        TurretPitchRate         = 0
        ControlledWeaponSlots   = PRIMARY SECONDARY
      End

      RopeName             = GenericRope
      RopeWidth            = 0.5
      RopeColor            = R:0 G:0 B:0
      RopeWobbleLen        = 10
      RopeWobbleAmplitude  = 0.25
      RopeWobbleRate       = 180
      RopeFinalHeight      = 10
      RappelSpeed          = 30
      PerRopeDelayMin      = 900
      PerRopeDelayMax      = 1500
      MinDropHeight        = 40
    End
  End

  ; Reborn: Replacing the inherited AI also removes its locomotor sets; bind both sets to the new transport AI.
  Locomotor = SET_NORMAL  ComancheLocomotor
  Locomotor = SET_TAXIING BasicHelicopterTaxiLocomotor

  AddModule
    Behavior = TransportContain SupW_ModuleTag_Transport
      Slots                    = 4
      InitialPayload           = SupW_AmericaInfantryRanger 2
      PassengersAllowedToFire  = Yes
      DamagePercentToUnits     = 100%
      EnterSound               = GarrisonEnter
      ExitSound                = GarrisonExit
      AllowInsideKindOf        = INFANTRY
      ForbidInsideKindOf       = AIRCRAFT HUGE_VEHICLE
      NumberOfExitPaths        = 1
      ExitDelay                = 100
    End
  End

End
;------------------------------------------------------------------------------
