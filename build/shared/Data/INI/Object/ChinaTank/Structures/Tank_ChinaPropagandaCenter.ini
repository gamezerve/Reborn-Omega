; Reborn: Share the base Propaganda Center while retaining this general's portrait, requirements and command sets, without unit production.
ObjectInherit Tank_ChinaPropagandaCenter ChinaPropagandaCenter

  ; *** ART Parameters ***
  SelectPortrait         = Tank_SNPropCentr
  ButtonImage            = Tank_SNPropCentr

  ; ***DESIGN parameters ***
