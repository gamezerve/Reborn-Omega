; Reborn: Share the base Barracks while preserving this general's distinct settings.
ObjectInherit Tank_ChinaBarracks ChinaBarracks

  SelectPortrait = Tank_SNBarracks
  ButtonImage = Tank_SNBarracks

  Side = ChinaTankGeneral

  CommandSet = Tank_ChinaBarracksCommandSet

  ReplaceModule ModuleTag_10 ; Reborn: Replace rather than append the faction-specific production quantity rule.
    Behavior = ProductionUpdate Tank_ModuleTag_10
      QuantityModifier = Tank_ChinaInfantryRedguard 2
    End
  End

  OverrideModule ModuleTag_25 ; Reborn: Retain the faction-specific menu after researching mines.
    CommandSet = Tank_ChinaBarracksCommandSetUpgrade
  End

End
