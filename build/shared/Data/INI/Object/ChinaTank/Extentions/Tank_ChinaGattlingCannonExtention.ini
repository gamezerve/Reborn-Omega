;------------------------------------------------------------------------------
; Reborn: Share the Tank General Gattling Cannon and attach it to the Airfield as an extention.
ObjectInherit Tank_ChinaGattlingCannonExtention Tank_ChinaGattlingCannon

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:GattlingCannonExtention
  CommandSet  = ChinaGattlingCannonExtentionCommandSet

  Behavior = SlavedUpdate ModuleTag_16
    GuardMaxRange           = 0
    GuardWanderRange        = 0
    AttackRange             = 0
    AttackWanderRange       = 0
    ScoutRange              = 0
    ScoutWanderRange        = 0
    StayOnSameLayerAsMaster = Yes
    IsRebornExtention       = Yes
    UpgradeToRemoveOnSell   = Tank_Upgrade_ChinaGattlingCannonExtention
  End

  Behavior = UpgradeDie ModuleTag_27
    ;This frees the object based upgrade for the producer object.
    DeathTypes      = ALL
    UpgradeToRemove = Tank_Upgrade_ChinaGattlingCannonExtention ModuleTag_28
  End

End
;------------------------------------------------------------------------------
