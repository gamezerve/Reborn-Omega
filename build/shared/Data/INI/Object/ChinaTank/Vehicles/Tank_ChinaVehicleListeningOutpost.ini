;//////////////////////////////////////////////////////////////////////////////
;FILE: Tank_ChinaVehicleListeningOutpost.ini //////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Share the base Listening Outpost while retaining Tank cost, requirements, stealth detection feedback and Tank Hunters. The base weapon sets now arm the outpost only while armed riders are inside, as for the other generals.
ObjectInherit Tank_ChinaVehicleListeningOutpost ChinaVehicleListeningOutpost

  ; ***DESIGN parameters ***
  Side            = ChinaTankGeneral
  BuildCost       = 900
  BuildTime       = 14.0          ;in seconds
  ReplaceModule Prerequisites
    Object = Tank_ChinaWarFactory
  End

  ; *** ENGINEERING Parameters ***
  ReplaceModule ModuleTag_03 ; Reborn: Keep this general's IR grid stealth detection feedback instead of the base ping sounds.
    Behavior = StealthDetectorUpdate Tank_ModuleTag_StealthDetector
      DetectionRate             = 900   ; how often to rescan for stealthed things in my sight (msec)
      DetectionRange            = 300
      CanDetectWhileGarrisoned  = No
      CanDetectWhileContained   = No
      IRGridParticleSysName     = IRDetectGrid
      IRBeaconParticleSysName   = IRLenzflare
      IRParticleSysBone         = IRFX
    End
  End

  ReplaceModule ModuleTag_06 ; Reborn: Keep this general's Tank Hunter payload; armed riders now enable the dummy weapon as on the base outpost.
    Behavior = TransportContain Tank_ModuleTag_TransportContain
      PassengersAllowedToFire = Yes
      Slots                 = 2
      InitialPayload        = Tank_ChinaInfantryTankHunter 2
      ScatterNearbyOnExit   = No
      HealthRegen%PerSec    = 10
      DamagePercentToUnits  = 10%
      AllowInsideKindOf     = INFANTRY
      ExitDelay         = 250
      NumberOfExitPaths = 3
      GoAggressiveOnExit = Yes
      ArmedRidersUpgradeMyWeaponSet = Yes
    End
  End

End
;------------------------------------------------------------------------------
