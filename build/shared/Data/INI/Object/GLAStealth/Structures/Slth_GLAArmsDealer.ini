;------------------------------------------------------------------------------
;GLA Arms Dealer
; Reborn: Inherit shared Arms Dealer draw states and behavior; retain faction-specific settings.
ObjectInherit Slth_GLAArmsDealer GLAArmsDealer

  UpgradeCameo2 = Upgrade_GLACamoNetting

  ; *** ART Parameters ***
  SelectPortrait = Slth_SUArmsDealer
  ButtonImage = Slth_SUArmsDealer

  ; *** DESIGN Parameters ***
  Side = GLAStealthGeneral

  ReplaceModule Prerequisites
    Object = Slth_GLASupplyStash
  End

  CommandSet = Slth_GLAArmsDealerCommandSet

  ; Reborn: Only Stealth Arms Dealers receive camo capability and its visual trigger.
  AddModule
    Behavior = StealthUpdate ModuleStealth_09
      StealthDelay                = 2500 ; msec
      StealthForbiddenConditions  = ATTACKING USING_ABILITY TAKING_DAMAGE
      InnateStealth               = No ;Requires upgrade first
      OrderIdleEnemiesToAttackMeUponReveal  = Yes
    End

    Behavior = StealthUpgrade ModuleTag_32
      TriggeredBy = Upgrade_GLACamoNetting
    End
    
    Behavior        = ModelConditionUpgrade ModuleTag_CamonetVisual
      ConditionFlag = USER_1
      TriggeredBy   = Upgrade_GLACamoNetting
    End
  End

End
;------------------------------------------------------------------------------
