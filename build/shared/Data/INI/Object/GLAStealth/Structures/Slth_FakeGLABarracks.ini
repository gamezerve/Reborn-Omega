;------------------------------------------------------------------------------
;Fake GLA Barracks
ObjectInherit Slth_FakeGLABarracks Slth_GLABarracks

  ; *** ART Parameters ***
  ; Reborn: Inherit all real Barracks artwork, including fortified, construction and camo states.

  ; ***DESIGN parameters ***
  Prerequisites
    Object = Slth_GLACommandCenter
  End
  BuildCost = 125
  BuildTime = 5.0
  CommandSet = FakeGLABarracksCommandSet

  ; Reborn: Retain manual detonation and replace upgraded armor with the original fake armor.
  WeaponSet
    Conditions          = None 
    Weapon = PRIMARY SuicideWeapon
    AutoChooseSources = PRIMARY None
  End

  ArmorSet
    Conditions      = None
    Armor           = StructureArmor
    DamageFX        = StructureDamageFXNoShake
  End
  ExperienceValue = 25 25 25 25

  ; *** ENGINEERING Parameters ***
  ; Reborn: Keep fake classification without healing, infantry production or rally-point capabilities.
  KindOf = PRELOAD STRUCTURE SELECTABLE IMMOBILE CAPTURABLE MP_COUNT_FOR_VICTORY SCORE_CREATE CAN_ATTACK FS_FAKE
  RebornFakeBaseObject = Slth_GLABarracks

  ; Reborn: Preserve fake health and subdual limits.
  OverrideModule ModuleTag_04
    MaxHealth = 125.0
    InitialHealth = 125.0
    SubdualDamageCap = 325
  End

  ; Reborn: Exclude real gameplay modules and free conflicting tags for the original fake modules.
  RemoveModule ModuleTag_Armor01
  RemoveModule ModuleTag_05
  RemoveModule ModuleTag_06
  RemoveModule ModuleTag_07
  RemoveModule ModuleTag_11
  RemoveModule ModuleTag_13
  RemoveModule ModuleTag_16
  RemoveModule ModuleTag_18

  ; Reborn: Preserve fake AI, death effects, manual detonation and conversion to the matching real Barracks.
  AddModule
    Behavior = AIUpdateInterface ModuleTag_06
      AutoAcquireEnemiesWhenIdle = No
    End

    Behavior = FlammableUpdate ModuleTag_11
      AflameDuration = 5000         ; If I catch fire, I'll burn for this long...
      AflameDamageAmount = 5       ; taking this much damage...
      AflameDamageDelay = 500       ; this often.
    End

    Behavior = TransitionDamageFX ModuleTag_12
      ;-------------DESIGNED FOR SMALL MEDIUM FACTION BUILDING TRANSITIONS-------------------
      DamagedParticleSystem1       = Bone:None RandomBone:No PSys:StructureTransitionSmallSmoke
      ;---------------------------------------------------------------------------------------
      ReallyDamagedParticleSystem1 = Bone:None RandomBone:No PSys:StructureTransitionSmallSmoke
      ReallyDamagedParticleSystem2 = Bone:None RandomBone:No PSys:StructureTransitionSmallExplosion
      ReallyDamagedParticleSystem3 = Bone:None RandomBone:No PSys:StructureTransitionSmallShockwave
    End

    Behavior = SlowDeathBehavior ModuleTag_13
      ExemptStatus = UNDER_CONSTRUCTION
      DestructionDelay = 0
      Weapon = FINAL FakeStructureDetonationWeapon
    End

    Behavior = DestroyDie ModuleTag_SlowDeathException
      RequiredStatus = UNDER_CONSTRUCTION
    End

    Behavior = ReplaceObjectUpgrade ModuleTag_14
      ReplaceObject = Slth_GLABarracks
      TriggeredBy = Upgrade_BecomeRealGLABarracks
    End

    Behavior = StealthUpgrade ModuleTag_15
      TriggeredBy = Upgrade_GLACamoNetting
    END
  End

  ; Reborn: Preserve the owner-visible fake-building indicator.
  ShadowTexture = fake_supply
  ShadowSizeX = 120
  ShadowSizeY = 110

End
;------------------------------------------------------------------------------
