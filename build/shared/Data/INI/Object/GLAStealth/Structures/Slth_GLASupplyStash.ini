;//////////////////////////////////////////////////////////////////////////////
;FILE: Slth_GLASupplyStash.ini ////////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
ObjectInherit Slth_GLASupplyStash GLASupplyStash

  UpgradeCameo2 = Upgrade_GLACamoNetting ; Reborn: Retain the Stealth-only camo upgrade cameo.

  ; *** ART Parameters ***
  ; Reborn: Inherit shared building and camo draw modules, retaining the faction portrait.
  SelectPortrait = Slth_SUSupplyCenter
  ButtonImage = Slth_SUSupplyCenter

  ; *** DESIGN Parameters ***
  Side = GLAStealthGeneral

  CommandSet = Slth_GLASupplyStashCommandSet

  ; *** ENGINEERING Parameters ***
  ; Reborn: Retain temporary stealth for newly produced workers.
  OverrideModule ModuleTag_11
    GrantTemporaryStealth = 20000
  End

  ; Reborn: Replace, rather than append, the inherited worker; retain independent worker behavior.
  OverrideModule ModuleTag_12
    SpawnTemplateNameOverride = Slth_GLAInfantryWorker
  End

  ; Reborn: Retain temporary stealth after supply delivery.
  OverrideModule ModuleTag_13
    GrantTemporaryStealth = 20000
  End

  ; Reborn: Only the Stealth variant grants building camouflage and activates the shared netting.
  AddModule
    Behavior = StealthUpdate ModuleStealth_09
      StealthDelay                = 2500 ; msec
      StealthForbiddenConditions  = ATTACKING USING_ABILITY TAKING_DAMAGE
      InnateStealth               = No ;Requires upgrade first
      OrderIdleEnemiesToAttackMeUponReveal  = Yes
    End
    Behavior = StealthUpgrade ModuleTag_17
      TriggeredBy = Upgrade_GLACamoNetting
    End
    
    Behavior        = ModelConditionUpgrade ModuleTag_CamonetVisual
      ConditionFlag = USER_1
      TriggeredBy   = Upgrade_GLACamoNetting
    End
  End

End
