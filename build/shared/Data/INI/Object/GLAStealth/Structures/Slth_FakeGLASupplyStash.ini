;//////////////////////////////////////////////////////////////////////////////
;FILE: Slth_FakeGLASupplyStash.ini ////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
ObjectInherit Slth_FakeGLASupplyStash Slth_GLASupplyStash

  ; *** ART Parameters ***
  ; Reborn: Inherit all real Supply Stash draw modules and the visual camo-net upgrade; retain existing stealth behavior.

  ; ***DESIGN parameters ***
  Prerequisites
    Object = Slth_GLACommandCenter
  End
  BuildCost = 375
  RefundValue = 0 ; Reborn: Retain the fake building's default half-cost refund, not the real building's 650.
  BuildTime = 5.0
  CommandSet = FakeGLASupplyStashCommandSet

  ; Reborn: Preserve the manually triggered fake-building detonation weapon.
  WeaponSet
    Conditions = None
    Weapon = PRIMARY SuicideWeapon
    AutoChooseSources = PRIMARY None
  End

  ; Reborn: Replace inherited armor sets; Fortified Structure remains a visual-only upgrade for the fake.
  ArmorSet
    Conditions = None
    Armor = StructureArmor
    DamageFX = StructureDamageFXNoShake
  End
  ExperienceValue = 50 50 50 50

  ; *** AUDIO Parameters ***
  ; Reborn: Keep the original faction fake selection voice by inheriting SupplyCenterGLASelect.

  ; *** ENGINEERING Parameters ***
  ; Reborn: Preserve fake-building classification without supply-center or rally-point capabilities.
  KindOf = PRELOAD STRUCTURE SELECTABLE IMMOBILE CAPTURABLE MP_COUNT_FOR_VICTORY SCORE_CREATE CAN_ATTACK FS_FAKE
  RebornFakeBaseObject = Slth_GLASupplyStash ; Reborn: Continue displaying the real building's health to enemies.

  ; Reborn: Retain the fake building's health and subdual limits.
  OverrideModule ModuleTag_04
    MaxHealth = 250.0
    InitialHealth = 250.0
    SubdualDamageCap = 450
  End

  ; Reborn: Do not inherit upgraded armor, supply functionality, workers or rebuilding holes.
  RemoveModule ModuleTag_Armor01
  RemoveModule ModuleTag_05
  RemoveModule ModuleTag_06
  RemoveModule ModuleTag_07
  RemoveModule ModuleTag_11
  RemoveModule ModuleTag_12
  RemoveModule ModuleTag_13

  ; Reborn: Retain fake-building AI, death handling and conversion to the real Supply Stash.
  AddModule
    Behavior = AIUpdateInterface ModuleTag_11
      AutoAcquireEnemiesWhenIdle = No
    End

    Behavior = SlowDeathBehavior ModuleTag_12
      ExemptStatus = UNDER_CONSTRUCTION
      DestructionDelay = 0
      Weapon = FINAL FakeStructureDetonationWeapon
    End
    Behavior = DestroyDie ModuleTag_SlowDeathException
      RequiredStatus = UNDER_CONSTRUCTION
    End

    Behavior = ReplaceObjectUpgrade ModuleTag_13
      ReplaceObject = Slth_GLASupplyStash
      TriggeredBy = Upgrade_BecomeRealGLASupplyStash
    End
  End

  ; Reborn: Preserve the owner's fake-building indicator.
  ShadowTexture = fake_supply
  ShadowSizeX = 105
  ShadowSizeY = 105

End
;------------------------------------------------------------------------------
