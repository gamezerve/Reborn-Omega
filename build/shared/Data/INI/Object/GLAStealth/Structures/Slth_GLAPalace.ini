;//////////////////////////////////////////////////////////////////////////////
;FILE: Slth_GLAPalace.ini /////////////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Inherit shared Palace artwork and behavior while retaining faction-specific settings.
ObjectInherit Slth_GLAPalace GLAPalace

  UpgradeCameo2 = Upgrade_GLACamoNetting

  ; *** ART Parameters ***
  SelectPortrait = Slth_SUPalace
  ButtonImage = Slth_SUPalace

  ; *** DESIGN Parameters ***
  Side = GLAStealthGeneral

  ReplaceModule Prerequisites
    Object = Slth_GLAArmsDealer
  End

  CommandSet = Slth_GLAPalaceCommandSet

  ; Reborn: Only Stealth Palace receives camo capability and the USER_2 trigger for the shared camo-net draw.
  AddModule
    Behavior = StealthUpdate ModuleStealth_09
      StealthDelay                = 2500 ; msec
      ;StealthForbiddenConditions  = ATTACKING USING_ABILITY TAKING_DAMAGE
      StealthForbiddenConditions  = ATTACKING USING_ABILITY TAKING_DAMAGE RIDERS_ATTACKING ; Reborn: Reveal the Palace when its occupants attack, allowing enemies to target it directly
      InnateStealth               = No ;Requires upgrade first
      OrderIdleEnemiesToAttackMeUponReveal  = Yes
    End

    Behavior = StealthUpgrade ModuleUpgrade_13
      TriggeredBy = Upgrade_GLACamoNetting
    End

    Behavior        = ModelConditionUpgrade ModuleTag_CamonetVisual
      ConditionFlag = USER_2
      TriggeredBy   = Upgrade_GLACamoNetting
    End
  End

End
;------------------------------------------------------------------------------
