;------------------------------------------------------------------------------
; Reborn: Inherit shared Stinger Soldier data while retaining innate Stealth camouflage.
ObjectInherit Slth_GLAInfantryStingerSoldier GLAInfantryStingerSoldier

  ; ***DESIGN parameters ***
  Side = GLAStealthGeneral
  ReplaceModule Prerequisites
    Object = Slth_GLABarracks
  End

  ; *** ENGINEERING Parameters ***
  ; Reborn: Preserve innate camouflage and revealing on damage without changing the other stealth settings.
  OverrideModule ModuleTag_09
    StealthForbiddenConditions = ATTACKING USING_ABILITY TAKING_DAMAGE
    InnateStealth = Yes
  End

  ; Reborn: Replace the upgrade requirement with the original automatic camouflage grant.
  RemoveModule ModuleTag_10
  AddModule
    Behavior = GrantUpgradeCreate ModuleUpgrade_18
      UpgradeToGrant = Upgrade_GLACamoNetting
    End
  End

End
;------------------------------------------------------------------------------
