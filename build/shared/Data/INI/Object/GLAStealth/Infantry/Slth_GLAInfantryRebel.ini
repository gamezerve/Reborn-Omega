;//////////////////////////////////////////////////////////////////////////////
;FILE: Slth_GLAInfantryRebel.ini //////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Share base Rebel behavior and animation fixes while preserving faction-specific abilities.
ObjectInherit Slth_GLAInfantryRebel GLAInfantryRebel

  SelectPortrait = Slth_SURebel
  ButtonImage = Slth_SURebel

  DisplayName = OBJECT:StealthRebel
  Side = GLAStealthGeneral

  ReplaceModule Prerequisites
    Object = Slth_GLABarracks
  End

  BuildCost = 200

  CommandSet = Slth_GLAInfantryRebelCommandSet

  ReplaceModule ModuleTag_07
    Behavior = StealthUpdate Slth_ModuleTag_07
      StealthDelay = 2500
      StealthForbiddenConditions = ATTACKING USING_ABILITY TAKING_DAMAGE
      MoveThresholdSpeed = 3
      InnateStealth = Yes
      OrderIdleEnemiesToAttackMeUponReveal = Yes
    End
  End

  ; Reborn: Different module types require removing the inherited StealthUpgrade before adding GrantUpgradeCreate.
  RemoveModule ModuleTag_10

  AddModule
    Behavior = GrantUpgradeCreate Slth_ModuleTag_10
      UpgradeToGrant = Upgrade_GLACamouflage
    End
  End

  AddModule
    Behavior = CommandSetUpgrade ModuleTag_23
      TriggeredBy = Upgrade_GLAInfantryRebelBoobyTrapAttack
      CommandSet = GLAInfantryRebelCommandSet
    End
  End

End
;------------------------------------------------------------------------------
