;//////////////////////////////////////////////////////////////////////////////
;FILE: Slth_GLAInfantryWorker.ini
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Inherit base Worker stats and shared behaviors while preserving faction artwork and abilities.
ObjectInherit Slth_GLAInfantryWorker GLAInfantryWorker

  SelectPortrait         = GLAWorkerStealth
  ButtonImage            = GLAWorkerStealth

  ReplaceModule ModuleTag_01
    Draw = W3DModelDraw Slth_ModuleTag_01
      OkToChangeModelColor = Yes

      DefaultConditionState
        Model         = UIWkrSlth_SKN
        IdleAnimation = UIWRKR_SKL.UIWRKR_STA 0 9
        IdleAnimation = UIWRKR_SKL.UIWRKR_IDA
        AnimationMode = ONCE
        TransitionKey = TRANS_Stand
        HideSubObject = OMGL33TSHOES
        WaitForStateToFinishIfPossible = DroppingCrate
      End

      ; Reborn: Stealth-specific idle state.
      ; Required because STEALTHED is now used as a custom model condition in the engine
      ConditionState = STEALTHED
        Model = UIWkrSlth_SKN
        IdleAnimation = UIWRKR_SKL.UIWRKR_STA 0 9
        IdleAnimation = UIWRKR_SKL.UIWRKR_IDA
        AnimationMode = ONCE
        TransitionKey = TRANS_Stand
        HideSubObject = OMGL33TSHOES
        WaitForStateToFinishIfPossible = DroppingCrate
        ; Reborn: Replace the first texture with a new one.
        ReplaceTexture = ciumciv01.tga ciumciv01s.dds
      End

      ConditionState  = MOVING
        Animation     = UIWRKR_SKL.UIWRKR_RNA 16
        AnimationMode = LOOP
        Flags         = RANDOMSTART
        TransitionKey = TRANS_Moving
        ParticleSysBone = None InfantryDustTrails
      End
      ; it is legal to be ACTIVELY_CONSTRUCTING and MOVING at the same time,
      ; since we flip the bit once we get pretty close to the target. but it looks
      ; funky to do the construction animation while moving.
      ; so just use the normal move animation in that case.
      AliasConditionState = ACTIVELY_CONSTRUCTING MOVING
      ; Reborn: Use walking while docking overlaps movement; preserve this state's faction appearance.
      AliasConditionState = MOVING DOCKING

      ; Reborn: Stealth-specific moving state.
      ; Required because MOVING + STEALTHED will not match the normal MOVING state anymore.
      ConditionState = MOVING STEALTHED
        Animation = UIWRKR_SKL.UIWRKR_RNA 16
        AnimationMode = LOOP
        Flags = RANDOMSTART
        TransitionKey = TRANS_Moving
        ParticleSysBone = None InfantryDustTrails
        ; Reborn: Replace the first texture with a new one.
        ReplaceTexture = ciumciv01.tga ciumciv01s.dds
      End
      AliasConditionState = ACTIVELY_CONSTRUCTING MOVING STEALTHED
      ; Reborn: Use walking while docking overlaps movement; preserve this state's faction appearance.
      AliasConditionState = MOVING DOCKING STEALTHED

      ConditionState = ATTACKING
        ShowSubObject = MINED_SKIN
        Animation = UIWRKR_SKL.UIWRKR_MS
        AnimationMode = LOOP
        Flags = RANDOMSTART
        TransitionKey = TRANS_MetalDetector_Standing
      End

      ConditionState = MOVING ATTACKING
        Animation = UIWRKR_SKL.UIWRKR_MSW 50
        AnimationMode = LOOP
        Flags = RANDOMSTART
        TransitionKey = TRANS_MetalDetector_Moving
        ParticleSysBone = None InfantryDustTrails
      End
      AliasConditionState = MOVING ATTACKING CARRYING

      ; Reborn: Stealth-specific moving + attacking state.
      ; Required because MOVING + ATTACKING + STEALTHED will not match the normal MOVING + ATTACKING state anymore.
      ConditionState = MOVING ATTACKING STEALTHED
        Animation = UIWRKR_SKL.UIWRKR_MSW 50
        AnimationMode = LOOP
        Flags = RANDOMSTART
        TransitionKey = TRANS_MetalDetector_Moving
        ParticleSysBone = None InfantryDustTrails
        ; Reborn: Replace the first texture with a new one.
        ReplaceTexture = ciumciv01.tga ciumciv01s.dds
      End
      AliasConditionState = MOVING ATTACKING CARRYING STEALTHED

      TransitionState = TRANS_Stand TRANS_MetalDetector_Standing    ;STANDING -> ATTACKING
        Animation     = UIWRKR_SKL.UIWRKR_TRB1;take out standing
        AnimationMode = ONCE
      End
      TransitionState = TRANS_MetalDetector_Standing TRANS_Stand    ;ATTACKING -> STANDING
        Animation     = UIWRKR_SKL.UIWRKR_TRB2;put away standing
        AnimationMode = ONCE
      End

      TransitionState = TRANS_Carry TRANS_MetalDetector_Standing    ;CARRYING -> ATTACKING
        Animation     = UIWRKR_SKL.UIWRKR_TRB1;take out standing
        AnimationMode = ONCE
      End
      TransitionState = TRANS_MetalDetector_Standing TRANS_Carry    ;ATTACKING -> CARRYING
        ShowSubObject = MINED_SKIN
        Animation     = UIWRKR_SKL.UIWRKR_TRB2;put away standing
        AnimationMode = ONCE
      End
      TransitionState = TRANS_Carry TRANS_MetalDetector_Moving      ;CARRYING -> MOVING ATTACKING
        Animation     = UIWRKR_SKL.UIWRKR_TRC1;take out moving [NEW NON-SKATING ANIMATION]
        AnimationMode = ONCE
        AnimationSpeedFactorRange = 2.0 2.0
      End

      TransitionState = TRANS_MetalDetector_Moving TRANS_Stand      ;MOVING ATTACKING -> STANDING
        Animation     = UIWRKR_SKL.UIWRKR_TRB2;put away moving
        AnimationMode = ONCE
      End
      TransitionState = TRANS_Stand TRANS_MetalDetector_Moving      ;STANDING -> MOVING ATTACKING
        Animation     = UIWRKR_SKL.UIWRKR_TRC1;take out moving [NEW NON-SKATING ANIMATION]
        AnimationMode = ONCE
        AnimationSpeedFactorRange = 2.0 2.0
      End

      TransitionState = TRANS_Moving TRANS_MetalDetector_Standing   ;MOVING -> ATTACKING [STANDING]
        Animation     = UIWRKR_SKL.UIWRKR_TRB1;take out standing
        AnimationMode = ONCE
      End
      TransitionState = TRANS_MetalDetector_Standing TRANS_Moving   ;ATTACKING [STANDING] -> MOVING
        Animation     = UIWRKR_SKL.UIWRKR_TRC2;put away moving [NEW NON-SKATING ANIMATION]
        AnimationMode = ONCE
        AnimationSpeedFactorRange = 2.0 2.0
      End

      TransitionState = TRANS_Moving TRANS_MetalDetector_Moving     ;MOVING -> MOVING ATTACKING
        Animation     = UIWRKR_SKL.UIWRKR_TRC1;take out moving [NEW NON-SKATING ANIMATION]
        AnimationMode = ONCE
        AnimationSpeedFactorRange = 2.0 2.0
      End
      TransitionState = TRANS_MetalDetector_Moving TRANS_Moving     ;MOVING ATTACKING -> MOVING
        Animation     = UIWRKR_SKL.UIWRKR_TRC2;put away moving [NEW NON-SKATING ANIMATION]
        AnimationMode = ONCE
        AnimationSpeedFactorRange = 2.0 2.0
      End


      ConditionState = MOVING CARRYING
        ShowSubObject = BOX
        Animation = UIWRKR_SKL.UIWRKR_CARY 12
        AnimationMode = LOOP
        Flags = RANDOMSTART
        TransitionKey = TRANS_Carry
        ParticleSysBone = None InfantryDustTrails
      End
      ; it is legal to be ACTIVELY_CONSTRUCTING and MOVING at the same time,
      ; since we flip the bit once we get pretty close to the target. but it looks
      ; funky to do the construction animation while moving.
      ; so just use the normal move animation in that case.
      AliasConditionState = ACTIVELY_CONSTRUCTING MOVING CARRYING
      ; Reborn: Use walking while docking overlaps movement; preserve this state's faction appearance.
      AliasConditionState = MOVING DOCKING CARRYING

      ; Reborn: Stealth-specific moving + carrying state.
      ; Required because MOVING + CARRYING + STEALTHED will not match the normal MOVING + CARRYING state anymore.
      ConditionState = MOVING CARRYING STEALTHED
        ShowSubObject = BOX
        Animation = UIWRKR_SKL.UIWRKR_CARY 12
        AnimationMode = LOOP
        Flags = RANDOMSTART
        TransitionKey = TRANS_Carry
        ParticleSysBone = None InfantryDustTrails
        ; Reborn: Replace the first texture with a new one.
        ReplaceTexture = ciumciv01.tga ciumciv01s.dds
      End
      AliasConditionState = ACTIVELY_CONSTRUCTING MOVING CARRYING STEALTHED
      ; Reborn: Use walking while docking overlaps movement; preserve this state's faction appearance.
      AliasConditionState = MOVING DOCKING CARRYING STEALTHED

      ConditionState = CARRYING
        Animation = UIWRKR_SKL.UIWRKR_CARST 30
        AnimationMode = LOOP
        Flags = RANDOMSTART
        TransitionKey = TRANS_Carry
      End

      ; Reborn: Stealth-specific carrying state.
      ; Required because CARRYING + STEALTHED will not match the normal CARRYING state anymore.
      ConditionState = CARRYING STEALTHED
        Animation = UIWRKR_SKL.UIWRKR_CARST 30
        AnimationMode = LOOP
        Flags = RANDOMSTART
        TransitionKey = TRANS_Carry
        ; Reborn: Replace the first texture with a new one.
        ReplaceTexture = ciumciv01.tga ciumciv01s.dds
      End

      ConditionState = DYING
        Animation = UIWRKR_SKL.UIWRKR_DTA
        AnimationMode = ONCE
        TransitionKey = TRANS_Dying
      End
      AliasConditionState = DYING CARRYING
      AliasConditionState = DYING STEALTHED
      AliasConditionState = DYING CARRYING STEALTHED

      TransitionState = TRANS_Dying TRANS_Flailing
        Animation = UIWRKR_SKL.UIWRKR_ADTE1
        AnimationMode = ONCE
      End

      ConditionState = DYING EXPLODED_FLAILING
        Animation = UIWRKR_SKL.UIWRKR_ADTE2
        AnimationMode = LOOP
        TransitionKey = TRANS_Flailing
      End
      AliasConditionState = DYING EXPLODED_FLAILING STEALTHED

      ConditionState = DYING EXPLODED_BOUNCING
        Animation = UIWRKR_SKL.UIWRKR_ADTE3
        AnimationMode = ONCE
        TransitionKey = None
      End
      AliasConditionState = DYING EXPLODED_BOUNCING STEALTHED

      ConditionState  = SPECIAL_CHEERING
        Animation     = UIWRKR_SKL.UIWRKR_CHA
        AnimationMode = ONCE
      End

      ConditionState  = ACTIVELY_CONSTRUCTING
        Animation     = UIWRKR_SKL.UIWRKR_BDA
        AnimationMode = LOOP
        TransitionKey = TRANS_Constructing
      End
      AliasConditionState = ACTIVELY_CONSTRUCTING CARRYING

      ; --------------------
      ConditionState = DOCKING
        Animation     = UIWRKR_SKL.UIWRKR_PIK
        AnimationMode = ONCE
        TransitionKey = DroppingCrate
      End

      ; Reborn: Resolve stationary docking/stealth overlap with the existing stealth texture.
      ConditionState = DOCKING STEALTHED
        Animation = UIWRKR_SKL.UIWRKR_PIK
        AnimationMode = ONCE
        TransitionKey = DroppingCrate
        ReplaceTexture = ciumciv01.tga ciumciv01s.dds
      End

      ConditionState = DOCKING CARRYING
        Animation     = UIWRKR_SKL.UIWRKR_PIK
        AnimationMode = ONCE_BACKWARDS
        AnimationSpeedFactorRange = 2.3 2.3
        Flags         = START_FRAME_LAST
        TransitionKey = DroppingCrate
      End

      ; Reborn: Stealth-specific docking + carrying state.
      ; Required because DOCKING + CARRYING + STEALTHED will not match the normal DOCKING + CARRYING state anymore.
      ConditionState = DOCKING CARRYING STEALTHED
        Animation = UIWRKR_SKL.UIWRKR_PIK
        AnimationMode = ONCE_BACKWARDS
        AnimationSpeedFactorRange = 2.3 2.3
        Flags = START_FRAME_LAST
        TransitionKey = DroppingCrate
        ; Reborn: Replace the first texture with a new one.
        ReplaceTexture = ciumciv01.tga ciumciv01s.dds
      End

      TransitionState = TRANS_Stand TRANS_Constructing
        Animation     = UIWRKR_SKL.UIWRKR_TRA1
        AnimationMode = ONCE
      End

      TransitionState = TRANS_Constructing TRANS_Stand
        Animation     = UIWRKR_SKL.UIWRKR_TRA2
        AnimationMode = ONCE
      End

    End
  End

  Side = GLAStealthGeneral

  CommandSet = Slth_GLAWorkerCommandSet

  ReplaceModule ModuleTag_14
    Behavior = CommandSetUpgrade Slth_ModuleTag_14
      TriggeredBy = Upgrade_GLAWorkerFakeCommandSet
      RemovesUpgrades = Upgrade_GLAWorkerRealCommandSet
      CommandSet = Slth_GLAWorkerFakeBuildingsCommandSet
    End
  End

  ReplaceModule ModuleTag_15
    Behavior = CommandSetUpgrade Slth_ModuleTag_15
      TriggeredBy = Upgrade_GLAWorkerRealCommandSet
      RemovesUpgrades = Upgrade_GLAWorkerFakeCommandSet Upgrade_GLAWorkerRealCommandSet
      CommandSet = Slth_GLAWorkerCommandSet
    End
  End

End
;------------------------------------------------------------------------------
