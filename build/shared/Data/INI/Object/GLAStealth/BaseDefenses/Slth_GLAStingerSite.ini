;//////////////////////////////////////////////////////////////////////////////
;FILE: Slth_GLAStingerSite.ini ////////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Share base Stinger Site art and slave settings while preserving innate Stealth camouflage.
ObjectInherit Slth_GLAStingerSite GLAStingerSite

  ; *** ART Parameters ***
  SelectPortrait = Slth_SUStinger
  ButtonImage = Slth_SUStinger

  ; ***DESIGN parameters ***
  Side = GLAStealthGeneral

  ReplaceModule Prerequisites
    Object = Slth_GLABarracks
  End

  CommandSet = Slth_GLAStingerSiteCommandSet

  ; *** ENGINEERING Parameters ***
  ; Reborn: Replace the inherited soldier list; retain replacement timing and slave behavior.
  OverrideModule ModuleTag_06
    SpawnTemplateNameOverride = Slth_GLAInfantryStingerSoldier
  End

  ; Reborn: Keep innate stealth and the original zero movement threshold; inherit other stealth settings.
  OverrideModule ModuleTag_13
    MoveThresholdSpeed = 0
    InnateStealth = Yes
  End

  ; Reborn: Grant the camouflage upgrade on creation instead of requiring a purchase.
  RemoveModule ModuleTag_14
  AddModule
    Behavior = GrantUpgradeCreate ModuleTag_18
      UpgradeToGrant = Upgrade_GLACamoNetting
    End
  End

End
;------------------------------------------------------------------------------
