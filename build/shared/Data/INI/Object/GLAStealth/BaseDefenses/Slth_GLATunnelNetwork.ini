;//////////////////////////////////////////////////////////////////////////////
;FILE: Slth_GLATunnelNetwork.ini //////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; -----------------------------------------------------------------------------
; Reborn: Inherit shared Tunnel Network data and damage-state fixes while preserving variant behavior.
ObjectInherit Slth_GLATunnelNetwork GLATunnelNetwork

  ; *** ART Parameters ***
  SelectPortrait = Slth_SUTunnel
  ButtonImage = Slth_SUTunnel

  ; ***DESIGN parameters ***
  Side = GLAStealthGeneral

  ReplaceModule Prerequisites
    Object = Slth_GLABarracks
  End

  CommandSet = Slth_GLATunnelNetworkCommandSet

  ; *** ENGINEERING Parameters ***
  ; Reborn: Replace, rather than append to, the inherited defender template list.
  OverrideModule ModuleTag_07
    SpawnTemplateNameOverride = Slth_GLAInfantryTunnelDefender
  End

  ; Reborn: Retain innate stealth and grant the original camouflage upgrade on creation.
  OverrideModule ModuleTag_17
    InnateStealth = Yes
  End
  RemoveModule ModuleTag_18
  AddModule
    Behavior = GrantUpgradeCreate ModuleTag_18
      UpgradeToGrant = Upgrade_GLACamoNetting
    End
  End

End
;------------------------------------------------------------------------------
