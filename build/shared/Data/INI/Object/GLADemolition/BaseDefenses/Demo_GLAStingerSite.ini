;//////////////////////////////////////////////////////////////////////////////
;FILE: Demo_GLAStingerSite.ini ////////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Share base Stinger Site art and slave settings while preserving Demo abilities.
ObjectInherit Demo_GLAStingerSite GLAStingerSite

  ; *** ART Parameters ***
  SelectPortrait = Demo_SUStinger
  ButtonImage = Demo_SUStinger

  UpgradeCameo2 = Demo_Upgrade_SuicideBomb

  ; ***DESIGN parameters ***
  Side = GLADemolitionGeneral

  ReplaceModule Prerequisites
    Object = Demo_GLABarracks
  End

  WeaponSet
    Weapon = TERTIARY TerroristSuicideNotARealWeapon
    AutoChooseSources = TERTIARY NONE
  End

  CommandSet = Demo_GLAStingerSiteCommandSet

  ; *** ENGINEERING Parameters ***
  ; Reborn: Replace the inherited soldier list; retain replacement timing and slave behavior.
  OverrideModule ModuleTag_06
    SpawnTemplateNameOverride = Demo_GLAInfantryStingerSoldier
  End

  ; Reborn: Preserve this variant's lack of camouflage while sharing the main building draw modules.
  RemoveModule ModuleTag_Camonetting
  RemoveModule ModuleTag_13
  RemoveModule ModuleTag_14
  RemoveModule ModuleTag_15
  RemoveModule ModuleTag_CamonetVisual

  ; Reborn: Retain Demo suicide, death explosions, upgraded commands and their AI support.
  AddModule
    Behavior = FireWeaponWhenDeadBehavior ModuleTag_Death18
      DeathWeapon   = Demo_SuicideDynamitePack
      StartsActive  = Yes                      ; turned on by upgrade
      DeathTypes = NONE +SUICIDED
    End

    Behavior = FireWeaponWhenDeadBehavior ModuleTag999
      DeathWeapon   = Demo_SuicideDynamitePackPlusFire
      StartsActive  = No
      TriggeredBy   = Demo_Upgrade_SuicideBomb
      RequiresAllTriggers = Yes;
      DeathTypes = ALL -SUICIDED -POISONED -POISONED_BETA -POISONED_GAMMA
    End;

    Behavior = FireWeaponWhenDeadBehavior ModuleTag998
      DeathWeapon   = Demo_SuicideDynamitePack
      StartsActive  = No
      TriggeredBy   = Demo_Upgrade_SuicideBomb
      RequiresAllTriggers = Yes;
      DeathTypes = NONE +SUICIDED
    End;

    Behavior = CommandSetUpgrade ModuleTag_19
      CommandSet = Demo_GLAStingerSiteCommandSetUpgrade
      TriggeredBy = Demo_Upgrade_SuicideBomb
    End

    Behavior = AIUpdateInterface ModuleTag_20
      AutoAcquireEnemiesWhenIdle = No
    End
  End

End
;------------------------------------------------------------------------------
