;//////////////////////////////////////////////////////////////////////////////
;FILE: Demo_GLATunnelNetwork.ini //////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Inherit shared Tunnel Network data and damage-state fixes while preserving variant behavior.
ObjectInherit Demo_GLATunnelNetwork GLATunnelNetwork

  ; *** ART Parameters ***
  SelectPortrait = Demo_SUTunnel
  ButtonImage = Demo_SUTunnel

  UpgradeCameo2 = Demo_Upgrade_SuicideBomb

  ; Reborn: This variant has no camouflage netting.
  RemoveModule ModuleTag_Camonetting

  ; ***DESIGN parameters ***
  Side = GLADemolitionGeneral

  ReplaceModule Prerequisites
    Object = Demo_GLABarracks
  End

  ReplaceModule WeaponSet
    Conditions = None 
    Weapon = PRIMARY TunnelNetworkGun
    Weapon = SECONDARY None
    Weapon = TERTIARY TerroristSuicideNotARealWeapon
    AutoChooseSources = TERTIARY NONE
  End

  CommandSet = Demo_GLATunnelNetworkCommandSet

  ; *** ENGINEERING Parameters ***
  ; Reborn: Replace, rather than append to, the inherited defender template list.
  OverrideModule ModuleTag_07
    SpawnTemplateNameOverride = Demo_GLAInfantryTunnelDefender
  End

  ; Reborn: Preserve the absence of camouflage behaviors.
  RemoveModule ModuleTag_17
  RemoveModule ModuleTag_18
  RemoveModule ModuleTag_CamonetVisual

  ; Reborn: Preserve the absence of production and retain both original suicide explosions.
  RemoveModule ModuleTag_20
  AddModule
    Behavior = FireWeaponWhenDeadBehavior ModuleTag998 
      DeathWeapon   = Demo_SuicideDynamitePackPlusFire
      StartsActive  = No
      TriggeredBy   = Demo_Upgrade_SuicideBomb
      DeathTypes = NONE +SUICIDED 
    End;
  End

  AddModule
    Behavior = FireWeaponWhenDeadBehavior ModuleTag999
      DeathWeapon   = Demo_DestroyedWeapon
      StartsActive  = No
      TriggeredBy   = Demo_Upgrade_SuicideBomb
      DeathTypes = ALL -SUICIDED
    End
  End

  AddModule
    Behavior = CommandSetUpgrade ModuleTag_22
      CommandSet = Demo_GLATunnelNetworkCommandSetUpgrade
      TriggeredBy = Demo_Upgrade_SuicideBomb
    End
  End

End
;------------------------------------------------------------------------------
