;------------------------------------------------------------------------------
;The Marauder Tank, for the Warlord General.
; Reborn: Inherit common Marauder behavior and centralized Draw while preserving faction differences.
ObjectInherit Demo_GLATankMarauder GLATankMarauder

  SelectPortrait = Demo_SUMarauder
  ButtonImage = Demo_SUMarauder

  UpgradeCameo1 = Upgrade_GLAJunkRepair
  UpgradeCameo2 = Demo_Upgrade_SuicideBomb
  UpgradeCameo3 = "" ; Reborn: Keep the original unused cameo slot empty.

  DisplayName = OBJECT:TripleBarrelMarauder

  Side = GLADemolitionGeneral

  BuildCost = 900
  BuildTime = 10.0


  ReplaceModule Prerequisites ; Reborn: Replace the inherited Palace requirement while preserving the science prerequisite.
    Object = Demo_GLAPalace
    Science = SCIENCE_MarauderTank
  End

  ; Reborn: Start at actual salvage level one; only this object opts in to a third level.
  InitialWeaponSetFlags = CRATEUPGRADE_ONE
  MaxWeaponSalvageLevel = 3

  ; Reborn: Replace all inherited sets; retain a zero-tier fallback for references to the legacy base configuration.
  WeaponSet
    Conditions = None
    Weapon = PRIMARY REDMarauderTankGunUpgradeOne
    Weapon = TERTIARY TerroristSuicideNotARealWeapon
    AutoChooseSources = TERTIARY None
  End

  WeaponSet
    Conditions = CRATEUPGRADE_ONE
    Weapon = PRIMARY REDMarauderTankGunUpgradeOne
    Weapon = TERTIARY TerroristSuicideNotARealWeapon
    AutoChooseSources = TERTIARY None
  End

  WeaponSet
    Conditions = CRATEUPGRADE_TWO
    Weapon = PRIMARY REDMarauderTankGunUpgradeTwo
    Weapon = TERTIARY TerroristSuicideNotARealWeapon
    AutoChooseSources = TERTIARY None

  End

  WeaponSet
    Conditions = CRATEUPGRADE_THREE
    Weapon = PRIMARY REDMarauderTankGunUpgradeThree
    Weapon = TERTIARY TerroristSuicideNotARealWeapon
    AutoChooseSources = TERTIARY None
  End

  AddModule ; Reborn: Retain the original suicide death behavior and researched command menu.
    Behavior = SlowDeathBehavior ModuleTag_Death_22
      DeathTypes          = NONE +SUICIDED +EXPLODED
      SinkDelay           = 3000
      SinkRate            = 0.5     ; in Dist/Sec
      DestructionDelay    = 8000
      FX                  = INITIAL FX_TerroristExplode
      FlingForce          = 8
      FlingForceVariance  = 3
      FlingPitch          = 60
      FlingPitchVariance  = 10
    End
  End

  AddModule ; Reborn: Retain the original suicide death behavior and researched command menu.
    Behavior = FireWeaponWhenDeadBehavior ModuleTag998
      DeathWeapon   = Demo_SuicideDynamitePackPlusFire
      StartsActive  = No
      TriggeredBy   = Demo_Upgrade_SuicideBomb
      DeathTypes = NONE +SUICIDED
    End;
  End

  AddModule ; Reborn: Retain the original suicide death behavior and researched command menu.
    Behavior = FireWeaponWhenDeadBehavior ModuleTag999
      DeathWeapon   = Demo_DestroyedWeapon
      StartsActive  = No
      TriggeredBy   = Demo_Upgrade_SuicideBomb
      DeathTypes = ALL -SUICIDED
    End
  End

  AddModule ; Reborn: Retain the original suicide death behavior and researched command menu.
    Behavior = CommandSetUpgrade ModuleTag_24
      CommandSet = Demo_GLATankMarauderCommandSetUpgrade
      TriggeredBy = Demo_Upgrade_SuicideBomb
    End
  End

End
;------------------------------------------------------------------------------
