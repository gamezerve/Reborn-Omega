;//////////////////////////////////////////////////////////////////////////////
;FILE: Demo_GLAVehicleBattleBus.ini ///////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Inherit shared Draw, armor, passengers and normal commands; retain faction-specific behavior.
ObjectInherit Demo_GLAVehicleBattleBus GLAVehicleBattleBus

  SelectPortrait = Demo_SUbattlebus
  ButtonImage = Demo_SUbattlebus

  UpgradeCameo2 = Demo_Upgrade_SuicideBomb

  Side = GLADemolitionGeneral

  BuildCost = 1200

  ReplaceModule Prerequisites ; Reborn: Require this general's Arms Dealer and Palace.
    Object = Demo_GLAArmsDealer
    Object = Demo_GLAPalace
  End

  ; Reborn: Retain both passenger-dependent weapon sets and the tertiary suicide command.
  WeaponSet
    Conditions = None 
    Weapon = PRIMARY None 
    Weapon = SECONDARY   BattleBusDummyWeapon 
    Weapon = TERTIARY TerroristSuicideNotARealWeapon
    AutoChooseSources = TERTIARY None
  End
  WeaponSet
    Conditions          = PLAYER_UPGRADE 
    Weapon              = PRIMARY     BattleBusPassengerDummyWeapon
    Weapon              = SECONDARY   BattleBusDummyWeapon
    Weapon              = TERTIARY TerroristSuicideNotARealWeapon
    AutoChooseSources = TERTIARY None
  End

  OverrideModule ModuleTag_08 ; Reborn: Suicide bypasses the normal bunker transformation.
    DeathTypes = ALL -CRUSHED -SPLATTED -EXTRA_4 -SUICIDED
  End

  ReplaceModule ModuleTag_30 ; Reborn: Preserve the existing Demo death/damage module and its tag.
    Behavior = SlowDeathBehavior ModuleTag_34 // Empty Hulk sinking away
      DeathTypes = NONE +EXTRA_4
  
      SinkDelay = 1
      SinkRate = 2.5
      DestructionDelay = 5000
    End
  End

  ReplaceModule ModuleTag_31 ; Reborn: Preserve the existing Demo death/damage module and its tag.
    Behavior                 = TransitionDamageFX ModuleTag_36
      ReallyDamagedParticleSystem1 = Bone:Smoke RandomBone:Yes PSys:SmallLightSmokeColumn
      ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:0 FXList:FX_BattleMasterDamageTransition
    End
  End

  AddModule ; Reborn: Preserve Demo suicide weapons, researched commands and suicide hulk creation.
    Behavior = FireWeaponWhenDeadBehavior ModuleTag998 
      DeathWeapon   = Demo_SuicideDynamitePackPlusFire
      StartsActive  = No
      TriggeredBy   = Demo_Upgrade_SuicideBomb
      DeathTypes = NONE +SUICIDED 
    End;
  End

  AddModule ; Reborn: Preserve Demo suicide weapons, researched commands and suicide hulk creation.
    Behavior = FireWeaponWhenDeadBehavior ModuleTag999
      DeathWeapon   = Demo_DestroyedWeapon
      StartsActive  = No
      TriggeredBy   = Demo_Upgrade_SuicideBomb
      DeathTypes = ALL -SUICIDED
    End
  End

  AddModule ; Reborn: Preserve Demo suicide weapons, researched commands and suicide hulk creation.
    Behavior = CommandSetUpgrade ModuleTag_33
      CommandSet = Demo_GLAVehicleBattleBusCommandSetUpgrade
      TriggeredBy = Demo_Upgrade_SuicideBomb
    End
  End

  AddModule ; Reborn: Preserve Demo suicide weapons, researched commands and suicide hulk creation.
    Behavior = SlowDeathBehavior ModuleTag_35 // Sorry, because the terrorist does Suicide damage to others, we cannot tell if it is a legit suicide (us killing self)
      DeathTypes = NONE +SUICIDED
      DestructionDelay = 1
      FX = FINAL FX_BuggyNewDeathExplosion
      OCL = FINAL OCL_BattleBusDeath ; Reborn: Spawn the Battle Bus hulk when the Demolition Battle Bus is destroyed via suicide.
    End
  End

End
;------------------------------------------------------------------------------
