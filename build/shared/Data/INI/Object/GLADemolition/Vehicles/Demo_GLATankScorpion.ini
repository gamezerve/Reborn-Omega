;//////////////////////////////////////////////////////////////////////////////
;FILE: Demo_GLATankScorpion.ini ///////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Share base Scorpion behavior while retaining all faction-specific settings.
ObjectInherit Demo_GLATankScorpion GLATankScorpion

  SelectPortrait = Demo_SUScorpion
  ButtonImage = Demo_SUScorpion

  UpgradeCameo3 = Upgrade_GLAJunkRepair
  UpgradeCameo4 = Demo_Upgrade_SuicideBomb

  Side = GLADemolitionGeneral

  BuildCost = 750

  CommandSet = Demo_GLATankScorpionCommandSet

  KindOf = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS VEHICLE SALVAGER SCORE

  UpgradeCameo5 = "" ; Reborn: Keep this inherited cameo slot empty as before.

  ReplaceModule Prerequisites ; Reborn: Replace rather than append the production requirement.
    Object = Demo_GLAArmsDealer
  End

  ; Reborn: Use the inherited Draw at its second salvage stage; weapon overrides remain unchanged.
  InitialWeaponSetFlags = CRATEUPGRADE_TWO

  ; Reborn: The first WeaponSet replaces all inherited sets, retaining only Demo's two original configurations.
  WeaponSet
    Conditions = None
    Weapon = PRIMARY ScorpionTankGunPlusOne ; No further bonus at plus two
    Weapon = TERTIARY TerroristSuicideNotARealWeapon
  End
  WeaponSet
    Conditions = PLAYER_UPGRADE
    Weapon = PRIMARY ScorpionTankGunPlusOne ; No further bonus at plus two
    Weapon = SECONDARY ScorpionMissileWeaponPlusTwo
    Weapon = TERTIARY TerroristSuicideNotARealWeapon
  End

  AddModule ; Reborn: Retain the original Demo suicide behavior.
    Behavior = SlowDeathBehavior ModuleTag_Death17
      DeathTypes          = NONE +SUICIDED +EXPLODED
      SinkDelay           = 3000
      SinkRate            = 0.5     ; in Dist/Sec
      DestructionDelay    = 8000
      FX                  = INITIAL FX_TerroristExplode
      FlingForce          = 8
      FlingForceVariance  = 3
      FlingPitch          = 60
      FlingPitchVariance  = 10
    End
  End

  AddModule ; Reborn: Retain the original Demo suicide behavior.
    Behavior = FireWeaponWhenDeadBehavior ModuleTag998
      DeathWeapon   = Demo_SuicideDynamitePackPlusFire
      StartsActive  = No
      TriggeredBy   = Demo_Upgrade_SuicideBomb
      DeathTypes = NONE +SUICIDED
    End;
  End

  AddModule ; Reborn: Retain the original Demo suicide behavior.
    Behavior = FireWeaponWhenDeadBehavior ModuleTag999
      DeathWeapon   = Demo_DestroyedWeapon
      StartsActive  = No
      TriggeredBy   = Demo_Upgrade_SuicideBomb
      DeathTypes = ALL -SUICIDED
    End
  End

  AddModule ; Reborn: Retain the original Demo suicide behavior.
    Behavior = CommandSetUpgrade ModuleTag_19
      CommandSet = Demo_GLATankScorpionCommandSetUpgrade
      TriggeredBy = Demo_Upgrade_SuicideBomb
    End
  End

End
;------------------------------------------------------------------------------
