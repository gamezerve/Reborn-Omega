;//////////////////////////////////////////////////////////////////////////////
;FILE: Demo_GLAVehicleScudLauncher.ini ////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Share base SCUD behavior while retaining faction weapons, prerequisites and all CommandSet differences.
ObjectInherit Demo_GLAVehicleScudLauncher GLAVehicleScudLauncher

  SelectPortrait = Demo_SUScudLauncher
  ButtonImage = Demo_SUScudLauncher

  UpgradeCameo3 = Demo_Upgrade_SuicideBomb

  Side = GLADemolitionGeneral

  BuildCost = 1250

  CommandSet = Demo_GLAVehicleScudLauncherCommandSet

  KindOf = PRELOAD SELECTABLE CAN_ATTACK DONT_AUTO_CRUSH_INFANTRY CAN_CAST_REFLECTIONS VEHICLE SALVAGER SCORE

  ReplaceModule Prerequisites ; Reborn: Preserve both faction buildings and the faction-specific unlock science.
    Object = Demo_GLAArmsDealer
    Object = Demo_GLAPalace
    Science = SCIENCE_DemoScudLauncher
  End

  ; Reborn: Replace every inherited WeaponSet so no unwanted explosive/poison mode can leak into this variant.
  WeaponSet
    Conditions = None
    Weapon = PRIMARY DEMO_SCUDLauncherGunExplosivePlusTwo
    Weapon = TERTIARY TerroristSuicideNotARealWeapon
    AutoChooseSources = PRIMARY FROM_SCRIPT FROM_AI
    AutoChooseSources = TERTIARY None
  End

  ReplaceModule ModuleTag_03 ; Reborn: Preserve the original PRIMARY-only turret control.
    Behavior = AIUpdateInterface Demo_ModuleTag_ScudAI
      Turret
        TurretTurnRate = 60   ; turn rate, in degrees per sec
        TurretPitchRate = 60
        FirePitch = 90  ; Instead of aiming pitchwise at the target, it will aim here
        AllowsPitch = Yes
        ControlledWeaponSlots = PRIMARY
      End
      AutoAcquireEnemiesWhenIdle = No NotWhileAttacking
    End
  End

  RemoveModule ModuleTag_24 ; Reborn: Neither faction used the base two-mode weapon lock.

  ; Reborn: Use the inherited second-salvage Draw while preserving the original fully upgraded explosive weapon.
  InitialWeaponSetFlags = CRATEUPGRADE_TWO

  RemoveModule ModuleTag_23 ; Reborn: Demo has no poison WeaponSet upgrade.

  AddModule ; Reborn: Keep the original Demo suicide behavior and researched CommandSet unchanged.
    Behavior = FireWeaponWhenDeadBehavior ModuleTag_George
      DeathWeapon   = Demo_SuicideDynamitePackPlusFire
      StartsActive  = No
      TriggeredBy   = Demo_Upgrade_SuicideBomb
    End;
  End

  AddModule ; Reborn: Keep the original Demo suicide behavior and researched CommandSet unchanged.
    Behavior = CommandSetUpgrade ModuleTag_26
      CommandSet = Demo_GLAVehicleScudLauncherCommandSetUpgrade
      TriggeredBy = Demo_Upgrade_SuicideBomb
    End
  End

End
;------------------------------------------------------------------------------
