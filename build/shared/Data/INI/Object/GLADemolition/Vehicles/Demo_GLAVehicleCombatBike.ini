;------------------------------------------------------------------------------

;GLA Combat Bike
ObjectInherit Demo_GLAVehicleCombatBike GLAVehicleCombatBike

  ; *** ART Parameters ***
  SelectPortrait         = Demo_SUComBike
  ButtonImage            = Demo_SUComBike
  
  UpgradeCameo2 = Demo_Upgrade_SuicideBomb
  ;UpgradeCameo3 = NONE
  ;UpgradeCameo4 = NONE
  ;UpgradeCameo5 = NONE
  
  ; ***DESIGN parameters ***
  Side                = GLADemolitionGeneral

  ReplaceModule WeaponSet
    Conditions = WEAPON_RIDER3
    Weapon = PRIMARY DEMO_TunnelDefenderBikerRocketWeapon
  End

  BuildCost       = 550
  BuildTime       = 6.0          ;in seconds

  ReplaceModule Prerequisites
    Object = Demo_GLAArmsDealer
  End

  CommandSet            = Demo_GLAVehicleCombatBikeDefaultCommandSet

  ReplaceModule DeathTag_04
      Behavior = SlowDeathBehavior Demo_DeathTag_04
        ExemptStatus = STATUS_RIDER1 STATUS_RIDER2 STATUS_RIDER3 STATUS_RIDER4 STATUS_RIDER5 STATUS_RIDER6 STATUS_RIDER7
        DeathTypes = ALL -CRUSHED -SPLATTED -TOPPLED
        DestructionDelay = 0
        FX = INITIAL FX_DEMOBuggyNewDeathExplosion
        OCL = FINAL OCL_CombatBikeAirDeathStart
      End
  End

  ReplaceModule DeathTag_06
      Behavior = SlowDeathBehavior Demo_DeathTag_06
        RequiredStatus = STATUS_RIDER2
        DeathTypes = ALL -CRUSHED -SPLATTED -TOPPLED
        DestructionDelay = 0
        FX = INITIAL FX_DEMOBuggyNewDeathExplosion
        OCL = INITIAL OCL_RebelFlyingOffBikeDeathStart
        OCL = FINAL OCL_CombatBikeAirDeathStart
      End
  End
  
  ReplaceModule DeathTag_07
      Behavior = SlowDeathBehavior Demo_DeathTag_07
        RequiredStatus = STATUS_RIDER3
        DeathTypes = ALL -CRUSHED -SPLATTED -TOPPLED
        DestructionDelay = 0
        FX = INITIAL FX_DEMOBuggyNewDeathExplosion
        OCL = INITIAL OCL_TunnelDefenderFlyingOffBikeDeathStart
        OCL = FINAL OCL_CombatBikeAirDeathStart
      End
  End

  ReplaceModule DeathTag_08
      Behavior = SlowDeathBehavior Demo_DeathTag_08
        RequiredStatus = STATUS_RIDER4
        DeathTypes = ALL -CRUSHED -SPLATTED -TOPPLED
        DestructionDelay = 0
        FX = INITIAL FX_DEMOBuggyNewDeathExplosion
        OCL = INITIAL OCL_JarmenKellFlyingOffBikeDeathStart
        OCL = FINAL OCL_CombatBikeAirDeathStart
      End
  End

  ReplaceModule DeathTag_09
      Behavior = SlowDeathBehavior Demo_DeathTag_09
        RequiredStatus = STATUS_RIDER5
        DeathTypes = ALL -CRUSHED -SPLATTED -TOPPLED
        DestructionDelay = 0
        FX = INITIAL FX_DEMOBuggyNewDeathExplosion
        OCL = INITIAL OCL_TerroristFlyingOffBikeDeathStart
        OCL = FINAL OCL_CombatBikeAirDeathStart
      End
  End
  
  ReplaceModule DeathTag_10
      Behavior = SlowDeathBehavior Demo_DeathTag_10
        RequiredStatus = STATUS_RIDER6
        DeathTypes = ALL -CRUSHED -SPLATTED -TOPPLED
        DestructionDelay = 0
        FX = INITIAL FX_DEMOBuggyNewDeathExplosion
        OCL = INITIAL OCL_HijackerFlyingOffBikeDeathStart
        OCL = FINAL OCL_CombatBikeAirDeathStart
      End
  End
  
  ReplaceModule ModuleTag_16
      Behavior = RiderChangeContain Demo_ModuleTag_16
        ;A list of each valid rider that is allowed to ride this object. Each rider is
        ;assigned a modelcondition state, a weaponset flag, an object status bit, and
        ;a commandset override. The actual object is hidden inside the container so the 
        ;visible rider is fluff. Also riders are deleted (not killed) when the bike is
        ;destroyed, so all deaths must be OCLs on the bike.
        Rider1 = Demo_GLAInfantryWorker         RIDER1 WEAPON_RIDER1 STATUS_RIDER1 Demo_GLAVehicleCombatBikeDefaultCommandSet SET_NORMAL
        Rider2 = Demo_GLAInfantryRebel          RIDER2 WEAPON_RIDER2 STATUS_RIDER2 Demo_GLAVehicleCombatBikeDefaultCommandSet SET_NORMAL
        Rider3 = Demo_GLAInfantryTunnelDefender RIDER3 WEAPON_RIDER3 STATUS_RIDER3 Demo_GLAVehicleCombatBikeDefaultCommandSet SET_NORMAL
        Rider4 = Demo_GLAInfantryJarmenKell     RIDER4 WEAPON_RIDER4 STATUS_RIDER4 GLAVehicleCombatBikeJarmenKellCommandSet SET_NORMAL
        Rider5 = Demo_GLAInfantryTerrorist      RIDER5 WEAPON_RIDER5 STATUS_RIDER5 Demo_GLAVehicleCombatBikeDefaultCommandSet SET_SLUGGISH
        Rider6 = Demo_GLAInfantryHijacker       RIDER6 WEAPON_RIDER6 STATUS_RIDER6 Demo_GLAVehicleCombatBikeDefaultCommandSet SET_NORMAL
        Rider7 = Demo_GLAInfantrySaboteur       RIDER7 WEAPON_RIDER7 STATUS_RIDER7 Demo_GLAVehicleCombatBikeDefaultCommandSet SET_NORMAL
        ScuttleDelay          = 1500
        ScuttleStatus         = TOPPLED

        ;Standard TransportContain stuff
        Slots                 = 1
        InitialPayload        = Demo_GLAInfantryTerrorist 1
        ScatterNearbyOnExit   = No
        HealthRegen%PerSec    = 0
        DamagePercentToUnits  = 100%  ; This module will Delete the rider on death, but we need to kill him as well so he doesn't pick up the bike's salvage crate.
        BurnedDeathToUnits    = No    ; And no Burned death.
        AllowInsideKindOf     = INFANTRY
        ExitDelay         = 250
        NumberOfExitPaths = 1 ; Defaults to 1.  Set 0 to not use ExitStart/ExitEnd, set higher than 1 to use ExitStart01-nn/ExitEnd01-nn
        GoAggressiveOnExit = Yes ; AI Will tell people to set their mood to Aggressive on exiting
      End
  End

;Kris: The slowdeath's above handle this case. This was causing a 50% chance 
;      of the bike lingering after the terrorist bike suicided.
;  Behavior = SlowDeathBehavior ModuleTag_Death_22
;    DeathTypes          = NONE +SUICIDED +EXPLODED
;    SinkDelay           = 3000
;    SinkRate            = 0.5     ; in Dist/Sec
;    DestructionDelay    = 8000
;    FX                  = INITIAL FX_TerroristExplode
;    FlingForce          = 8
;    FlingForceVariance  = 3
;    FlingPitch          = 60
;    FlingPitchVariance  = 10
;  End

  ReplaceModule ModuleTag_Death18
      ;Terrorist without suicide bomb upgrade
      Behavior = FireWeaponWhenDeadBehavior Demo_ModuleTag_Death18
        RequiredStatus  = STATUS_RIDER5
        DeathWeapon     = SuicideBikeBomb
        StartsActive    = Yes
        DeathTypes      = NONE +SUICIDED +CRUSHED +SPLATTED +LASERED +BURNED +EXPLODED
        ConflictsWith = Demo_Upgrade_SuicideBomb
      End
  End

  AddModule
      ;Non-terrorist with suicide bomb upgrade (fire)
      Behavior = FireWeaponWhenDeadBehavior ModuleTag999
        ExemptStatus  = STATUS_RIDER5
        DeathWeapon   = Demo_SuicideDynamitePackPlusFire
        StartsActive  = No
        TriggeredBy   = Demo_Upgrade_SuicideBomb
        RequiresAllTriggers = Yes; 
        DeathTypes = ALL -SUICIDED -POISONED -POISONED_BETA -POISONED_GAMMA
      End;

      ;Non-terrorist with suicide bomb upgrade (no fire)
      Behavior = FireWeaponWhenDeadBehavior ModuleTag998
        ExemptStatus  = STATUS_RIDER5
        DeathWeapon   = Demo_SuicideDynamitePack
        StartsActive  = No
        TriggeredBy   = Demo_Upgrade_SuicideBomb
        RequiresAllTriggers = Yes; 
        DeathTypes = NONE +SUICIDED
      End;

      ;Terrorist with suicide bomb upgrade (fire)
      Behavior = FireWeaponWhenDeadBehavior ModuleTag997
        RequiredStatus = STATUS_RIDER5
        DeathWeapon    = Demo_TerroristOnCombatBikeSuicideDynamitePackPlusFire
        StartsActive   = No
        TriggeredBy    = Demo_Upgrade_SuicideBomb
        RequiresAllTriggers = Yes; 
        DeathTypes     = ALL -SUICIDED -POISONED -POISONED_BETA -POISONED_GAMMA
      End;

      ;Terrorist with suicide bomb upgrade (no fire)
      Behavior = FireWeaponWhenDeadBehavior ModuleTag996
        RequiredStatus = STATUS_RIDER5
        DeathWeapon    = Demo_TerroristOnCombatBikeSuicideDynamitePack
        StartsActive   = No
        TriggeredBy    = Demo_Upgrade_SuicideBomb
        RequiresAllTriggers = Yes; 
        DeathTypes     = NONE +SUICIDED +POISONED +POISONED_BETA
      End;
  End

End
;------------------------------------------------------------------------------
