;------------------------------------------------------------------------------
; Reborn: Inherit shared Quad Cannon behavior while retaining this faction's distinct settings.
ObjectInherit Demo_GLAVehicleQuadCannon GLAVehicleQuadCannon

  SelectPortrait = Demo_SUQuadCannon
  ButtonImage = Demo_SUQuadCannon

  UpgradeCameo3 = Demo_Upgrade_SuicideBomb

  Side = GLADemolitionGeneral

  BuildCost = 750

  KindOf = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS SALVAGER VEHICLE SCORE

  ReplaceModule Prerequisites ; Reborn: Replace rather than append the faction production requirement.
    Object = Demo_GLAArmsDealer
  End

  ; Reborn: Select the inherited second-salvage turret without changing the existing Demo weapons.
  InitialWeaponSetFlags = CRATEUPGRADE_TWO

  ; Reborn: Replace all inherited WeaponSets, preserving the original upgraded guns and manual suicide slot.
  WeaponSet
    Conditions = None
    Weapon = PRIMARY QuadCannonGunUpgradeTwo
    Weapon = SECONDARY QuadCannonGunUpgradeTwoAir
    Weapon = TERTIARY TerroristSuicideNotARealWeapon
    AutoChooseSources = TERTIARY NONE
  End

  AddModule ; Reborn: Preserve the original Demo suicide behavior and command menu upgrade.
    Behavior = SlowDeathBehavior ModuleTag_Death_14
      DeathTypes          = NONE +SUICIDED +EXPLODED
      SinkDelay           = 3000
      SinkRate            = 0.5     ; in Dist/Sec
      DestructionDelay    = 8000
      FX                  = INITIAL FX_TerroristExplode
      FlingForce          = 8
      FlingForceVariance  = 3
      FlingPitch          = 60
      FlingPitchVariance  = 10
    End
  End

  AddModule ; Reborn: Preserve the original Demo suicide behavior and command menu upgrade.
    Behavior = FireWeaponWhenDeadBehavior ModuleTag998
      DeathWeapon   = Demo_SuicideDynamitePackPlusFire
      StartsActive  = No
      TriggeredBy   = Demo_Upgrade_SuicideBomb
      DeathTypes = NONE +SUICIDED
    End;
  End

  AddModule ; Reborn: Preserve the original Demo suicide behavior and command menu upgrade.
    Behavior = FireWeaponWhenDeadBehavior ModuleTag999
      DeathWeapon   = Demo_DestroyedWeapon
      StartsActive  = No
      TriggeredBy   = Demo_Upgrade_SuicideBomb
      DeathTypes = ALL -SUICIDED
    End
  End

  AddModule ; Reborn: Preserve the original Demo suicide behavior and command menu upgrade.
    Behavior = CommandSetUpgrade ModuleTag_16
      CommandSet = Demo_GLAVehicleQuadCannonUpgrade
      TriggeredBy = Demo_Upgrade_SuicideBomb
    End
  End

End
;------------------------------------------------------------------------------
