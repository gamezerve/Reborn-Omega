;//////////////////////////////////////////////////////////////////////////////
;FILE: Demo_GLAInfantryStingerSoldier.ini
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Inherit shared Stinger Soldier data while retaining Demo weapons and suicide behavior.
ObjectInherit Demo_GLAInfantryStingerSoldier GLAInfantryStingerSoldier

  UpgradeCameo2 = Demo_Upgrade_SuicideBomb

  ; ***DESIGN parameters ***
  Side = GLADemolitionGeneral
  ReplaceModule WeaponSet
    Conditions          = None
    Weapon              = PRIMARY   Demo_StingerMissileWeapon
    AutoChooseSources   = PRIMARY   FROM_PLAYER FROM_AI FROM_SCRIPT
    Weapon              = SECONDARY Demo_StingerMissileWeaponAir
    PreferredAgainst    = SECONDARY BALLISTIC_MISSILE AIRCRAFT
    Weapon = TERTIARY TerroristSuicideNotARealWeapon
    AutoChooseSources = TERTIARY NONE
  End

  ReplaceModule Prerequisites
    Object = Demo_GLABarracks
  End

  CommandSet = Demo_GLAInfantryRebelCommandSet

  ; *** ENGINEERING Parameters ***
  ; Reborn: Demo soldiers do not have the base camouflage ability.
  RemoveModule ModuleTag_09
  RemoveModule ModuleTag_10

  ; Reborn: Keep the original Demo death effects and upgrade-dependent explosions and command set.
  AddModule
    Behavior = SlowDeathBehavior ModuleTag_Death15
      DeathTypes          = NONE +SUICIDED +EXPLODED
      SinkDelay           = 3000
      SinkRate            = 0.5     ; in Dist/Sec
      DestructionDelay    = 8000
      FX                  = INITIAL FX_TerroristExplode
      FlingForce          = 8
      FlingForceVariance  = 3
      FlingPitch          = 60
      FlingPitchVariance  = 10
    End

    Behavior = FireWeaponWhenDeadBehavior ModuleTag998
      DeathWeapon   = Demo_SuicideDynamitePackPlusFire
      StartsActive  = No
      TriggeredBy   = Demo_Upgrade_SuicideBomb
      DeathTypes = NONE +SUICIDED
    End;

    Behavior = FireWeaponWhenDeadBehavior ModuleTag999
      DeathWeapon   = Demo_DestroyedWeapon
      StartsActive  = No
      TriggeredBy   = Demo_Upgrade_SuicideBomb
      DeathTypes = ALL -SUICIDED
    End

    Behavior = CommandSetUpgrade ModuleTag_17
      CommandSet = Demo_GLAInfantryRebelCommandSetUpgrade
      TriggeredBy = Demo_Upgrade_SuicideBomb
    End
  End

End
;------------------------------------------------------------------------------
