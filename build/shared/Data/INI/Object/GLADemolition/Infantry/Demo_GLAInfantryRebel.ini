;//////////////////////////////////////////////////////////////////////////////
;FILE: Demo_GLAInfantryRebel.ini //////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Share base Rebel behavior and animation fixes while preserving faction-specific abilities.
ObjectInherit Demo_GLAInfantryRebel GLAInfantryRebel

  SelectPortrait = Demo_SURebel
  ButtonImage = Demo_SURebel

  UpgradeCameo5 = Demo_Upgrade_SuicideBomb

  DisplayName = OBJECT:DemoRebel
  Side = GLADemolitionGeneral

  WeaponSet
    Conditions = None
    Weapon = PRIMARY GLARebelMachineGun
    Weapon = SECONDARY None
    Weapon = TERTIARY TerroristSuicideNotARealWeapon
    AutoChooseSources = TERTIARY NONE
  End

  ReplaceModule Prerequisites
    Object = Demo_GLABarracks
  End

  VoiceSelect = DemoRebelVoiceSelect
  VoiceMove = DemoRebelVoiceMove
  VoiceGuard = DemoRebelVoiceMove

  UnitSpecificSounds
    VoiceCreate = DemoRebelVoiceCreate
    VoiceSubdue = RebelVoiceSubdue
    VoiceGarrison = RebelVoiceGarrison
    VoiceEnter = RebelVoiceMove
    VoiceEnterHostile = RebelVoiceMove
    VoiceGetHealed = RebelVoiceMove
  End

  ReplaceModule ModuleTag_Death01
    Behavior = SlowDeathBehavior Demo_ModuleTag_Death01
      DeathTypes = ALL -CRUSHED -SPLATTED -EXPLODED -BURNED -POISONED -POISONED_BETA -POISONED_GAMMA -SUICIDED
      SinkDelay = 3000
      SinkRate = 0.5
      DestructionDelay = 8000
      FX = INITIAL FX_RebelDie
    End
  End

  ReplaceModule ModuleTag_Death03
    Behavior = SlowDeathBehavior Demo_ModuleTag_Death03
      DeathTypes = NONE +EXPLODED -SUICIDED
      SinkDelay = 3000
      SinkRate = 0.5
      DestructionDelay = 8000
      FX = INITIAL FX_RebelDie
      FlingForce = 8
      FlingForceVariance = 3
      FlingPitch = 60
      FlingPitchVariance = 10
    End
  End

  AddModule
    Behavior = SlowDeathBehavior ModuleTag_Death17
      DeathTypes = NONE +SUICIDED +EXPLODED
      SinkDelay = 3000
      SinkRate = 0.5
      DestructionDelay = 8000
      FX = INITIAL FX_TerroristExplode
      FlingForce = 8
      FlingForceVariance = 3
      FlingPitch = 60
      FlingPitchVariance = 10
    End
  End

  AddModule
    Behavior = FireWeaponWhenDeadBehavior ModuleTag998
      DeathWeapon = Demo_SuicideDynamitePackPlusFire
      StartsActive = No
      TriggeredBy = Demo_Upgrade_SuicideBomb
      DeathTypes = NONE +SUICIDED
    End
  End

  AddModule
    Behavior = FireWeaponWhenDeadBehavior ModuleTag999
      DeathWeapon = Demo_DestroyedWeapon
      StartsActive = No
      TriggeredBy = Demo_Upgrade_SuicideBomb
      DeathTypes = ALL -SUICIDED
    End
  End

  AddModule
    Behavior = CommandSetUpgrade ModuleTag_25
      CommandSet = Demo_GLAInfantryRebelCommandSetUpgrade
      TriggeredBy = Demo_Upgrade_SuicideBomb
    End
  End

End
;------------------------------------------------------------------------------
