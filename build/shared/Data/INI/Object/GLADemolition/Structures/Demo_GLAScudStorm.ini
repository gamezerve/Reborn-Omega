;------------------------------------------------------------------------------
; Reborn: Share the base SCUD Storm and retain this faction variant.
ObjectInherit Demo_GLAScudStorm GLAScudStorm

  ; *** ART Parameters ***
  SelectPortrait = Demo_SUScudStorm
  ButtonImage = Demo_SUScudStorm
  UpgradeCameo1 = "" ; Reborn: Clear the inherited Anthrax Beta cameo.

  ; *** DESIGN Parameters ***
  Side = GLADemolitionGeneral

  ReplaceModule Prerequisites
    Object = Demo_GLAPalace
  End

  WeaponSet
    Conditions = None
    Weapon = PRIMARY Demo_ScudStormWeapon
    AutoChooseSources = PRIMARY NONE
  End

  ; *** ENGINEERING Parameters ***
  ; Reborn: Keep the Demolition Bomb Truck's high explosive burst without any toxin effects.
  RemoveModule ModuleTag_13
  RemoveModule ModuleTag_ScudDeathFieldBeta
  RemoveModule ModuleTag_ScudDeathFXBeta

  ReplaceModule ModuleTag_14
    Behavior = FXListDie Demo_ModuleTag_14
      DeathFX = Demo_WeaponFX_BombTruckHighExplosiveBombDetonation
      ExemptStatus = UNDER_CONSTRUCTION
    End
  End

End
;------------------------------------------------------------------------------
