;GLA Arms Dealer
; Reborn: Inherit all artwork from the matching real Arms Dealer while retaining fake-building behavior.
ObjectInherit Demo_FakeGLAArmsDealer Demo_GLAArmsDealer

  ; ***DESIGN parameters ***
  BuildCost = 625
  BuildTime = 10.0
  CommandSet = FakeGLAArmsDealerCommandSet

  ; Reborn: Preserve manual detonation and the fake building's original armor.
  WeaponSet
    Conditions          = None 
    Weapon = PRIMARY SuicideWeapon
    AutoChooseSources = PRIMARY None
  End

  ArmorSet
    Conditions          = None
    Armor               = StructureArmor
    DamageFX            = StructureDamageFXNoShake
  End

  ExperienceValue = 50 50 50 50

  ; *** ENGINEERING Parameters ***
  ; Reborn: Retain fake classification and enemy-visible health matching the real building.
  KindOf = PRELOAD STRUCTURE SELECTABLE IMMOBILE CAPTURABLE MP_COUNT_FOR_VICTORY SCORE_CREATE CAN_ATTACK FS_FAKE
  RebornFakeBaseObject = Demo_GLAArmsDealer

  ; Reborn: Preserve fake health and subdual limits.
  OverrideModule ModuleTag_05
    MaxHealth = 500.0
    InitialHealth = 500.0
    SubdualDamageCap = 700
  End

  ; Reborn: Remove real armor, hole, production, exit and repair modules before adding the original fake modules.
  RemoveModule ModuleTag_Armor01
  RemoveModule ModuleTag_06
  RemoveModule ModuleTag_07
  RemoveModule ModuleTag_10
  RemoveModule ModuleTag_11
  RemoveModule ModuleTag_12

  ; Reborn: Preserve fake AI, production, detonation and conversion to the matching real Arms Dealer.
  AddModule
    Behavior = AIUpdateInterface ModuleTag_10
      AutoAcquireEnemiesWhenIdle = No
    End

    Behavior = ProductionUpdate ModuleTag_11
      ; nothing
    End

    Behavior = SlowDeathBehavior ModuleTag_12
      ExemptStatus = UNDER_CONSTRUCTION
      DestructionDelay = 0
      Weapon = FINAL FakeStructureDetonationWeapon
    End

    Behavior = DestroyDie ModuleTag_SlowDeathException
      RequiredStatus = UNDER_CONSTRUCTION
    End

    Behavior = ReplaceObjectUpgrade ModuleTag_13
      ReplaceObject = Demo_GLAArmsDealer
      TriggeredBy = Upgrade_BecomeRealGLAArmsDealer
    End

  End

  ; Reborn: Preserve the owner-visible fake-building indicator.
  ShadowTexture = fake_supply
  ShadowSizeX = 127
  ShadowSizeY = 144

End
;------------------------------------------------------------------------------
