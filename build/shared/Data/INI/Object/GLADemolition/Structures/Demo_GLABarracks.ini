;GLA Barracks
ObjectInherit Demo_GLABarracks GLABarracks

  ; *** ART Parameters ***
  ; Reborn: Inherit shared Barracks artwork and the explicit heavy-damage states.
  SelectPortrait = Demo_SUBarracks
  ButtonImage = Demo_SUBarracks

  ; ***DESIGN parameters ***
  Side = GLADemolitionGeneral

  CommandSet = Demo_GLABarracksCommandSet

  ; Reborn: Preserve the Demo Barracks weapon slots.
  WeaponSet
    Conditions = None 
    Weapon = PRIMARY None
    Weapon = SECONDARY None
  End

  ; *** ENGINEERING Parameters ***
  ; Reborn: Preserve Demo-specific death handling.
  AddModule
    Behavior = SlowDeathBehavior ModuleTag_Death17
      DeathTypes          = NONE +SUICIDED +EXPLODED
      SinkDelay           = 3000
      SinkRate            = 0.5     ; in Dist/Sec
      DestructionDelay    = 8000
      FX                  = INITIAL FX_TerroristExplode
      FlingForce          = 8
      FlingForceVariance  = 3
      FlingPitch          = 60
      FlingPitchVariance  = 10
    End
  End

  ; Reborn: Redundant so commented out. Demo Barracks does not upgrade its commandset
  ;Behavior = CommandSetUpgrade ModuleTag_18
  ;  TriggeredBy = Upgrade_GLAWorkerFakeCommandSet
  ;  RemovesUpgrades = Upgrade_GLAWorkerRealCommandSet
  ;  CommandSet = Demo_GLAWorkerFakeBuildingsCommandSet
  ;End
 
  ;Behavior = CommandSetUpgrade ModuleTag_19
  ;  TriggeredBy = Upgrade_GLAWorkerRealCommandSet
  ;  RemovesUpgrades = Upgrade_GLAWorkerFakeCommandSet Upgrade_GLAWorkerRealCommandSet
  ;  CommandSet = Demo_GLAWorkerCommandSet
  ;End


End
