;//////////////////////////////////////////////////////////////////////////////
;FILE: Boss_TankOverlord.ini //////////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Share the base Overlord while retaining Boss art, cost, requirements and Composite Armor upgrade.
ObjectInherit Boss_TankOverlord ChinaTankOverlord

  ; *** ART Parameters ***
  SelectPortrait         = Boss_SNOverlord_L
  ButtonImage            = Boss_SNOverlord_L

  UpgradeCameo7 = Upgrade_AmericaCompositeArmor

  ; ***DESIGN parameters ***
  Side            = Boss

  BuildCost       = 2000

  ReplaceModule Prerequisites
  ;  Object = Boss_WarFactory ; Reborn: Getting an overlord right away seems a bit owerpowered
    Object = Boss_NuclearMissileLauncher
  End

  Behavior = MaxHealthUpgrade ModuleTag_22
    TriggeredBy   = Upgrade_AmericaCompositeArmor
    AddMaxHealth  = 100.0
    ChangeType    = ADD_CURRENT_HEALTH_TOO   ;Choices are PRESERVE_RATIO, ADD_CURRENT_HEALTH_TOO, and SAME_CURRENTHEALTH
  End

End
;------------------------------------------------------------------------------
