;------------------------------------------------------------------------------
; Reborn: Share the Boss General Speaker Tower and attach it to the Airfield as an extention.
ObjectInherit Boss_SpeakerTowerExtention Boss_SpeakerTower

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:SpeakerTowerExtention

  Behavior = SlavedUpdate ModuleTag_16
    GuardMaxRange           = 0
    GuardWanderRange        = 0
    AttackRange             = 0
    AttackWanderRange       = 0
    ScoutRange              = 0
    ScoutWanderRange        = 0
    StayOnSameLayerAsMaster = Yes
    IsRebornExtention       = Yes
    UpgradeToRemoveOnSell   = Boss_Upgrade_ChinaSpeakerTowerExtention
  End

  Behavior = UpgradeDie ModuleTag_27
    ;This frees the object based upgrade for the producer object.
    DeathTypes      = ALL
    UpgradeToRemove = Boss_Upgrade_ChinaSpeakerTowerExtention ModuleTag_27
  End

End
;------------------------------------------------------------------------------
