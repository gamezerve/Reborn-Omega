;//////////////////////////////////////////////////////////////////////////////
;FILE: Boss_TunnelNetwork.ini /////////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; -----------------------------------------------------------------------------
; Reborn: Share base Tunnel damage-state fixes and AP Bullets support while retaining Boss defenders and mines.
ObjectInherit Boss_TunnelNetwork GLATunnelNetwork

  ; *** ART Parameters ***
  SelectPortrait = Boss_SUTunnel_L
  ButtonImage = Boss_SUTunnel_L

  ; Reborn: Show the inherited AP Bullets bonus while retaining the absence of camouflage artwork.
  ;UpgradeCameo1 = Upgrade_GLAAPBullets
  UpgradeCameo2 = NONE

  RemoveModule ModuleTag_Camonetting

  ; ***DESIGN parameters ***
  Side = Boss

  ReplaceModule Prerequisites
    Object = Boss_Barracks
  End

  CommandSet = Boss_GLATunnelNetworkCommandSet

  ; *** ENGINEERING Parameters ***
  ; Reborn: Replace the inherited defender list instead of appending to it.
  OverrideModule ModuleTag_07
    SpawnTemplateNameOverride = Boss_InfantryTankHunter
  End

  ; Reborn: Boss tunnels do not use the base camouflage behaviors.
  RemoveModule ModuleTag_17
  RemoveModule ModuleTag_18
  RemoveModule ModuleTag_CamonetVisual

  ; Reborn: Preserve the Boss mine command-set upgrade with a unique inherited module tag.
  AddModule
    Behavior = CommandSetUpgrade Boss_ModuleTag_21
      CommandSet = Boss_GLATunnelNetworkCommandSetUpgrade
      TriggeredBy = Upgrade_ChinaMines
    End
  End

  ; Reborn: Preserve standard mines and their EMP mine upgrade.
  AddModule
    Behavior = GenerateMinefieldBehavior     ModuleTag_22
      TriggeredBy           = Upgrade_ChinaMines
      MineName              = ChinaStandardMine
      SmartBorder           = Yes
      AlwaysCircular        = Yes
  
      Upgradable            = Yes
      UpgradedTriggeredBy   = Upgrade_ChinaEMPMines
      UpgradedMineName      = ChinaEMPMine
    End
  End

  ; Reborn: Preserve the existing EMP Mines armor-upgrade module.
  AddModule
    Behavior = ArmorUpgrade ModuleTag_26
      TriggeredBy = Upgrade_ChinaEMPMines
    End
  End

End
;------------------------------------------------------------------------------
