;//////////////////////////////////////////////////////////////////////////////
;FILE: Boss_PowerPlant.ini ////////////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
ObjectInherit Boss_PowerPlant AmericaPowerPlant

  ; *** ART Parameters ***
  SelectPortrait         = Boss_SAPowerPlant_L
  ButtonImage            = Boss_SAPowerPlant_L

  ; ***DESIGN parameters ***
  Side                   = Boss
  CommandSet             = Boss_AmericaPowerPlantCommandSet

  ; *** ENGINEERING Parameters ***
  ; Reborn: Boss power plants can lay China mines.
  AddModule
    Behavior = CommandSetUpgrade ModuleTag_20
      CommandSet = Boss_AmericaPowerPlantCommandSetUpgrade
      TriggeredBy = Upgrade_ChinaMines
    End
  End

  AddModule
    Behavior = GenerateMinefieldBehavior ModuleTag_21
      TriggeredBy           = Upgrade_ChinaMines
      MineName              = ChinaStandardMine
      SmartBorder           = Yes
      AlwaysCircular        = Yes

      Upgradable            = Yes
      UpgradedTriggeredBy   = Upgrade_ChinaEMPMines
      UpgradedMineName      = ChinaEMPMine
    End
  End

  AddModule
    Behavior = ArmorUpgrade ModuleTag_26
      TriggeredBy = Upgrade_ChinaEMPMines
    End
  End

End
;------------------------------------------------------------------------------
