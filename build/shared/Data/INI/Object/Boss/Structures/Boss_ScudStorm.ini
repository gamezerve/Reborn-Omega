;------------------------------------------------------------------------------
; Reborn: Share the base SCUD Storm and retain this faction variant.
ObjectInherit Boss_ScudStorm GLAScudStorm

  ; *** ART Parameters ***
  SelectPortrait = Boss_SUScudStorm_L
  ButtonImage = Boss_SUScudStorm_L

  ; *** DESIGN Parameters ***
  Side = Boss

  ReplaceModule Prerequisites
    Object = Boss_WarFactory
    Object = Boss_Airfield
  End

  CommandSet = Boss_GLAScudStormCommandSet

  ; *** ENGINEERING Parameters ***
  AddModule ; Reborn: Keep the Boss mine, command set, production and armor modules.
    Behavior = GenerateMinefieldBehavior     ModuleTag_20
      TriggeredBy           = Upgrade_ChinaMines
      MineName              = ChinaStandardMine
      SmartBorder           = Yes
      AlwaysCircular        = Yes

      Upgradable            = Yes
      UpgradedTriggeredBy   = Upgrade_ChinaEMPMines
      UpgradedMineName      = ChinaEMPMine
    End

    Behavior = CommandSetUpgrade ModuleTag_25
      CommandSet = Boss_GLAScudStormCommandSetUpgrade
      TriggeredBy = Upgrade_ChinaMines
    End

    Behavior = ProductionUpdate ModuleTag_21
      ; nothing
    End

    Behavior = ArmorUpgrade ModuleTag_26
      TriggeredBy = Upgrade_ChinaEMPMines
    End
  End

End
;------------------------------------------------------------------------------
