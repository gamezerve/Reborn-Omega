;//////////////////////////////////////////////////////////////////////////////
;FILE: Chem_GLAVehicleScudLauncher.ini ////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Share base SCUD behavior while retaining faction weapons, prerequisites and all CommandSet differences.
ObjectInherit Chem_GLAVehicleScudLauncher GLAVehicleScudLauncher

  SelectPortrait = Chem_SUScudLauncher
  ButtonImage = Chem_SUScudLauncher

  UpgradeCameo4 = Chem_Upgrade_GLAAnthraxGamma

  Side = GLAToxinGeneral

  BuildCost = 1000

  CommandSet = Chem_GLAVehicleScudLauncherCommandSet

  ReplaceModule Prerequisites ; Reborn: Preserve both faction buildings and the faction-specific unlock science.
    Object = Chem_GLAArmsDealer
    Object = Chem_GLAPalace
    Science = SCIENCE_ToxinScudLauncher
  End

  ; Reborn: Replace every inherited WeaponSet so no unwanted explosive/poison mode can leak into this variant.
  WeaponSet
    Conditions = None
    Weapon = PRIMARY SCUDLauncherGunAnthrax
    AutoChooseSources = PRIMARY FROM_SCRIPT FROM_AI
  End
  WeaponSet
    Conditions = PLAYER_UPGRADE
    Weapon = PRIMARY Chem_SCUDLauncherGunAnthraxGamma
    AutoChooseSources = PRIMARY FROM_SCRIPT FROM_AI
  End
  WeaponSet
    Conditions = CRATEUPGRADE_ONE
    Weapon = PRIMARY SCUDLauncherGunAnthraxPlusOne
    AutoChooseSources = PRIMARY FROM_SCRIPT FROM_AI
  End
  WeaponSet
    Conditions = PLAYER_UPGRADE CRATEUPGRADE_ONE
    Weapon = PRIMARY Chem_SCUDLauncherGunAnthraxGammaPlusOne
    AutoChooseSources = PRIMARY FROM_SCRIPT FROM_AI
  End
  WeaponSet
    Conditions = CRATEUPGRADE_TWO
    Weapon = PRIMARY SCUDLauncherGunAnthraxPlusTwo
    AutoChooseSources = PRIMARY FROM_SCRIPT FROM_AI
  End
  WeaponSet
    Conditions = PLAYER_UPGRADE CRATEUPGRADE_TWO
    Weapon = PRIMARY Chem_SCUDLauncherGunAnthraxGammaPlusTwo
    AutoChooseSources = PRIMARY FROM_SCRIPT FROM_AI
  End

  ReplaceModule ModuleTag_03 ; Reborn: Preserve the original PRIMARY-only turret control.
    Behavior = AIUpdateInterface Chem_ModuleTag_ScudAI
      Turret
        TurretTurnRate = 60   ; turn rate, in degrees per sec
        TurretPitchRate = 60
        FirePitch = 90  ; Instead of aiming pitchwise at the target, it will aim here
        AllowsPitch = Yes
        ControlledWeaponSlots = PRIMARY
      End
      AutoAcquireEnemiesWhenIdle = No NotWhileAttacking
    End
  End

  RemoveModule ModuleTag_24 ; Reborn: Neither faction used the base two-mode weapon lock.

  OverrideModule ModuleTag_23 ; Reborn: Gamma, not Beta, selects the upgraded toxin WeaponSets.
    TriggeredBy = Chem_Upgrade_GLAAnthraxGamma
  End

End
;------------------------------------------------------------------------------
