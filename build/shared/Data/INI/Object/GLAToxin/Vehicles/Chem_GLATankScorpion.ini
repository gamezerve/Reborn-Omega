; Reborn: Share base Scorpion behavior while retaining all faction-specific settings.
ObjectInherit Chem_GLATankScorpion GLATankScorpion

  SelectPortrait = Chem_SUScorpion
  ButtonImage = Chem_SUScorpion
  
  UpgradeCameo6 = Chem_Upgrade_GLAAnthraxGamma

  Side = GLAToxinGeneral

  BuildCost = 650

  ReplaceModule Prerequisites ; Reborn: Replace rather than append the production requirement.
    Object = Chem_GLAArmsDealer
  End

  ReplaceModule WeaponSet ; Reborn: Keep the toxin-specific rocket for this exact condition.
    Conditions = PLAYER_UPGRADE
    Weapon = PRIMARY ScorpionTankGun
    Weapon = SECONDARY Chem_ScorpionMissileWeapon
  End

  ReplaceModule WeaponSet ; Reborn: Keep the toxin-specific rocket for this exact condition.
    Conditions = CRATEUPGRADE_ONE PLAYER_UPGRADE
    Weapon = PRIMARY ScorpionTankGunPlusOne
    Weapon = SECONDARY Chem_ScorpionMissileWeapon ; No bonus at Plus One
  End

  ReplaceModule WeaponSet ; Reborn: Keep the toxin-specific rocket for this exact condition.
    Conditions = CRATEUPGRADE_TWO PLAYER_UPGRADE
    Weapon = PRIMARY ScorpionTankGunPlusOne ; No further bonus at plus two
    Weapon = SECONDARY Chem_ScorpionMissileWeaponPlusTwo
  End

End
