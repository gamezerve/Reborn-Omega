;//////////////////////////////////////////////////////////////////////////////
;FILE: Chem_GLADemoTrap.ini ///////////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Share the base Demo Trap and its command set while retaining Toxin General art, production requirements and Anthrax detonation weapons.
ObjectInherit Chem_GLADemoTrap GLADemoTrap

  ; *** ART Parameters ***
  SelectPortrait = Chem_SSHideBomb
  ButtonImage    = Chem_SSHideBomb

  UpgradeCameo1  = Upgrade_GLAAnthraxBeta
  UpgradeCameo2  = Chem_Upgrade_GLAAnthraxGamma

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:ToxinDemoTrap

  Side        = GLAToxinGeneral

  ReplaceModule Prerequisites
    Object = Chem_GLAArmsDealer
  End

  ReplaceModule ModuleTag_05 ; Reborn: Detonate one second after the warning like the other Demo Traps, using the Anthrax weapon that matches the upgrade.
    Behavior = SlowDeathBehavior Chem_ModuleTag_DemoTrapDeathBeta
      ExemptStatus     = UNDER_CONSTRUCTION
      ConflictsWith    = Chem_Upgrade_GLAAnthraxGamma
      DestructionDelay = 1000
      FX               = INITIAL FX_GLADemoTrapWarning
      Weapon           = FINAL Chem_DemoTrapDetonationWeaponBeta
    End
  End

  Behavior = SlowDeathBehavior Chem_ModuleTag_DemoTrapDeathGamma
    ExemptStatus     = UNDER_CONSTRUCTION
    TriggeredBy  = Chem_Upgrade_GLAAnthraxGamma
    DestructionDelay = 1000
    FX               = INITIAL FX_GLADemoTrapWarning
    Weapon           = FINAL Chem_DemoTrapDetonationWeaponGamma
  End

End
;------------------------------------------------------------------------------
