;Fake GLA Command Center
ObjectInherit Chem_FakeGLACommandCenter Chem_GLACommandCenter

  ; *** ART Parameters ***
  ; Reborn: Inherit all faction real draw modules, including night, fortified and camo artwork.

  ; ***DESIGN parameters ***
  Prerequisites
    Object = Chem_GLACommandCenter
  End
  BuildCost = 500
  BuildTime = 30.0
  CommandSet = FakeGLACommandCenterCommandSet

  ; Reborn: Retain fake detonation, armor and experience instead of real building combat properties.
  WeaponSet
    Conditions = None
    Weapon = PRIMARY SuicideWeapon
    AutoChooseSources = PRIMARY None
  End
  ArmorSet
    Conditions = None
    Armor = StructureArmorTough
    DamageFX = StructureDamageFXNoShake
  End
  ExperienceValue = 50 50 50 50

  ; *** AUDIO Parameters ***
  VoiceSelect = CommandCenterGLASelect

  ; *** ENGINEERING Parameters ***
  ; Reborn: Preserve fake classification and enemy-visible health reference.
  KindOf = PRELOAD STRUCTURE SELECTABLE IMMOBILE CAPTURABLE MP_COUNT_FOR_VICTORY SCORE_CREATE CAN_ATTACK FS_FAKE
  RebornFakeBaseObject = Chem_GLACommandCenter

  ; Reborn: Preserve fake health and subdual limits.
  OverrideModule ModuleTag_04
    MaxHealth = 1250.0
    InitialHealth = 1250.0
    SubdualDamageCap = 1450
  End

  ; Reborn: Remove real exit, rebuilding, upgraded armor, general powers, taunts and free upgrade grants.
  RemoveModule ModuleTag_Armor01
  RemoveModule ModuleTag_06
  RemoveModule ModuleTag_07
  RemoveModule ModuleTag_08
  RemoveModule ModuleTag_11
  RemoveModule ModuleTag_12
  RemoveModule ModuleTag_13
  RemoveModule ModuleTag_14
  RemoveModule ModuleTag_21
  RemoveModule ModuleTag_22
  RemoveModule ModuleTag_15
  RemoveModule ModuleTag_16
  RemoveModule ModuleTag_17
  RemoveModule ModuleTag_Taunt01
  RemoveModule ModuleTag_Taunt02
  RemoveModule ModuleTag_Taunt03
  RemoveModule ModuleTag_Taunt04
  RemoveModule ModuleTag_Taunt05
  RemoveModule ModuleTag_Taunt06
  RemoveModule ModuleTag_Taunt07
  RemoveModule ModuleTag_Taunt08
  RemoveModule ModuleTag_Taunt09
  RemoveModule ModuleTag_Taunt010
  RemoveModule ModuleTag_Taunt011
  RemoveModule ModuleTag_Taunt012
  RemoveModule ModuleTag_Taunt013
  RemoveModule ModuleTag_CommandSetTaunt01
  RemoveModule ModuleTag_CommandSetTaunt02
  RemoveModule ModuleTag_23
  RemoveModule ModuleTag_24

  ; Reborn: Retain fake AI, detonation and conversion to this faction's real Command Center.
  AddModule
    Behavior = AIUpdateInterface ModuleTag_06
      AutoAcquireEnemiesWhenIdle = No
    End
    Behavior = SlowDeathBehavior ModuleTag_11
      ExemptStatus = UNDER_CONSTRUCTION
      DestructionDelay = 0
      Weapon = FINAL FakeStructureDetonationWeapon
    End
    Behavior = DestroyDie ModuleTag_SlowDeathException
      RequiredStatus = UNDER_CONSTRUCTION
    End
    Behavior = ReplaceObjectUpgrade ModuleTag_12
      ReplaceObject = Chem_GLACommandCenter
      TriggeredBy = Upgrade_BecomeRealGLACommandCenter
    End
  End

  ; Reborn: Keep the existing owner-visible fake-building decal.
  ShadowTexture = fake_supply
  ShadowSizeX = 165
  ShadowSizeY = 145

End
