; Reborn: Share the base SCUD Storm and retain this faction variant.
ObjectInherit Chem_GLAScudStorm GLAScudStorm

  ; *** ART Parameters ***
  SelectPortrait = Chem_SUScudStorm
  ButtonImage = Chem_SUScudStorm
  UpgradeCameo2 = Chem_Upgrade_GLAAnthraxGamma

  ; *** DESIGN Parameters ***
  Side = GLAToxinGeneral

  ReplaceModule Prerequisites
    Object = Chem_GLAPalace
  End

  WeaponSet
    Conditions = None
    Weapon = PRIMARY Chem_ScudStormWeapon
    AutoChooseSources = PRIMARY NONE
  End

  ; Reborn: Gamma replaces both lower tiers only on the Toxin SCUD Storm.
  OverrideModule ModuleTag_13
    ConflictsWith = Upgrade_GLAAnthraxBeta Chem_Upgrade_GLAAnthraxGamma
  End
  OverrideModule ModuleTag_14
    ConflictsWith = Upgrade_GLAAnthraxBeta Chem_Upgrade_GLAAnthraxGamma
  End
  OverrideModule ModuleTag_ScudDeathFieldBeta
    ConflictsWith = Chem_Upgrade_GLAAnthraxGamma
  End
  OverrideModule ModuleTag_ScudDeathFXBeta
    ConflictsWith = Chem_Upgrade_GLAAnthraxGamma
  End

  AddModule
    Behavior = CreateObjectDie ModuleTag_ScudDeathFieldGamma
      CreationList = OCL_PoisonFieldGammaMedium
      TriggeredBy = Chem_Upgrade_GLAAnthraxGamma
      ExemptStatus = UNDER_CONSTRUCTION
    End
    Behavior = FXListDie ModuleTag_ScudDeathFXGamma
      DeathFX = FX_ScudStormDeathAnthraxGamma
      TriggeredBy = Chem_Upgrade_GLAAnthraxGamma
      ExemptStatus = UNDER_CONSTRUCTION
    End
  End

End
