;//////////////////////////////////////////////////////////////////////////////
;FILE: Chem_FakeGLABlackMarket.ini ////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
ObjectInherit Chem_FakeGLABlackMarket Chem_GLABlackMarket

  ; *** ART Parameters ***
  ; Reborn: Inherit all real Black Market draw modules, including fortified and camo artwork.

  ; ***DESIGN parameters ***
  BuildCost = 625
  BuildTime = 20.0
  CommandSet = FakeGLABlackMarketCommandSet

  ; Reborn: Keep manual fake-building detonation and visual-only fortified armor.
  WeaponSet
    Conditions          = None 
    Weapon = PRIMARY SuicideWeapon
    AutoChooseSources = PRIMARY None
  End

  ArmorSet
    Conditions        = None
    Armor             = StructureArmor
    DamageFX          = StructureDamageFXNoShake
  End
  ExperienceValue = 50 50 50 50

  ; *** ENGINEERING Parameters ***
  ; Reborn: Preserve fake classification and the real health shown to enemies.
  KindOf = PRELOAD STRUCTURE SELECTABLE IMMOBILE CAPTURABLE MP_COUNT_FOR_VICTORY SCORE_CREATE CAN_ATTACK FS_FAKE
  RebornFakeBaseObject = Chem_GLABlackMarket

  ; Reborn: Retain fake health and subdual limits.
  OverrideModule ModuleTag_04
    MaxHealth = 125.0
    InitialHealth = 125.0
    SubdualDamageCap = 325
  End

  ; Reborn: Exclude real armor upgrades, actual income and rebuilding holes.
  RemoveModule ModuleTag_Armor01
  RemoveModule ModuleTag_05
  RemoveModule ModuleTag_07
  RemoveModule ModuleTag_08

  ; Reborn: Retain fake AI, detonation, conversion and display-only income.
  AddModule
    Behavior = AIUpdateInterface ModuleTag_05
      AutoAcquireEnemiesWhenIdle = No
    End

    Behavior = SlowDeathBehavior ModuleTag_07
      ExemptStatus = UNDER_CONSTRUCTION
      DestructionDelay = 0
      Weapon = FINAL FakeStructureDetonationWeapon
    End

    Behavior = DestroyDie ModuleTag_SlowDeathException
      RequiredStatus = UNDER_CONSTRUCTION
    End

    Behavior = ReplaceObjectUpgrade ModuleTag_08
      ReplaceObject = Chem_GLABlackMarket
      TriggeredBy = Upgrade_BecomeRealGLABlackMarket
    End

    Behavior = AutoDepositUpdate ModuleTag_FakeMoney
      DepositTiming       = 2000   ; in milliseconds
      DepositAmount       = 20   ; cash amount to deposit every DepositTiming
      InitialCaptureBonus = 0  ; no initial bonus
      ActualMoney = No ; Display only so I look like a BlackMarket
    End
  End

  ; Reborn: Preserve the owner-visible fake-building indicator.
  ShadowTexture = fake_supply
  ShadowSizeX = 108
  ShadowSizeY = 96

End
;------------------------------------------------------------------------------
