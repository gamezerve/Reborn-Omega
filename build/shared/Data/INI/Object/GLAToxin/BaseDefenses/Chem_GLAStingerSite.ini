; Reborn: Share base Stinger Site art and slave settings while preserving Toxin differences.
ObjectInherit Chem_GLAStingerSite GLAStingerSite

  ; *** ART Parameters ***
  SelectPortrait = Chem_SUStinger
  ButtonImage = Chem_SUStinger

  UpgradeCameo1 = Upgrade_GLAAnthraxBeta
  UpgradeCameo2 = Chem_Upgrade_GLAAnthraxGamma
  UpgradeCameo3 = Upgrade_GLAAPRockets

  ; ***DESIGN parameters ***
  Side = GLAToxinGeneral

  ReplaceModule Prerequisites
    Object = Chem_GLABarracks
  End

  CommandSet = Chem_GLAStingerSiteCommandSet

  ; *** ENGINEERING Parameters ***
  ; Reborn: Override only the soldier type; inherit replacement timing and slave behavior.
  OverrideModule ModuleTag_06
    SpawnTemplateName = Chem_GLAInfantryStingerSoldier
  End

  ; Reborn: Preserve this variant's lack of camouflage while sharing the main building draw modules.
  RemoveModule ModuleTag_Camonetting
  RemoveModule ModuleTag_13
  RemoveModule ModuleTag_14
  RemoveModule ModuleTag_15
  RemoveModule ModuleTag_CamonetVisual

End
