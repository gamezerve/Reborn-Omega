;//////////////////////////////////////////////////////////////////////////////
;FILE: Chem_GLATunnelNetwork.ini //////////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
;This file is for Chemical Generals Challenge GLA Buildings
; Reborn: Inherit shared Tunnel Network data and damage-state fixes while preserving variant behavior.
ObjectInherit Chem_GLATunnelNetwork GLATunnelNetwork

  ; *** ART Parameters ***
  SelectPortrait = SUToxicTunnel_L
  ButtonImage = SUToxicTunnel_L

  UpgradeCameo1 = Upgrade_GLAAnthraxBeta
  UpgradeCameo2 = Chem_Upgrade_GLAAnthraxGamma

  ; Reborn: Retain toxin models and missile bones; inherit the shared construction draw modules.
  ReplaceModule ModuleTag_01
    Draw = W3DModelDraw Chem_ModuleTag_01
      OkToChangeModelColor = Yes
      
      DefaultConditionState
        Model             = UBToxTunn
        Turret            = Turret01
        WeaponFireFXBone  = PRIMARY BarrelMS
        WeaponLaunchBone  = PRIMARY BarrelMS
        WeaponMuzzleFlash = PRIMARY BarrelFX
      End
      ConditionState      = DAMAGED
        Model             = UBToxTunn_D
        WeaponFireFXBone  = PRIMARY BarrelMS
        WeaponLaunchBone  = PRIMARY BarrelMS
  
      End
      ; Reborn: Match living heavy damage and retain the original rubble model state.
      ConditionState      = REALLYDAMAGED
        Model             = UBToxTunn_E
        WeaponFireFXBone  = PRIMARY BarrelMS
        WeaponLaunchBone  = PRIMARY BarrelMS
  
        ParticleSysBone   = Steam01 SteamVent
      End
      AliasConditionState = REALLYDAMAGED RUBBLE
      
      
      ConditionState      = SNOW
        Model             = UBToxTunn_S
      End
      ConditionState      = DAMAGED SNOW
        Model             = UBToxTunn_DS
      End
      ; Reborn: Match living heavy damage and retain the original rubble model state.
      ConditionState      = REALLYDAMAGED SNOW
        Model             = UBToxTunn_ES
        ParticleSysBone   = Steam01 SteamVent
      End
      AliasConditionState = REALLYDAMAGED RUBBLE SNOW
      
      
      
      
      ConditionState      = NIGHT
        Model             = UBToxTunn_N
      End
      ConditionState      = DAMAGED NIGHT
        Model             = UBToxTunn_DN
      End
      ; Reborn: Match living heavy damage and retain the original rubble model state.
      ConditionState      = REALLYDAMAGED NIGHT
        Model             = UBToxTunn_EN
        ParticleSysBone   = Steam01 SteamVent
      End
      AliasConditionState = REALLYDAMAGED RUBBLE NIGHT
      
      
      ConditionState      = SNOW NIGHT
        Model             = UBToxTunn_NS
      End
      ConditionState      = DAMAGED SNOW NIGHT
        Model             = UBToxTunn_DNS
      End
      ; Reborn: Match living heavy damage and retain the original rubble model state.
      ConditionState      = REALLYDAMAGED SNOW NIGHT
        Model             = UBToxTunn_ENS
        ParticleSysBone   = Steam01 SteamVent
      End
      AliasConditionState = REALLYDAMAGED RUBBLE SNOW NIGHT
  
      ;**************************************************************************************************************************
      ;This block handles every possible case with construction process, selling process, awaiting construction, and sold states
      ;for this draw module
      ConditionState       = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED
        Model              = UBToxTunn
        Flags              = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
      End
      ConditionState       = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED DAMAGED
        Model              = UBToxTunn_D
        Flags              = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
      End
      ConditionState       = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED REALLYDAMAGED
        Model              = UBToxTunn_E
        Flags              = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
      End
      ConditionState       = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED NIGHT
        Model              = UBToxTunn_N
        Flags              = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
      End
      ConditionState       = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED NIGHT DAMAGED
        Model              = UBToxTunn_DN
        Flags              = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
      End
      ConditionState       = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED NIGHT REALLYDAMAGED
        Model              = UBToxTunn_EN
        Flags              = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
      End
      ConditionState       = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED SNOW
        Model              = UBToxTunn_S
        Flags              = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
      End
      ConditionState       = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED SNOW DAMAGED
        Model              = UBToxTunn_DS
        Flags              = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
      End
      ConditionState       = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED SNOW REALLYDAMAGED
        Model              = UBToxTunn_ES
        Flags              = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
      End
      ConditionState       = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED NIGHT SNOW
        Model              = UBToxTunn_NS
        Flags              = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
      End
      ConditionState       = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED NIGHT SNOW DAMAGED
        Model              = UBToxTunn_DNS
        Flags              = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
      End
      ConditionState       = AWAITING_CONSTRUCTION PARTIALLY_CONSTRUCTED ACTIVELY_BEING_CONSTRUCTED NIGHT SNOW REALLYDAMAGED
        Model              = UBToxTunn_ENS
        Flags              = ADJUST_HEIGHT_BY_CONSTRUCTION_PERCENT
      End
  
      ConditionState       = AWAITING_CONSTRUCTION 
        Model              = NONE
      End
      AliasConditionState  = AWAITING_CONSTRUCTION DAMAGED
      AliasConditionState  = AWAITING_CONSTRUCTION REALLYDAMAGED
      AliasConditionState  = AWAITING_CONSTRUCTION NIGHT
      AliasConditionState  = AWAITING_CONSTRUCTION NIGHT DAMAGED
      AliasConditionState  = AWAITING_CONSTRUCTION NIGHT REALLYDAMAGED
      AliasConditionState  = AWAITING_CONSTRUCTION SNOW
      AliasConditionState  = AWAITING_CONSTRUCTION SNOW DAMAGED
      AliasConditionState  = AWAITING_CONSTRUCTION SNOW REALLYDAMAGED
      AliasConditionState  = AWAITING_CONSTRUCTION NIGHT SNOW
      AliasConditionState  = AWAITING_CONSTRUCTION NIGHT SNOW DAMAGED
      AliasConditionState  = AWAITING_CONSTRUCTION NIGHT SNOW REALLYDAMAGED
      AliasConditionState  = SOLD 
      AliasConditionState  = SOLD DAMAGED
      AliasConditionState  = SOLD REALLYDAMAGED
      AliasConditionState  = SOLD NIGHT
      AliasConditionState  = SOLD NIGHT DAMAGED
      AliasConditionState  = SOLD NIGHT REALLYDAMAGED
      AliasConditionState  = SOLD SNOW
      AliasConditionState  = SOLD SNOW DAMAGED
      AliasConditionState  = SOLD SNOW REALLYDAMAGED
      AliasConditionState  = SOLD NIGHT SNOW
      AliasConditionState  = SOLD NIGHT SNOW DAMAGED
      AliasConditionState  = SOLD NIGHT SNOW REALLYDAMAGED
      ;**************************************************************************************************************************
      
    End
  End

  ; Reborn: This variant has no camouflage netting.
  RemoveModule ModuleTag_Camonetting

  ; ***DESIGN parameters ***
  DisplayName = OBJECT:Chem_TunnelNetwork
  Side = GLAToxinGeneral

  ReplaceModule Prerequisites
    Object = Chem_GLABarracks
  End

  ReplaceModule WeaponSet
    Conditions        = None 
    Weapon            = PRIMARY     Chem_TunnelNetworkGunBeta
  End

  WeaponSet 
    Conditions        = PLAYER_UPGRADE
    Weapon            = PRIMARY     Chem_TunnelNetworkGunGamma
  End

  CommandSet = Chem_GLATunnelNetworkCommandSet

  ; *** ENGINEERING Parameters ***
  ; Reborn: Preserve the Anthrax Gamma weapon-set switch.
  AddModule
    Behavior = WeaponSetUpgrade ModuleTag_08
      TriggeredBy   = Chem_Upgrade_GLAAnthraxGamma
    End
  End

  ; Reborn: Replace, rather than append to, the inherited defender template list.
  OverrideModule ModuleTag_07
    SpawnTemplateNameOverride = Chem_GLAInfantryTunnelDefender
  End

  ; Reborn: Preserve the absence of camouflage behaviors.
  RemoveModule ModuleTag_17
  RemoveModule ModuleTag_18
  RemoveModule ModuleTag_CamonetVisual

  ; Reborn: Toxin weapons do not use the base AP Bullets bonus module.
  RemoveModule ModuleTag_APBullets01

End
;------------------------------------------------------------------------------
