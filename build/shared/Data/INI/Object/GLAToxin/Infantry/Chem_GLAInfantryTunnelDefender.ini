;//////////////////////////////////////////////////////////////////////////////
;FILE: Chem_GLAInfantryTunnelDefender.ini /////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Share the base RPG Trooper while retaining Toxin General art, Anthrax weapons and voices.
ObjectInherit Chem_GLAInfantryTunnelDefender GLAInfantryTunnelDefender

  ; *** ART Parameters ***
  SelectPortrait = SUToxinRPG_L
  ButtonImage    = SUToxinRPG_L

  UpgradeCameo1  = Upgrade_GLAAnthraxBeta
  UpgradeCameo2  = Chem_Upgrade_GLAAnthraxGamma
  UpgradeCameo3  = Upgrade_GLAAPRockets

  ReplaceModule ModuleTag_01 ; Reborn: Retain the Toxin model, secondary weapon bones and B weapon aliases.
    Draw = W3DModelDraw Chem_ModuleTag_TunnelDefenderDraw
      OkToChangeModelColor = Yes

      DefaultConditionState
        Model = UITunFTox_SKN
        IdleAnimation = UITunF_SKL.UITunF_STA 0 20
        IdleAnimation = UITunF_SKL.UITunF_IDA 
        IdleAnimation = UITunF_SKL.UITunF_IDB 
        IdleAnimation = UITunF_SKL.UITunF_IDC 
        AnimationMode = ONCE
        WeaponMuzzleFlash = PRIMARY MuzzleFX
        WeaponFireFXBone = PRIMARY Muzzle
        WeaponLaunchBone = PRIMARY Muzzle
        WeaponMuzzleFlash = SECONDARY MuzzleFX      ;Fixes shooting at the hip.
        WeaponFireFXBone = SECONDARY Muzzle         ;Fixes shooting at the hip.
        WeaponLaunchBone = SECONDARY Muzzle         ;Fixes shooting at the hip.
      End

      ConditionState = MOVING
        Animation = UITunF_SKL.UITunF_WKA 16
        Animation = UITunF_SKL.UITunF_WKB 30
        Animation = UITunF_SKL.UITunF_WKC 30
        Animation = UITunF_SKL.UITunF_RNA 15
        Animation = UITunF_SKL.UITunF_RNB 25   
        AnimationMode = LOOP
        ParticleSysBone   = None InfantryDustTrails
      End
      AliasConditionState = MOVING FIRING_A ; Reborn: Keep the movement animation when firing or recycling on the move.
      AliasConditionState = MOVING FIRING_B
      AliasConditionState = MOVING BETWEEN_FIRING_SHOTS_A
      AliasConditionState = MOVING BETWEEN_FIRING_SHOTS_B
      AliasConditionState = MOVING RELOADING_A
      AliasConditionState = MOVING RELOADING_B

      ConditionState = DYING
        Animation = UITunF_SKL.UITunF_DTA 
        Animation = UITunF_SKL.UITunF_DTB 
        AnimationMode = ONCE
        TransitionKey = TRANS_Dying
      End
      AliasConditionState = DYING FIRING_A ; Reborn: Keep the death animation when the unit dies while firing or recycling.
      AliasConditionState = DYING FIRING_B
      AliasConditionState = DYING BETWEEN_FIRING_SHOTS_A
      AliasConditionState = DYING BETWEEN_FIRING_SHOTS_B
      AliasConditionState = DYING RELOADING_A
      AliasConditionState = DYING RELOADING_B

      TransitionState = TRANS_Dying TRANS_Flailing
        Animation = UITunF_SKL.UITunF_ADTA1
        Animation = UITunF_SKL.UITunF_ADTE1
        Animation = UITunF_SKL.UITunF_ADTF1
        AnimationMode = ONCE
      End

      ConditionState = DYING EXPLODED_FLAILING
        Animation = UITunF_SKL.UITunF_ADTA2
        Animation = UITunF_SKL.UITunF_ADTE2
        Animation = UITunF_SKL.UITunF_ADTF2
        AnimationMode = LOOP
        TransitionKey = TRANS_Flailing
      End
      AliasConditionState = DYING EXPLODED_FLAILING FIRING_A
      AliasConditionState = DYING EXPLODED_FLAILING FIRING_B
      AliasConditionState = DYING EXPLODED_FLAILING BETWEEN_FIRING_SHOTS_A
      AliasConditionState = DYING EXPLODED_FLAILING BETWEEN_FIRING_SHOTS_B
      AliasConditionState = DYING EXPLODED_FLAILING RELOADING_A
      AliasConditionState = DYING EXPLODED_FLAILING RELOADING_B

      ConditionState = DYING EXPLODED_BOUNCING
        Animation = UITunF_SKL.UITunF_ADTA3
        Animation = UITunF_SKL.UITunF_ADTE3
        Animation = UITunF_SKL.UITunF_ADTF3
        AnimationMode = ONCE
        TransitionKey = None
      End
      AliasConditionState = DYING EXPLODED_BOUNCING FIRING_A
      AliasConditionState = DYING EXPLODED_BOUNCING FIRING_B
      AliasConditionState = DYING EXPLODED_BOUNCING BETWEEN_FIRING_SHOTS_A
      AliasConditionState = DYING EXPLODED_BOUNCING BETWEEN_FIRING_SHOTS_B
      AliasConditionState = DYING EXPLODED_BOUNCING RELOADING_A
      AliasConditionState = DYING EXPLODED_BOUNCING RELOADING_B

      ConditionState = FIRING_A 
        Animation = UITunF_SKL.UITunF_ATA 
        AnimationMode = ONCE
        TransitionKey = TRANS_START_FIRING
      End
      AliasConditionState = FIRING_B
      ConditionState = BETWEEN_FIRING_SHOTS_A
        Animation = UITunF_SKL.UITunF_STA
        AnimationMode = ONCE
        ; this is basically a trick: this guy has a nontrivial animation for firing,
        ; and a long recycle time between shots. we want him to finish his fire animation
        ; (unless he's ordered to do something else), so this is just a handy trick that
        ; says, "if the previous state had this transition key, allow it to finish before
        ; switching to us, if possible".
        WaitForStateToFinishIfPossible = TRANS_START_FIRING
      End
      AliasConditionState = BETWEEN_FIRING_SHOTS_B
      AliasConditionState = RELOADING_A
      AliasConditionState = RELOADING_B


      ConditionState = SPECIAL_CHEERING
        Animation = UITUNF_SKL.UITUNF_CHA
        AnimationMode = LOOP
      End

    End
  End

  ; *** DESIGN Parameters ***
  DisplayName = OBJECT:ToxinTunnelDefender

  Side        = GLAToxinGeneral

  WeaponSet
    Conditions          = None 
    Weapon              = PRIMARY   GC_Chem_TunnelDefenderRocketWeaponBeta
    AutoChooseSources   = PRIMARY   FROM_PLAYER FROM_AI FROM_SCRIPT
    Weapon              = SECONDARY GC_Chem_TunnelDefenderRocketWeaponBetaAir
    PreferredAgainst    = SECONDARY BALLISTIC_MISSILE AIRCRAFT
    ShareWeaponReloadTime = YES ; Reborn: Share reload time between the Toxin RPG Trooper's ground and anti-air weapons to prevent immediate follow-up shots when switching target types
  End
  WeaponSet
    Conditions          = PLAYER_UPGRADE
    Weapon              = PRIMARY   GC_Chem_TunnelDefenderRocketWeaponGamma
    AutoChooseSources   = PRIMARY   FROM_PLAYER FROM_AI FROM_SCRIPT
    Weapon              = SECONDARY GC_Chem_TunnelDefenderRocketWeaponGammaAir
    PreferredAgainst    = SECONDARY BALLISTIC_MISSILE AIRCRAFT
    ShareWeaponReloadTime = YES ; Reborn: Share reload time between the Toxin RPG Trooper's ground and anti-air weapons to prevent immediate follow-up shots when switching target types
  End  

  ; *** AUDIO Parameters ***
  VoiceSelect = ToxinRPGTrooperVoiceSelect
  VoiceAttack = ToxinRPGTrooperVoiceAttack
  UnitSpecificSounds
    VoiceCreate          = ToxinRPGTrooperVoiceCreate
    VoiceGarrison = RPGTrooperVoiceGarrison
    VoiceEnter = RPGTrooperVoiceMove
    VoiceEnterHostile = RPGTrooperVoiceMove
    VoiceGetHealed      = RPGTrooperVoiceMove
  End

  Behavior = WeaponSetUpgrade ModuleTag_13
    TriggeredBy   = Chem_Upgrade_GLAAnthraxGamma
  End

End
;------------------------------------------------------------------------------
