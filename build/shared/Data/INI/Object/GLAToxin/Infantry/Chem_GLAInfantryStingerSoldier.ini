;//////////////////////////////////////////////////////////////////////////////
;FILE: Chem_GLAInfantryStingerSoldier.ini
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
; Reborn: Inherit shared Stinger Soldier data while preserving the toxin model, Beta/Gamma weapons and lack of camouflage.
ObjectInherit Chem_GLAInfantryStingerSoldier GLAInfantryStingerSoldier

  UpgradeCameo1 = Upgrade_GLAAnthraxBeta
  UpgradeCameo2 = Chem_Upgrade_GLAAnthraxGamma
  UpgradeCameo3 = Upgrade_GLAAPRockets

  ; *** ART Parameters ***
  ; Reborn: Keep the complete original toxin draw module so every animation state retains its toxin model.
  ReplaceModule ModuleTag_01
    Draw = W3DModelDraw Chem_ModuleTag_01
      OkToChangeModelColor = Yes

      DefaultConditionState
        Model = UISMSDTOX_SKN
        IdleAnimation = UISmsd_SKL.UISmsd_STA 0 45
        IdleAnimation = UISmsd_SKL.UISmsd_IDA
        IdleAnimation = UISmsd_SKL.UISmsd_IDB
        IdleAnimation = UISmsd_SKL.UISmsd_IDC
        IdleAnimation = UISmsd_SKL.UISmsd_IDD
        AnimationMode = ONCE
        ; WeaponMuzzleFlash = PRIMARY MuzzleFX ; Reborn: UISMSDTOX_SKN has no MuzzleFX subobject; retain missile launch and fire FX bones below.
        WeaponFireFXBone = PRIMARY Exhaust
        WeaponLaunchBone = PRIMARY Muzzle
        WeaponFireFXBone = SECONDARY Exhaust
        WeaponLaunchBone = SECONDARY Muzzle

        WaitForStateToFinishIfPossible = TRANS_START_FIRING

      End
      AliasConditionState = BETWEEN_FIRING_SHOTS_A
      AliasConditionState = BETWEEN_FIRING_SHOTS_B
      AliasConditionState = RELOADING_A
      AliasConditionState = RELOADING_B

      ConditionState = MOVING
        Animation = UISmsd_SKL.UISmsd_WKB 25
        AnimationMode = LOOP
      End

      ConditionState = DYING
        Animation = UISmsd_SKL.UISmsd_DTA
        Animation = UISmsd_SKL.UISmsd_DTB
        AnimationMode = ONCE
        TransitionKey = TRANS_Dying
        WaitForStateToFinishIfPossible = NONE ; We got a Key from Default state, but Death does not need to wait for firing to finish
      End

      TransitionState = TRANS_Dying TRANS_Flailing
        Animation = UISmsd_SKL.UISmsd_ADTF1
        Animation = UISmsd_SKL.UISmsd_ADTG21
        AnimationMode = ONCE
      End

      ConditionState = DYING EXPLODED_FLAILING
        Animation = UISmsd_SKL.UISmsd_ADTF2
        Animation = UISmsd_SKL.UISmsd_ADTG22
        AnimationMode = LOOP
        TransitionKey = TRANS_Flailing
        WaitForStateToFinishIfPossible = NONE ; We got a Key from Default state, but Death does not need to wait for firing to finish
      End

      ConditionState = DYING EXPLODED_BOUNCING
        Animation = UISmsd_SKL.UISmsd_ADTF3
        Animation = UISmsd_SKL.UISmsd_ADTG23
        AnimationMode = ONCE
        TransitionKey = None
        WaitForStateToFinishIfPossible = NONE ; We got a Key from Default state, but Death does not need to wait for firing to finish
      End

      ConditionState = FIRING_A
        Animation = UISmsd_SKL.UISmsd_ATA
        AnimationMode = ONCE
        TransitionKey = TRANS_START_FIRING
      End
      ; AliasConditionState is a new keyword that says,
      ; "give me another ConditionState exactly like the previous
      ; one, except with different conditions". Useful when you
      ; have several states that are the same with only different condition bits.
      ; these aliases handle the moving-between-shots case. (we can't actually move-and-fire at the same time.).
      AliasConditionState = MOVING FIRING_A
      AliasConditionState = MOVING RELOADING_A

      ConditionState = FIRING_B
        Animation = UISmsd_SKL.UISmsd_ATB
        AnimationMode = ONCE
        TransitionKey = TRANS_START_FIRINGB
      End
      ; AliasConditionState is a new keyword that says,
      ; "give me another ConditionState exactly like the previous
      ; one, except with different conditions". Useful when you
      ; have several states that are the same with only different condition bits.
      ; these aliases handle the moving-between-shots case. (we can't actually move-and-fire at the same time.).
      AliasConditionState = MOVING FIRING_B
      AliasConditionState = MOVING RELOADING_B


      ConditionState = SPECIAL_CHEERING
        Animation = UISMSD_SKL.UISMSD_CHA
        AnimationMode = LOOP
      End

    End
  End

  ; ***DESIGN parameters ***
  Side = GLAToxinGeneral
  ReplaceModule WeaponSet
    Conditions          = None
    Weapon              = PRIMARY   Chem_StingerMissileWeaponBeta
    AutoChooseSources   = PRIMARY   FROM_PLAYER FROM_AI FROM_SCRIPT
    Weapon              = SECONDARY Chem_StingerMissileWeaponAirBeta
    PreferredAgainst    = SECONDARY BALLISTIC_MISSILE AIRCRAFT
  End
  WeaponSet
    Conditions          = PLAYER_UPGRADE
    Weapon              = PRIMARY   Chem_StingerMissileWeaponGamma
    AutoChooseSources   = PRIMARY   FROM_PLAYER FROM_AI FROM_SCRIPT
    Weapon              = SECONDARY Chem_StingerMissileWeaponAirGamma
    PreferredAgainst    = SECONDARY BALLISTIC_MISSILE AIRCRAFT
  End

  ReplaceModule Prerequisites
    Object = Chem_GLABarracks
  End

  ; *** ENGINEERING Parameters ***
  ; Reborn: Toxin soldiers do not have the base camouflage ability.
  RemoveModule ModuleTag_09
  RemoveModule ModuleTag_10

  ; Reborn: Retain the original Anthrax Gamma weapon-set upgrade.
  AddModule
    Behavior = WeaponSetUpgrade ModuleTag_15
      TriggeredBy = Chem_Upgrade_GLAAnthraxGamma
    End
  End

End
;------------------------------------------------------------------------------
