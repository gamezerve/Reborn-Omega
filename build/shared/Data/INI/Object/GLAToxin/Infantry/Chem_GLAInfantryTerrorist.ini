ObjectInherit Chem_GLAInfantryTerrorist GLAInfantryTerrorist

  SelectPortrait = Chem_SUTerrorist
  ButtonImage = Chem_SUTerrorist

  UpgradeCameo1 = Upgrade_GLAAnthraxBeta
  UpgradeCameo2 = Chem_Upgrade_GLAAnthraxGamma

  DisplayName = OBJECT:Chem_Terrorist
  Side = GLAToxinGeneral

  ReplaceModule Prerequisites
    Object = Chem_GLABarracks
  End

  OverrideModule ModuleTag_Death03
    OCL = INITIAL Chem_PoisonFieldGammaLarge
  End

  AddModule
    Behavior = FireWeaponWhenDeadBehavior ModuleTag91
      DeathWeapon = Chem_SuicideWeaponGamma
      StartsActive = No
      TriggeredBy = Chem_Upgrade_GLAAnthraxGamma
      RequiresAllTriggers = Yes
      DeathTypes = NONE +SUICIDED +CRUSHED +SPLATTED +LASERED +BURNED +EXPLODED
    End

    Behavior = FireWeaponWhenDeadBehavior ModuleTag_92
      DeathWeapon = Chem_SuicideWeaponBeta
      StartsActive = No
      TriggeredBy = Upgrade_GLAAnthraxBeta
      RequiresAllTriggers = Yes
      ConflictsWith = Chem_Upgrade_GLAAnthraxGamma
    End

    Behavior = FireWeaponWhenDeadBehavior ModuleTag_93
      DeathWeapon = Chem_SuicideWeapon
      StartsActive = No
      ConflictsWith = Upgrade_GLAAnthraxBeta Chem_Upgrade_GLAAnthraxGamma
    End
  End

End

