;------------------------------------------------------------------------------
; Reborn: Share base Rebel behavior and animation fixes while preserving faction-specific abilities.
ObjectInherit Chem_GLAInfantryRebel GLAInfantryRebel

  SelectPortrait = SUToxinRebel_L
  ButtonImage = SUToxinRebel_L

  UpgradeCameo1 = Upgrade_GLAAnthraxBeta
  UpgradeCameo2 = Chem_Upgrade_GLAAnthraxGamma
  UpgradeCameo3 = Upgrade_GLACamouflage
  UpgradeCameo4 = Upgrade_InfantryCaptureBuilding
  UpgradeCameo5 = Upgrade_GLAInfantryRebelBoobyTrapAttack

  ; Reborn: Preserve toxin models, muzzle bones and firing animation with the base alias fixes.

  ReplaceModule ModuleTag_01
    Draw = W3DModelDraw Chem_ModuleTag_01
      OkToChangeModelColor = Yes
      ParticlesAttachedToAnimatedBones = Yes
      IgnoreConditionStates = PREATTACK_A FIRING_A BETWEEN_FIRING_SHOTS_A RELOADING_A
      DefaultConditionState
        Model = UIRGrdTOX_SKN
        IdleAnimation = UIRGrd_SKL.UIRGrd_STN 0 35
        IdleAnimation = UIRGrd_SKL.UIRGrd_IDA
        IdleAnimation = UIRGrd_SKL.UIRGrd_IDB
        AnimationMode = ONCE
        WeaponFireFXBone = PRIMARY Muzzle01
        WeaponLaunchBone = PRIMARY Muzzle01
        HideSubObject = MuzzleFX01
        TransitionKey = TRANS_Standing
        WaitForStateToFinishIfPossible = Trans_Taunting
      End
      ConditionState = REALLYDAMAGED
        IdleAnimation = UIRGrd_SKL.UIRGrd_STB 0 35
        IdleAnimation = UIRGrd_SKL.UIRGrd_IDC
        IdleAnimation = UIRGrd_SKL.UIRGrd_IDD
        AnimationMode = ONCE
        TransitionKey = TRANS_StandingHurt
        WaitForStateToFinishIfPossible = Trans_Taunting_Damaged
      End
      ConditionState = MOVING
        Animation = UIRGrd_SKL.UIRGrd_RNA 15
        AnimationMode = LOOP
        TransitionKey = TRANS_Walking
        ParticleSysBone = None InfantryDustTrails
        WaitForStateToFinishIfPossible = NADA
      End
      AliasConditionState = MOVING ATTACKING
      ; Reborn: Keep walking when taunting while moving; avoid an ambiguous match with the stationary taunt state.
      AliasConditionState = MOVING ACTIVELY_CONSTRUCTING
      ConditionState = MOVING REALLYDAMAGED
        Animation = UIRGrd_SKL.UIRGrd_RNB 25
        AnimationMode = LOOP
        TransitionKey = TRANS_WalkingHurt
        ParticleSysBone = None InfantryDustTrails
        WaitForStateToFinishIfPossible = NADA
      End
      AliasConditionState = MOVING ATTACKING REALLYDAMAGED
      ; Reborn: Keep walking when taunting while moving; avoid an ambiguous match with the stationary taunt state.
      AliasConditionState = MOVING ACTIVELY_CONSTRUCTING REALLYDAMAGED
      ConditionState = DYING
        Animation = UIRGrd_SKL.UIRGrd_DTA
        Animation = UIRGrd_SKL.UIRGrd_DTB
        AnimationMode = ONCE
        TransitionKey = TRANS_Dying
        WaitForStateToFinishIfPossible = NADA
      End
      AliasConditionState = DYING USING_WEAPON_A
      TransitionState = TRANS_Dying TRANS_Flailing
        Animation = UIRGrd_SKL.UIRGrd_ADTE1
        AnimationMode = ONCE
      End
      ConditionState = DYING EXPLODED_FLAILING
        Animation = UIRGrd_SKL.UIRGrd_ADTE2
        AnimationMode = LOOP
        TransitionKey = TRANS_Flailing
        WaitForStateToFinishIfPossible = NADA
      End
      AliasConditionState = DYING EXPLODED_FLAILING USING_WEAPON_A
      ConditionState = DYING EXPLODED_BOUNCING
        Animation = UIRGrd_SKL.UIRGrd_ADTE3
        AnimationMode = ONCE
        TransitionKey = None
        WaitForStateToFinishIfPossible = NADA
      End
      AliasConditionState = DYING EXPLODED_BOUNCING USING_WEAPON_A
      ConditionState = SPECIAL_CHEERING
        Animation = UIRGrd_SKL.UIRGrd_CHA
        AnimationMode = LOOP
        WaitForStateToFinishIfPossible = NADA
      End
      ConditionState = SPECIAL_CHEERING REALLYDAMAGED
        Animation = UIRGrd_SKL.UIRGrd_CHB
        AnimationMode = LOOP
        WaitForStateToFinishIfPossible = NADA
      End
      ConditionState = ACTIVELY_CONSTRUCTING
        Animation = UIRGrd_SKL.UIRGrd_CHA
        AnimationMode = LOOP
        Flags = RANDOMSTART
        TransitionKey = Trans_Taunting
        WaitForStateToFinishIfPossible = NADA
      End
      ConditionState = ACTIVELY_CONSTRUCTING REALLYDAMAGED
        Animation = UIRGrd_SKL.UIRGrd_CHB
        AnimationMode = LOOP
        Flags = RANDOMSTART
        TransitionKey = Trans_Taunting_Damaged
        WaitForStateToFinishIfPossible = NADA
      End
      ConditionState = USING_WEAPON_A
        Animation = UIRGrd_SKL.UIRGrd_ATA3
        AnimationMode = LOOP
        TransitionKey = TRANS_Firing
        WaitForStateToFinishIfPossible = NADA
      End
      AliasConditionState = ACTIVELY_CONSTRUCTING USING_WEAPON_A
      ConditionState = USING_WEAPON_A REALLYDAMAGED
        Animation = UIRGrd_SKL.UIRGrd_ATA2
        AnimationMode = LOOP
        TransitionKey = TRANS_FiringHurt
        WaitForStateToFinishIfPossible = NADA
      End
      AliasConditionState = ACTIVELY_CONSTRUCTING USING_WEAPON_A REALLYDAMAGED
      TransitionState = TRANS_Standing TRANS_Firing
        Animation = UIRGrd_SKL.UIRGrd_ATAST
        AnimationMode = ONCE
      End
      TransitionState = TRANS_Firing TRANS_Standing
        Animation = UIRGrd_SKL.UIRGrd_ATAED
        AnimationMode = ONCE
      End
      TransitionState = TRANS_StandingHurt TRANS_FiringHurt
        Animation = UIRGrd_SKL.UIRGrd_ATA2ED
        AnimationMode = ONCE_BACKWARDS
      End
      TransitionState = TRANS_FiringHurt TRANS_StandingHurt
        Animation = UIRGrd_SKL.UIRGrd_ATA2ED
        AnimationMode = ONCE
      End
      TransitionState = TRANS_Standing TRANS_StandingHurt
        Animation = UIRGrd_SKL.UIRGrd_ATA2ED
        AnimationMode = ONCE
      End
      ConditionState = UNPACKING
        Model = UIRGrdTOXF_SKN
        Animation = UIRGrd_F_SKL.UIRGrd_F_FDP1
        AnimationMode = ONCE
        WaitForStateToFinishIfPossible = NADA
      End
      AliasConditionState = UNPACKING REALLYDAMAGED
      ConditionState = RAISING_FLAG
        Model = UIRGrdTOXF_SKN
        Animation = UIRGrd_F_SKL.UIRGrd_F_FDP2
        AnimationMode = ONCE
        TransitionKey = TRANS_Raising
        WaitForStateToFinishIfPossible = NADA
      End
      AliasConditionState = RAISING_FLAG REALLYDAMAGED
      ConditionState = PACKING
        Model = UIRGrdTOXF_SKN
        Animation = UIRGrd_F_SKL.UIRGrd_F_FDP1
        AnimationMode = ONCE_BACKWARDS
        Flags = START_FRAME_LAST
        TransitionKey = TRANS_Packing
        WaitForStateToFinishIfPossible = NADA
      End
      AliasConditionState = PACKING REALLYDAMAGED
      TransitionState = TRANS_Raising TRANS_Packing
        Model = UIRGrdTOXF_SKN
        Animation = UIRGrd_F_SKL.UIRGrd_F_FDP2
        AnimationMode = ONCE_BACKWARDS
        Flags = START_FRAME_LAST
      End
    End
  End

  DisplayName = OBJECT:Chem_Rebel
  Side = GLAToxinGeneral

  WeaponSet
    Conditions = None
    Weapon = PRIMARY GC_Chem_GLARebelGunBeta
  End

  WeaponSet
    Conditions = PLAYER_UPGRADE
    Weapon = PRIMARY GC_Chem_GLARebelGunGamma
  End

  ArmorSet
    Conditions = None
    Armor = ChemReb_HumanArmor
    DamageFX = InfantryDamageFX
  End

  ReplaceModule Prerequisites
    Object = Chem_GLABarracks
  End

  BuildCost = 200

  ExperienceValue = 25 30 35 45

  CommandSet = Chem_GLAInfantryRebelCommandSet

  VoiceSelect = ToxinRebelVoiceSelect
  VoiceAttack = ToxinRebelVoiceAttack

  UnitSpecificSounds
    VoiceCreate = ToxinRebelVoiceCreate
    VoiceSubdue = RebelVoiceSubdue
    VoiceGarrison = RebelVoiceGarrison
    VoiceEnter = RebelVoiceMove
    VoiceEnterHostile = RebelVoiceMove
    VoiceGetHealed = RebelVoiceMove
  End

  AddModule
    Behavior = WeaponSetUpgrade ModuleTag_08
      TriggeredBy = Chem_Upgrade_GLAAnthraxGamma
    End
  End

  ReplaceModule ModuleTag_09
    Behavior = WeaponBonusUpgrade Chem_ModuleTag_09
    End
  End

  AddModule
    Behavior = CommandSetUpgrade ModuleTag_23
      TriggeredBy = Upgrade_GLAInfantryRebelBoobyTrapAttack
      CommandSet = GLAInfantryRebelCommandSet
    End
  End

End
