;//////////////////////////////////////////////////////////////////////////////
;FILE: Lazr_AmericaInfantryRanger.ini
;//////////////////////////////////////////////////////////////////////////////
; Reborn: Inherit shared Ranger animations, USA toxin death effects, stats and behaviors.
ObjectInherit Lazr_AmericaInfantryRanger AmericaInfantryRanger

  SelectPortrait = Lazr_SARanger
  ButtonImage = Lazr_SARanger
  
  DisplayName = OBJECT:LaserRanger
  Side = AmericaLaserGeneral

  ReplaceModule Prerequisites
    Object = Lazr_AmericaBarracks
  End

  CommandSet = Lazr_AmericaInfantryRangerCommandSet

  ReplaceModule WeaponSet
    Conditions = None 
    Weapon = PRIMARY RangerLaserRifle
  End
  ReplaceModule WeaponSet
    Conditions = PLAYER_UPGRADE 
    Weapon = PRIMARY RangerLaserRifle
    Weapon = SECONDARY RangerFlashBangGrenadeWeapon
    AutoChooseSources = PRIMARY FROM_SCRIPT FROM_AI DEFAULT_SWITCH_WEAPON
    AutoChooseSources = SECONDARY FROM_SCRIPT FROM_AI
    WeaponLockSharedAcrossSets = Yes ; This set is so similar to the default set that it can hold the weapon lock
  End

  VoiceSelect = LaserRangerVoiceSelect
  VoiceMove = LaserRangerVoiceMove
  VoiceGuard = LaserRangerVoiceMove
  VoiceAttack = LaserRangerVoiceAttack

  UnitSpecificSounds
    VoiceEnter = RangerVoiceMove
    VoiceEnterHostile = LaserRangerVoiceMove
    VoiceGarrison = RangerVoiceGarrison
    VoiceCreate         = LaserRangerVoiceCreate
    VoiceSubdue         = RangerVoiceSubdue
    VoiceClearBuilding  = RangerVoiceClearBuilding
    VoiceGetHealed      = LaserRangerVoiceMove
    VoicePrimaryWeaponMode = LaserRangerVoiceModeGun
    VoiceSecondaryWeaponMode = RangerVoiceModeFlashBang
  End

End
