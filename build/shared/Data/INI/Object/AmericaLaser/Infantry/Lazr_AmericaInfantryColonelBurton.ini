;------------------------------------------------------------------------------
; Reborn: Inherit the USA Colonel Burton and keep only the Laser General differences. The gamma toxin death now uses the USA death sound like the base. Uses the base command set; its own copy was identical.
ObjectInherit Lazr_AmericaInfantryColonelBurton AmericaInfantryColonelBurton

  ; *** ART Parameters ***
  SelectPortrait         = LaserColonel
  ButtonImage            = LaserColonel

  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:LazerColonelBurton
  Side                = AmericaLaserGeneral

  WeaponSet
    Conditions          = None
    Weapon              = PRIMARY     ColonelBurtonLaserRifle
    Weapon              = SECONDARY   ColonelBurtonKnifeWeapon
    AutoChooseSources   = PRIMARY     FROM_PLAYER FROM_SCRIPT FROM_AI
    AutoChooseSources   = SECONDARY   NONE
  End

  ReplaceModule Prerequisites
    Object = Lazr_AmericaBarracks
    Object = Lazr_AmericaStrategyCenter
  End

  ; *** AUDIO Parameters ***
  VoiceSelect = LaserColonelBurtonVoiceSelect
  VoiceAttack = LaserColonelBurtonVoiceAttack

  ; Reborn: UnitSpecificSounds replaces the whole inherited list, so every entry is repeated here.
  UnitSpecificSounds
    VoiceMelee            = ColonelBurtonVoiceAttackKnife
    VoiceCreate           = LaserColonelBurtonVoiceCreate
    VoiceGarrison         = ColonelBurtonVoiceGarrison
    VoiceEnter            = ColonelBurtonVoiceMove
    VoiceEnterHostile     = ColonelBurtonVoiceMove
    VoiceGetHealed        = ColonelBurtonVoiceMove
  End

End
;------------------------------------------------------------------------------
