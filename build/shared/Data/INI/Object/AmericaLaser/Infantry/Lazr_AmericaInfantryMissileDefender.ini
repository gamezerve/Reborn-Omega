;------------------------------------------------------------------------------
; Reborn: Inherit shared Missile Defender animations, behavior and USA toxin-death effects.
ObjectInherit Lazr_AmericaInfantryMissileDefender AmericaInfantryMissileDefender

  ; *** ART Parameters ***
  SelectPortrait = LaserDefender
  ButtonImage = LaserDefender

  ; ***DESIGN parameters ***
  DisplayName = OBJECT:LazerDefender
  Side = AmericaLaserGeneral

  ; Reborn: Replace the complete inherited weapon set so Laser Defender keeps only its original primary weapon.
  ReplaceModule WeaponSet
    Conditions = None
    Weapon = PRIMARY LaserDefender
  End

  ; Reborn: Require the matching faction Barracks.
  ReplaceModule Prerequisites
    Object = Lazr_AmericaBarracks
  End

  CommandSet = GenericCommandSet

End
;------------------------------------------------------------------------------
