ObjectInherit Lazr_AmericaAirfield AmericaAirfield

  ; *** ART Parameters ***
  ; Reborn: Inherit all shared airfield draws, including the construction-state fixes.
  SelectPortrait         = Lazr_SAACommand
  ButtonImage            = Lazr_SAACommand

  ; ***DESIGN parameters ***
  Side                   = AmericaLaserGeneral
  ; Reborn: Keep the faction's original supply-center prerequisite.
  ReplaceModule Prerequisites
    Object = Lazr_AmericaSupplyCenter
  End
  CommandSet             = Lazr_AmericaAirfieldCommandSet

  ; *** ENGINEERING Parameters ***
  ; Reborn: Preserve the faction-specific Rangers released when the completed airfield is destroyed.
  OverrideModule ModuleTag_16
    CreationList = Lazr_OCL_AmericanRangerDebris02
  End

End
