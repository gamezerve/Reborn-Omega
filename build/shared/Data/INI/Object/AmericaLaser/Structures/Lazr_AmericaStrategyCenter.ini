ObjectInherit Lazr_AmericaStrategyCenter AmericaStrategyCenter

  ; *** ART Parameters ***
  SelectPortrait         = Lazr_SAStrategyCenter
  ButtonImage            = Lazr_SAStrategyCenter

  ; ***DESIGN parameters ***
  Side                   = AmericaLaserGeneral
  ReplaceModule Prerequisites
    Object = Lazr_AmericaWarFactory Lazr_AmericaAirfield
  End
  CommandSet             = Lazr_AmericaStrategyCenterCommandSet

  ; *** ENGINEERING Parameters ***
  ; Reborn: Preserve the faction-specific Rangers released when the completed strategy center is destroyed.
  OverrideModule ModuleTag_19
    CreationList = Lazr_OCL_AmericanRangerDebris04
  End

  ; Reborn: Call in the faction-specific Special Forces.
  OverrideModule ModuleTag_24
    OCL = Lazr_SUPERWEAPON_SpecialForces
  End

End
;------------------------------------------------------------------------------
