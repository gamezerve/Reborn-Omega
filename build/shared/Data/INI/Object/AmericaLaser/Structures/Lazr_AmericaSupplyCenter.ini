ObjectInherit Lazr_AmericaSupplyCenter AmericaSupplyCenter

  ; *** ART Parameters ***
  SelectPortrait         = Lazr_SASupplyCntr
  ButtonImage            = Lazr_SASupplyCntr

  ; ***DESIGN parameters ***
  Side                   = AmericaLaserGeneral
  ReplaceModule Prerequisites
    Object = Lazr_AmericaPowerPlant
  End
  CommandSet             = Lazr_AmericaSupplyCenterCommandSet

  ; *** ENGINEERING Parameters ***
  ; Reborn: Preserve the faction-specific Rangers released when the completed supply center is destroyed.
  OverrideModule ModuleTag_08
    CreationList = Lazr_OCL_AmericanRangerDebris03
  End

  ; Reborn: Spawn the faction-specific supply Chinook.
  OverrideModule ModuleTag_12
    SpawnTemplateNameOverride = Lazr_AmericaVehicleChinook
  End

End
