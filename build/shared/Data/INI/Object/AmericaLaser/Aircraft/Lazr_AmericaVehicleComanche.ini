;//////////////////////////////////////////////////////////////////////////////
;FILE: Lazr_AmericaVehicleComanche.ini ////////////////////////////////////////
;//////////////////////////////////////////////////////////////////////////////
;------------------------------------------------------------------------------
ObjectInherit Lazr_AmericaVehicleComanche AmericaVehicleComanche

  ; *** ART Parameters ***
  SelectPortrait         = Lazr_SACCommanche
  ButtonImage            = Lazr_SACCommanche

  ReplaceModule ModuleTag_01
    Draw = W3DModelDraw Lazr_ModuleTag_01

      DefaultConditionState
        Model                           = AVComanche
        HideSubObject                   = MissileUpgrade
        Animation                       = AVComanche.AVComanche
        AnimationMode                   = LOOP
        WeaponMuzzleFlash               = PRIMARY TurretFX
        WeaponFireFXBone                = PRIMARY Muzzle
        WeaponFireFXBone                = SECONDARY WeaponB
        WeaponLaunchBone                = SECONDARY WeaponB
      End

      ConditionState = REALLYDAMAGED
        Model                           = AVComanche_d
        Animation                       = AVComanche_d.AVComanche_d
        AnimationMode                   = LOOP
      End

      ConditionState = WEAPONSET_PLAYER_UPGRADE
        ShowSubObject                   = MissileUpgrade
        Animation                       = AVComanche.AVComanche
        AnimationMode                   = LOOP
        WeaponFireFXBone                = TERTIARY WeaponB
        WeaponLaunchBone                = TERTIARY WeaponB
      End

      ConditionState = WEAPONSET_PLAYER_UPGRADE REALLYDAMAGED
        Model                           = AVComanche_d
        ShowSubObject                   = MissileUpgrade
        Animation                       = AVComanche_d.AVComanche_d
        AnimationMode                   = LOOP
        WeaponFireFXBone                = TERTIARY WeaponB
        WeaponLaunchBone                = TERTIARY WeaponB
      End

      ConditionState = RUBBLE
        Model                           = AVComanche_d
        Animation                       = AVComanche_d.AVComanche_d
        AnimationMode                   = LOOP
      End

      ConditionState = RUBBLE SPECIAL_DAMAGED
        Model                           = AVComanche_d
        HideSubObject                   = AVComanche_Prop
      End

      ConditionState = WEAPONSET_PLAYER_UPGRADE RUBBLE
        Model                           = AVComanche_d
        ShowSubObject                   = MissileUpgrade
        Animation                       = AVComanche_d.AVComanche_d
        AnimationMode                   = LOOP
      End

      ConditionState = WEAPONSET_PLAYER_UPGRADE RUBBLE SPECIAL_DAMAGED
        Model                           = AVComanche_d
        ShowSubObject                   = MissileUpgrade
        HideSubObject                   = AVComanche_Prop
      End

      OkToChangeModelColor = Yes
    End
  End

  ; ***DESIGN parameters ***
  DisplayName         = OBJECT:LaserComanche
  Side                = AmericaLaserGeneral

  ReplaceModule Prerequisites
    Object            = Lazr_AmericaAirfield
  End

  WeaponSet
    Conditions          = None
    Weapon              = PRIMARY     ComancheLaserTurret
    PreferredAgainst    = PRIMARY     INFANTRY
    AutoChooseSources   = PRIMARY     FROM_PLAYER FROM_SCRIPT FROM_AI
    Weapon              = SECONDARY   ComancheAntiTankMissileWeapon
    PreferredAgainst    = SECONDARY   VEHICLE STRUCTURE
    AutoChooseSources   = SECONDARY   FROM_PLAYER FROM_SCRIPT FROM_AI
    Weapon              = TERTIARY    NONE
  End

  WeaponSet
    Conditions          = PLAYER_UPGRADE
    Weapon              = PRIMARY     ComancheLaserTurret
    PreferredAgainst    = PRIMARY     INFANTRY
    AutoChooseSources   = PRIMARY     FROM_PLAYER FROM_SCRIPT FROM_AI
    Weapon              = SECONDARY   ComancheAntiTankMissileWeapon
    PreferredAgainst    = SECONDARY   VEHICLE STRUCTURE
    AutoChooseSources   = SECONDARY   FROM_PLAYER FROM_SCRIPT FROM_AI
    Weapon              = TERTIARY    ComancheRocketPodWeapon
    AutoChooseSources   = TERTIARY    NONE
  End

  ; *** AUDIO Parameters ***
  VoiceSelect           = LaserComancheVoiceSelect
  VoiceAttack           = LaserComancheVoiceAttack
  VoiceAttackAir        = LaserComancheVoiceAttack

  UnitSpecificSounds
    VoiceCreate         = LaserComancheVoiceCreate
    SoundEject          = PilotSoundEject
    VoiceEject          = PilotVoiceEject
    Afterburner         = RaptorAfterburner
    VoiceGarrison       = ComancheVoiceMove
    TurretMoveStart     = NoSound
    TurretMoveLoop      = NoSound
    VoiceFireRocketPods = ComancheVoiceAttackRocket
  End

  ; *** ENGINEERING Parameters ***
  OverrideModule ModuleTag_10
    EvasionRate = 50%
  End

End
;------------------------------------------------------------------------------
